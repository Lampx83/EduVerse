<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🏫 Tạo trường mới · Tizia Admin</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text); background:var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }
  .progress { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .progress .pip {
    width:30px; height:5px; border-radius:3px; background:rgba(255,255,255,.08);
    transition:background .25s;
  }
  .progress .pip.cur { background:var(--accent); }
  .progress .pip.done { background:var(--good); }

  .wrap { max-width:760px; margin:30px auto 80px; padding:0 18px; }

  .step { background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:24px; }
  .step h2 { margin:0 0 4px; font-size:22px;
    background:linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .step .sub { color:var(--text-soft); font-size:13.5px; margin-bottom:18px; }

  label { display:block; font-size:11px; letter-spacing:.6px; color:var(--text-soft);
    font-weight:700; text-transform:uppercase; margin:14px 0 6px; }
  input, select, textarea {
    width:100%; padding:10px 14px; border-radius:10px;
    background:rgba(0,0,0,.3); border:1px solid var(--border);
    color:#fff; font-family:inherit; font-size:14px;
  }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color:var(--accent);
  }
  .icon-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .icon-row .ic {
    width:42px; height:42px; border-radius:10px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:22px; transition:background .12s, border-color .12s;
  }
  .icon-row .ic.cur { background:rgba(251,191,36,.15); border-color:var(--accent); }

  .class-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .class-row {
    display:grid; grid-template-columns: 80px 1fr 1fr 36px; gap:8px;
    align-items:center;
  }
  .class-row input { padding:7px 10px; font-size:13px; }
  .class-row .rm { background:rgba(239,68,68,.12); color:var(--bad); border:1px solid rgba(239,68,68,.3);
    border-radius:8px; padding:8px; cursor:pointer; font-size:13px; }
  .add-row { background:rgba(167,139,250,.10); border:1px dashed rgba(167,139,250,.4);
    color:var(--purple); padding:10px; border-radius:10px; cursor:pointer;
    text-align:center; font-weight:700; font-size:13px; }
  .add-row:hover { background:rgba(167,139,250,.18); }
  .preset-btn { padding:6px 12px; border-radius:10px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    cursor:pointer; font-size:12px; color:#fff; margin-right:6px; }
  .preset-btn:hover { background:rgba(255,255,255,.10); }

  .csv-box { width:100%; min-height:200px; resize:vertical;
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    background:rgba(0,0,0,.4); }
  .csv-tip { font-size:12px; color:var(--text-soft); margin-top:8px;
    line-height:1.6; }
  .csv-tip code { background:rgba(167,139,250,.18); padding:1px 6px; border-radius:4px;
    color:#c4b5fd; font-family:'JetBrains Mono'; font-size:11.5px; }

  .summary-box { background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.3);
    border-radius:14px; padding:18px; margin-bottom:14px; }
  .summary-box h3 { margin:0 0 10px; color:var(--good); font-size:16px; }
  .summary-box dl { margin:0; }
  .summary-box dt { font-size:11px; letter-spacing:.6px; color:var(--text-soft);
    text-transform:uppercase; font-weight:700; margin-top:8px; }
  .summary-box dd { margin:0; font-size:14px; font-weight:700; }
  .credentials-list { max-height:300px; overflow-y:auto; padding:14px;
    background:rgba(0,0,0,.3); border:1px solid var(--border); border-radius:12px;
    font-family:'JetBrains Mono', monospace; font-size:12px; margin-top:10px; }
  .credentials-list .line { padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  .credentials-list .line:last-child { border-bottom:none; }

  .nav-buttons { display:flex; gap:10px; margin-top:20px; }
  .nav-buttons button {
    padding:11px 24px; border-radius:12px; border:none; cursor:pointer;
    font:800 14px 'Inter', system-ui, sans-serif;
  }
  .nav-buttons .next {
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    margin-left:auto; box-shadow:0 6px 18px rgba(251,146,60,.3);
  }
  .nav-buttons .next:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .nav-buttons .prev { background:rgba(255,255,255,.08); color:#fff; }
  .msg { padding:10px 14px; border-radius:10px; margin-top:14px; font-size:13px; }
  .msg.err { background:rgba(239,68,68,.10); color:#fda4af; border-left:3px solid var(--bad); }
  .msg.ok { background:rgba(34,197,94,.10); color:#86efac; border-left:3px solid var(--good); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="../js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/admin.html">← Admin</a>
  <h1>🏫 Wizard tạo trường mới</h1>
  <div class="progress" id="progress">
    <div class="pip cur"></div>
    <div class="pip"></div>
    <div class="pip"></div>
    <div class="pip"></div>
  </div>
</div>

<div class="wrap">
  <div class="step" id="step-host"></div>
</div>

<script type="module">
const state = {
  step: 0,
  school: { code:'', name:'', domain:'', tagline:'', icon:'🏫' },
  classes: [],
  studentsCsv: '',
  schoolId: null,
  importResult: null,
};

const ICONS = ['🏫','🎓','🏛','🏬','🎒','📚','🦉','🌟','🚀','🎨','⚗','💻','🌍','🧬','🎭','🛡'];

function renderProgress() {
  document.querySelectorAll('.progress .pip').forEach((p, i) => {
    p.classList.toggle('cur', i === state.step);
    p.classList.toggle('done', i < state.step);
  });
}

function step1() {
  state.step = 0; renderProgress();
  document.getElementById('step-host').innerHTML = `
    <h2>Bước 1 — Thông tin trường</h2>
    <div class="sub">Đặt tên, code và icon cho trường mới. Code sẽ thành 1 phần URL (vd: <code>tizia.vn/?school=tcnt</code>).</div>
    <label>Tên trường</label>
    <input id="f-name" maxlength="100" placeholder="VD: Trường THCS Tân Phú" value="${esc(state.school.name)}">
    <label>Code (không dấu, không cách)</label>
    <input id="f-code" maxlength="30" placeholder="VD: tcnt" value="${esc(state.school.code)}">
    <label>Domain (subdomain hoặc tag, optional)</label>
    <input id="f-domain" maxlength="40" placeholder="VD: tcnt.tizia.vn hoặc 'secondary'" value="${esc(state.school.domain)}">
    <label>Khẩu hiệu / mô tả ngắn</label>
    <input id="f-tag" maxlength="200" placeholder="VD: Trường THCS năng động, học sáng tạo" value="${esc(state.school.tagline)}">
    <label>Icon</label>
    <div class="icon-row" id="f-icons"></div>
    <div id="msg"></div>
    <div class="nav-buttons">
      <button class="next" data-next disabled>Tiếp tục →</button>
    </div>
  `;
  const icons = document.getElementById('f-icons');
  ICONS.forEach(ic => {
    const el = document.createElement('div');
    el.className = 'ic' + (ic === state.school.icon ? ' cur' : '');
    el.textContent = ic;
    el.addEventListener('click', () => {
      icons.querySelectorAll('.ic').forEach(x => x.classList.remove('cur'));
      el.classList.add('cur');
      state.school.icon = ic;
    });
    icons.appendChild(el);
  });
  ['name','code','domain','tag'].forEach(k => {
    document.getElementById('f-' + k).addEventListener('input', validateStep1);
  });
  document.querySelector('[data-next]').addEventListener('click', async () => {
    state.school.name = document.getElementById('f-name').value.trim();
    state.school.code = document.getElementById('f-code').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
    state.school.domain = document.getElementById('f-domain').value.trim();
    state.school.tagline = document.getElementById('f-tag').value.trim();
    const msg = document.getElementById('msg');
    msg.innerHTML = '';
    try {
      const r = await fetch('/api/admin/school/create', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state.school), credentials:'same-origin',
      });
      const d = await r.json();
      if (!r.ok) { msg.innerHTML = `<div class="msg err">${esc(d.error || 'Lỗi')}</div>`; return; }
      state.schoolId = d.school.id;
      step2();
    } catch (e) {
      msg.innerHTML = `<div class="msg err">Lỗi mạng: ${esc(e.message)}</div>`;
    }
  });
  validateStep1();
}

function validateStep1() {
  const name = document.getElementById('f-name')?.value.trim();
  const code = document.getElementById('f-code')?.value.trim();
  const btn = document.querySelector('[data-next]');
  if (btn) btn.disabled = !(name && code);
}

function step2() {
  state.step = 1; renderProgress();
  if (state.classes.length === 0) {
    // Auto-suggest 12 lớp
    state.classes = Array.from({length:12}, (_, i) => ({
      code: 'L' + (i+1) + 'A', name: 'Lớp ' + (i+1) + 'A', teacher_name: '',
    }));
  }
  renderStep2Body();
}

function renderStep2Body() {
  document.getElementById('step-host').innerHTML = `
    <h2>Bước 2 — Tạo các lớp</h2>
    <div class="sub">Thêm danh sách lớp cho trường <b>${esc(state.school.name)}</b>. Mã lớp duy nhất, dùng cho HS đăng ký.</div>
    <div style="margin-bottom:10px">
      <button class="preset-btn" data-preset="tieu-hoc">Tiểu học (L1A–L5A)</button>
      <button class="preset-btn" data-preset="thcs">THCS (L6A–L9A)</button>
      <button class="preset-btn" data-preset="thpt">THPT (L10A–L12C)</button>
      <button class="preset-btn" data-preset="clear">🗑 Xóa hết</button>
    </div>
    <div class="class-list" id="cl"></div>
    <div class="add-row" id="add-cl">+ Thêm lớp</div>
    <div id="msg"></div>
    <div class="nav-buttons">
      <button class="prev" data-prev>← Quay lại</button>
      <button class="next" data-next>Lưu & tiếp tục →</button>
    </div>
  `;
  renderClassList();
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
  document.getElementById('add-cl').addEventListener('click', () => {
    state.classes.push({ code:'', name:'', teacher_name:'' });
    renderClassList();
  });
  document.querySelector('[data-prev]').addEventListener('click', () => step1());
  document.querySelector('[data-next]').addEventListener('click', saveClasses);
}

function renderClassList() {
  const cl = document.getElementById('cl');
  cl.innerHTML = state.classes.map((c, i) => `
    <div class="class-row">
      <input data-i="${i}" data-k="code" placeholder="Mã" value="${esc(c.code)}">
      <input data-i="${i}" data-k="name" placeholder="Tên lớp" value="${esc(c.name)}">
      <input data-i="${i}" data-k="teacher_name" placeholder="Tên GV (optional)" value="${esc(c.teacher_name)}">
      <button class="rm" data-rm="${i}">×</button>
    </div>
  `).join('');
  cl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = Number(inp.dataset.i); const k = inp.dataset.k;
      state.classes[i][k] = e.target.value;
    });
  });
  cl.querySelectorAll('[data-rm]').forEach(b => {
    b.addEventListener('click', () => {
      state.classes.splice(Number(b.dataset.rm), 1);
      renderClassList();
    });
  });
}

function applyPreset(p) {
  if (p === 'clear') { state.classes = []; renderClassList(); return; }
  const presets = {
    'tieu-hoc': [1,2,3,4,5].map(g => [{ code:'L'+g+'A', name:'Lớp '+g+'A', teacher_name:'' }]).flat(),
    'thcs':     [6,7,8,9].map(g => [{ code:'L'+g+'A', name:'Lớp '+g+'A', teacher_name:'' }]).flat(),
    'thpt':     [10,11,12].flatMap(g => ['A','B','C'].map(s => ({ code:'L'+g+s, name:'Lớp '+g+s, teacher_name:'' }))),
  };
  state.classes = presets[p];
  renderClassList();
}

async function saveClasses() {
  const valid = state.classes.filter(c => c.code.trim() && c.name.trim());
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  if (valid.length === 0) { msg.innerHTML = `<div class="msg err">Thêm ít nhất 1 lớp</div>`; return; }
  try {
    const r = await fetch(`/api/admin/school/${state.schoolId}/seed-classes`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ classes: valid }), credentials:'same-origin',
    });
    const d = await r.json();
    if (!r.ok) { msg.innerHTML = `<div class="msg err">${esc(d.error || 'Lỗi')}</div>`; return; }
    step3();
  } catch (e) {
    msg.innerHTML = `<div class="msg err">Lỗi: ${esc(e.message)}</div>`;
  }
}

function step3() {
  state.step = 2; renderProgress();
  document.getElementById('step-host').innerHTML = `
    <h2>Bước 3 — Import học sinh</h2>
    <div class="sub">Dán danh sách HS (CSV) — mỗi dòng 1 HS. Bỏ qua bước này nếu HS tự đăng ký.</div>
    <label>CSV (username, display_name, grade)</label>
    <textarea class="csv-box" id="csv" placeholder="vd: minh.nguyen, Nguyễn Văn Minh, 6
linh.tran, Trần Thị Linh, 7"></textarea>
    <div class="csv-tip">
      Format: <code>username, display_name, grade</code> — mỗi dòng 1 HS.<br>
      Mật khẩu sẽ được tự sinh (6 chữ số) và hiển thị ở bước tổng kết.
    </div>
    <div id="msg"></div>
    <div class="nav-buttons">
      <button class="prev" data-prev>← Quay lại</button>
      <button class="next" data-next>Import & xem kết quả →</button>
    </div>
  `;
  document.getElementById('csv').value = state.studentsCsv;
  document.getElementById('csv').addEventListener('input', e => state.studentsCsv = e.target.value);
  document.querySelector('[data-prev]').addEventListener('click', () => step2());
  document.querySelector('[data-next]').addEventListener('click', importStudents);
}

async function importStudents() {
  const lines = state.studentsCsv.split('\n').map(l => l.trim()).filter(Boolean);
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const students = lines.map(l => {
    const [username, display_name, grade] = l.split(',').map(s => s.trim());
    return { username, display_name, grade: Number(grade) || null };
  });
  if (students.length === 0) { step4({ created:[], skipped:[] }); return; }
  try {
    const r = await fetch(`/api/admin/school/${state.schoolId}/import-students`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ students }), credentials:'same-origin',
    });
    const d = await r.json();
    if (!r.ok) { msg.innerHTML = `<div class="msg err">${esc(d.error || 'Lỗi')}</div>`; return; }
    state.importResult = d;
    step4(d);
  } catch (e) {
    msg.innerHTML = `<div class="msg err">Lỗi: ${esc(e.message)}</div>`;
  }
}

function step4(result) {
  state.step = 3; renderProgress();
  document.getElementById('step-host').innerHTML = `
    <h2>🎉 Tổng kết</h2>
    <div class="sub">Trường <b>${esc(state.school.name)}</b> đã sẵn sàng!</div>
    <div class="summary-box">
      <h3>✓ Thiết lập hoàn tất</h3>
      <dl>
        <dt>Trường</dt>
        <dd>${esc(state.school.icon)} ${esc(state.school.name)} (<code>${esc(state.school.code)}</code>)</dd>
        <dt>Số lớp đã tạo</dt>
        <dd>${state.classes.filter(c => c.code.trim()).length}</dd>
        <dt>HS đã import</dt>
        <dd>${(result?.created || []).length} thành công / ${(result?.skipped || []).length} bỏ qua</dd>
      </dl>
    </div>
    ${result?.created && result.created.length > 0 ? `
      <h3 style="font-size:14px;color:var(--text-soft);margin:18px 0 8px">📋 Tài khoản HS đã tạo (lưu lại đưa cho HS)</h3>
      <div class="credentials-list">
        ${result.created.map(u => `<div class="line">${esc(u.username)} · ${esc(u.display_name)} · 🔑 <b>${esc(u.password)}</b></div>`).join('')}
      </div>
      <button class="preset-btn" style="margin-top:10px" id="copy-creds">📋 Sao chép tất cả tài khoản</button>
    ` : ''}
    ${result?.skipped && result.skipped.length > 0 ? `
      <h3 style="font-size:14px;color:var(--bad);margin:18px 0 8px">⚠ Bỏ qua</h3>
      <div class="credentials-list" style="color:#fda4af">
        ${result.skipped.map(s => `<div class="line">${esc(s.username || '?')} — ${esc(s.reason)}</div>`).join('')}
      </div>
    ` : ''}
    <div class="nav-buttons">
      <a href="/admin.html" class="prev" style="text-decoration:none;text-align:center;padding:11px 24px">Về Admin</a>
      <button class="next" onclick="location.reload()">+ Tạo trường khác</button>
    </div>
  `;
  document.getElementById('copy-creds')?.addEventListener('click', () => {
    const text = result.created.map(u => `${u.username}\t${u.display_name}\t${u.password}`).join('\n');
    navigator.clipboard.writeText(text);
    alert('✓ Đã copy ' + result.created.length + ' tài khoản');
  });
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
step1();
</script>
</body>
</html>
