<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🗺️ Campus Editor · Tizia Admin</title>
<style>
  :root {
    --bg:#0b1220; --bg2:#111a2e; --bg3:#16213d; --accent:#fbbf24; --accent2:#60a5fa;
    --ok:#22c55e; --warn:#fb923c; --bad:#ef4444;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
    --txt:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; height:100vh; overflow:hidden;}

  header{padding:10px 18px; background:var(--bg2); border-bottom:1px solid var(--border);
         display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  header h1{font-size:15px; margin:0; font-weight:700;}
  header .badge{background:var(--accent); color:#0f172a; font-weight:800; font-size:10px; padding:3px 8px; border-radius:999px; letter-spacing:.5px;}
  header .grow{flex:1;}
  header a.back{color:var(--accent2); text-decoration:none; font-size:13px;}

  select, button{font-family:inherit; font-size:13px; border-radius:8px; cursor:pointer;}
  select{background:var(--bg3); color:var(--txt); border:1px solid var(--border); padding:7px 10px;}
  .btn{background:var(--bg3); color:var(--txt); border:1px solid var(--border); padding:7px 13px; transition:.15s;}
  .btn:hover{border-color:var(--border-strong); background:#1d2a4a;}
  .btn.primary{background:var(--accent2); color:#0f172a; border-color:var(--accent2); font-weight:700;}
  .btn.primary:hover{background:#7eb6ff;}
  .btn.warn{color:var(--warn); border-color:var(--warn);}
  .btn.bad{color:var(--bad); border-color:var(--bad);}

  main{flex:1; display:flex; min-height:0;}
  .map-wrap{flex:1; background:#aef08f; position:relative; min-width:0;}
  .map-wrap iframe{width:100%; height:100%; border:0; display:block;}

  aside{width:380px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0;}
  .pane-head{padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700;}
  .pane-body{flex:1; overflow:auto; padding:12px 14px;}
  .pane-body textarea{width:100%; min-height:60vh; background:#020617; color:#cbd5e1; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.45;}
  .pane-foot{padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap;}

  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0f172a; color:#e2e8f0; padding:10px 16px; border-radius:10px; border:1px solid var(--border-strong); font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}
  .toast.ok{border-color:var(--ok);} .toast.bad{border-color:var(--bad);}

  .hint{font-size:11.5px; color:var(--muted); margin:8px 0 14px; line-height:1.5;}
  .hint code{background:#020617; color:#a78bfa; padding:1px 5px; border-radius:4px; font-size:11px;}

  .row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .row label{width:90px; font-size:12px; color:var(--muted);}
  .row input[type=text], .row input[type=number], .row select{flex:1; background:#020617; color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;}
  .row input[type=color]{width:50px; height:30px; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer;}
  .row input[type=checkbox]{width:18px; height:18px; cursor:pointer;}
</style>
</head>
<body>

<header>
  <a class="back" href="/admin.html">← Admin</a>
  <h1>🗺️ Campus Editor</h1>
  <span class="badge">PHASE 1</span>

  <span class="grow"></span>

  <label style="font-size:12px; color:var(--muted);">Trường:</label>
  <select id="domain">
    <option value="preschool">🌸 Mầm non (Hoa Sen)</option>
    <option value="primary">📚 Tiểu học</option>
    <option value="secondary">🏫 THCS</option>
    <option value="it">💻 Công nghệ thông tin</option>
    <option value="pharmacy">💊 Dược</option>
  </select>

  <button class="btn" id="reloadIframe" title="Reload map">↻ Reload</button>
  <button class="btn" id="downloadDefault" title="Export current effective layout">⤓ Export</button>
  <button class="btn primary" id="save">💾 Save override</button>
  <button class="btn warn" id="reset" title="Xoá override, về default">↶ Reset default</button>
</header>

<main>
  <div class="map-wrap">
    <iframe id="canvas" src="about:blank"></iframe>
  </div>

  <aside>
    <div class="pane-head">
      <span id="dirtyDot" style="display:none; color:var(--warn);">●</span>
      Inspector
    </div>
    <div class="pane-body">
      <div id="inspectorEmpty" class="hint" style="text-align:center; padding:20px 0;">
        <div style="font-size:32px; margin-bottom:8px;">🖱️</div>
        Click toà nhà trên bản đồ để chọn.<br>
        <span style="color:var(--muted); font-size:11px;">Drag để di chuyển · <code>R</code> xoay · <code>Del</code> xoá</span>
      </div>
      <div id="inspector" style="display:none;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <span id="iEmoji" style="font-size:32px;"></span>
          <div style="flex:1;">
            <div id="iName" style="font-weight:700; font-size:14px;"></div>
            <div id="iId" style="color:var(--muted); font-size:11px; font-family:ui-monospace,Menlo,monospace;"></div>
          </div>
        </div>
        <div class="row"><label>Tên</label><input id="fName" type="text"></div>
        <div class="row"><label>Emoji</label><input id="fEmoji" type="text" maxlength="4"></div>
        <div class="row"><label>Vị trí gx</label><input id="fGx" type="number" step="0.5"></div>
        <div class="row"><label>Vị trí gy</label><input id="fGy" type="number" step="0.5"></div>
        <div class="row"><label>Scale</label><input id="fScale" type="number" step="0.05" min="0.3" max="2"></div>
        <div class="row"><label>Xoay</label>
          <select id="fRot"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
        </div>
        <div class="row"><label>Pin màu</label><input id="fPin" type="color"></div>
        <div class="row"><label>Cờ trường</label><input id="fFlag" type="checkbox"></div>
        <button class="btn bad" id="iDelete" style="width:100%; margin-top:12px;">🗑️ Xoá toà nhà</button>
      </div>

      <details style="margin-top:18px;">
        <summary style="cursor:pointer; color:var(--muted); font-size:12px; user-select:none;">📝 JSON thô (advanced)</summary>
        <textarea id="json" spellcheck="false" placeholder='{"buildings":[...]}' style="margin-top:8px;"></textarea>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button class="btn" id="loadFromServer" style="flex:1;">⤓ Load server</button>
          <button class="btn" id="pickFile" style="flex:1;">📁 Import</button>
          <input type="file" id="file" accept=".json" hidden>
        </div>
      </details>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const dom=$('#domain'), iframe=$('#canvas'), ta=$('#json'), toastEl=$('#toast');
let csrfToken=null;

function toast(msg, kind='ok'){ toastEl.textContent=msg; toastEl.className='toast show '+kind; clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200); }
function reloadIframe(){ iframe.src=`/campus-proto/b-iso-canvas.html?domain=${dom.value}&edit=1&_t=${Date.now()}`; setDirty(false); closeInspector(); }
function setDirty(on){ $('#dirtyDot').style.display = on ? '' : 'none'; }
function closeInspector(){ $('#inspector').style.display='none'; $('#inspectorEmpty').style.display=''; currentIdx=-1; }
function openInspector(idx, item){
  currentIdx=idx;
  $('#inspectorEmpty').style.display='none'; $('#inspector').style.display='';
  $('#iEmoji').textContent=item.emoji||'🏢';
  $('#iName').textContent=item.name||'(không tên)';
  $('#iId').textContent='#'+(item.id||'?')+'  ·  idx '+idx;
  $('#fName').value=item.name||'';
  $('#fEmoji').value=item.emoji||'';
  $('#fGx').value=item.gx??0;
  $('#fGy').value=item.gy??0;
  $('#fScale').value=item.s??1;
  $('#fRot').value=String(((item.rot||0)%360+360)%360);
  $('#fPin').value=item.pin||'#c0392b';
  $('#fFlag').checked=!!item.flag;
}
let currentIdx=-1;
function sendCmd(key,value){
  if(currentIdx<0) return;
  iframe.contentWindow?.postMessage({type:'campus-cmd-set', idx:currentIdx, key, value},'*');
  setDirty(true);
}

async function loadCsrf(){
  try{ const r=await fetch('/api/csrf',{credentials:'same-origin'}); if(r.ok){ const j=await r.json(); csrfToken=j.token||j.csrfToken||null; } }catch{}
}

async function loadFromServer(){
  try{
    const r=await fetch(`/api/campus-layout/${dom.value}`,{credentials:'same-origin'});
    const j=await r.json();
    ta.value = j.layout ? JSON.stringify(j.layout,null,2) : '';
    toast(j.layout ? 'Đã tải override hiện tại' : 'Chưa có override — đang dùng default','ok');
  }catch(e){ toast('Lỗi tải: '+e.message,'bad'); }
}

async function saveOverride(){
  let layout;
  // Ưu tiên đọc state hiện tại từ iframe (đã có drag/edit) — fallback textarea
  const w=iframe.contentWindow;
  if(w && w.CAMPUSES && w.CAMPUSES[dom.value]){
    layout = JSON.parse(JSON.stringify(w.CAMPUSES[dom.value]));   // deep clone
  } else if(ta.value.trim()){
    try{ layout=JSON.parse(ta.value); }catch(e){ return toast('JSON sai cú pháp: '+e.message,'bad'); }
  } else { return toast('Không có gì để lưu','bad'); }
  try{
    const r=await fetch(`/api/admin/campus-layout/${dom.value}`,{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json', ...(csrfToken?{'x-csrf-token':csrfToken}:{})},
      body:JSON.stringify({layout})
    });
    const j=await r.json();
    if(!r.ok) return toast('Lỗi: '+(j.message||j.error),'bad');
    toast('💾 Đã lưu — đang reload map','ok');
    setDirty(false);
    reloadIframe();
  }catch(e){ toast('Lỗi: '+e.message,'bad'); }
}

async function resetOverride(){
  if(!confirm(`Xoá override cho "${dom.value}" và quay về default?`)) return;
  try{
    const r=await fetch(`/api/admin/campus-layout/${dom.value}`,{
      method:'DELETE', credentials:'same-origin',
      headers:csrfToken?{'x-csrf-token':csrfToken}:{}
    });
    const j=await r.json();
    if(!r.ok) return toast('Lỗi: '+(j.message||j.error),'bad');
    toast('↶ Đã reset về default','ok');
    ta.value=''; reloadIframe();
  }catch(e){ toast('Lỗi: '+e.message,'bad'); }
}

async function exportEffective(){
  // Lấy C từ iframe (CAMPUSES[domain] đã merged override)
  try{
    const w=iframe.contentWindow;
    if(!w || !w.CAMPUSES) return toast('Iframe chưa load xong — đợi vài giây rồi thử lại','bad');
    const C=w.CAMPUSES[dom.value];
    if(!C) return toast('Không tìm thấy CAMPUSES['+dom.value+']','bad');
    const json=JSON.stringify(C,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`campus-${dom.value}.json`; a.click();
    URL.revokeObjectURL(a.href);
    toast('⤓ Đã tải file JSON','ok');
  }catch(e){ toast('Lỗi export: '+e.message,'bad'); }
}

function importFile(file){
  const fr=new FileReader();
  fr.onload=()=>{ ta.value=fr.result; toast('📁 Đã đọc file — bấm Save để áp dụng','ok'); };
  fr.onerror=()=>toast('Lỗi đọc file','bad');
  fr.readAsText(file);
}

dom.addEventListener('change',()=>{ reloadIframe(); loadFromServer(); });
$('#reloadIframe').addEventListener('click', reloadIframe);
$('#save').addEventListener('click', saveOverride);
$('#reset').addEventListener('click', resetOverride);
$('#downloadDefault').addEventListener('click', exportEffective);
$('#loadFromServer').addEventListener('click', loadFromServer);
$('#pickFile').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',e=>{ const f=e.target.files?.[0]; if(f) importFile(f); e.target.value=''; });

// ── Inspector field → iframe ──
$('#fName').addEventListener('input', e=>sendCmd('name', e.target.value));
$('#fEmoji').addEventListener('input', e=>sendCmd('emoji', e.target.value));
$('#fGx').addEventListener('input', e=>sendCmd('gx', Number(e.target.value)));
$('#fGy').addEventListener('input', e=>sendCmd('gy', Number(e.target.value)));
$('#fScale').addEventListener('input', e=>sendCmd('s', Number(e.target.value)));
$('#fRot').addEventListener('change', e=>sendCmd('rot', Number(e.target.value)));
$('#fPin').addEventListener('input', e=>sendCmd('pin', e.target.value));
$('#fFlag').addEventListener('change', e=>sendCmd('flag', e.target.checked));
$('#iDelete').addEventListener('click', ()=>{
  if(currentIdx<0) return;
  if(!confirm('Xoá toà nhà này khỏi map?')) return;
  iframe.contentWindow?.postMessage({type:'campus-cmd-delete', idx:currentIdx},'*');
  closeInspector(); setDirty(true);
});

// ── Iframe → admin (select, move, delete, rotate, dirty) ──
window.addEventListener('message', e=>{
  const m=e.data; if(!m || !m.type) return;
  if(m.type==='campus-ready'){
    console.log('[campus-editor] iframe ready', m.domain, m.buildings?.length, 'buildings');
  } else if(m.type==='campus-select'){
    openInspector(m.idx, m.item);
  } else if(m.type==='campus-deselect'){
    closeInspector();
  } else if(m.type==='campus-move'){
    setDirty(true);
    if(currentIdx===m.idx){ $('#fGx').value=m.gx; $('#fGy').value=m.gy; }
    toast(`📍 ${m.item.emoji||''} ${m.item.name||''}: (${m.gx}, ${m.gy})`,'ok');
  } else if(m.type==='campus-rotate'){
    setDirty(true);
    if(currentIdx===m.idx) $('#fRot').value=String(m.rot);
    toast(`↻ ${m.item.emoji||''} xoay ${m.rot}°`,'ok');
  } else if(m.type==='campus-delete'){
    setDirty(true); closeInspector();
    toast(`🗑️ Đã xoá ${m.item.emoji||''} ${m.item.name||''}`,'ok');
  } else if(m.type==='campus-decor-move'){
    setDirty(true);
    toast(`📍 ${m.k} ở ${m.src}[${m.srcIdx}] → (${m.gx}, ${m.gy})`,'ok');
  } else if(m.type==='campus-dirty'){
    setDirty(true);
  }
});

// init
(async()=>{ await loadCsrf(); reloadIframe(); await loadFromServer(); })();
</script>
</body>
</html>
