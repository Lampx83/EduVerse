<style>
  :root {
    --red-1:#c8102e; --red-2:#8c0a1f; --red-3:#5a0614;
    --gold:#ffd54a; --gold-soft:#fff0a8;
    --ink:#1f2937; --ink-soft:#475569;
    --paper:#fff8e7;
    --ok:#16a34a; --bad:#dc2626;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink);
    background: radial-gradient(ellipse at top, var(--red-1) 0%, var(--red-2) 55%, var(--red-3) 100%) fixed;
    overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:

      radial-gradient(circle at 78% 14%, rgba(255,213,74,.14) 0, transparent 50px),
      radial-gradient(circle at 40% 78%, rgba(255,213,74,.12) 0, transparent 70px),
      radial-gradient(circle at 88% 64%, rgba(255,213,74,.16) 0, transparent 55px),
      radial-gradient(circle at 12% 88%, rgba(255,213,74,.10) 0, transparent 50px);

  /* Top bar */
  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:14px 18px; background:linear-gradient(180deg, rgba(90,6,20,.92) 0%, rgba(90,6,20,.78) 70%, rgba(90,6,20,0) 100%);
    backdrop-filter:blur(8px);
  }
  .back { background:rgba(255,255,255,.95); color:var(--red-2); text-decoration:none; padding:8px 16px; border-radius:22px; font-size:13px; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.25); }
  .back:hover { background:var(--gold); }
  .title { color:var(--gold); font-size:18px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px; }
  .star { display:inline-block; color:var(--gold); }
  .stats { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.95); color:var(--red-2); padding:7px 14px; border-radius:18px; font-size:13px; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.2); display:flex; align-items:center; gap:6px; }
  .pill b { color:var(--red-1); font-weight:900; }

  /* Hero */
  .hero { position:relative; z-index:1; text-align:center; padding:30px 18px 10px; color:#fff; }
  .hero h1 { margin:0 0 8px; font-size:34px; font-weight:900; letter-spacing:-.5px;
    text-shadow:0 4px 12px rgba(0,0,0,.45);
    background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .hero p { margin:0; font-size:14.5px; opacity:.92; }
  .flag-stripe { display:inline-flex; gap:6px; margin-top:14px; }
  .flag-stripe .s { width:14px; height:14px; background:var(--gold); clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

  /* Regions */
  main { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:18px 16px 100px; }
  .region { margin-bottom:30px; }
  .region-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:0 6px; }
  .region-head h2 { margin:0; color:var(--gold); font-size:18px; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  .region-head .count { background:rgba(255,255,255,.15); color:#fff; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; }
  .region-head .line { flex:1; height:1px; background:linear-gradient(90deg, rgba(255,213,74,.6), rgba(255,213,74,0)); }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap:10px; }
  @media (max-width:600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap:7px; } }

  .card { position:relative; aspect-ratio:1/1; background:rgba(255,248,231,.97); border:2px solid rgba(255,213,74,.45);
    border-radius:14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:6px; text-align:center; transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, border-color .2s;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .card:hover { transform: translateY(-4px) scale(1.06); border-color:var(--gold); box-shadow:0 10px 22px rgba(255,213,74,.35); z-index:2; }
  .card .emo { font-size:30px; line-height:1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
  @media (max-width:600px) { .card .emo { font-size:24px; } }
  .card .pname { font-size:11px; font-weight:700; color:var(--red-2); line-height:1.15; }
  .card.solved { border-color:var(--ok); background:linear-gradient(180deg, #ecfdf5, #d1fae5); }
  .card.solved::after { content:'✓'; position:absolute; top:4px; right:6px; width:18px; height:18px; background:var(--ok); color:#fff; border-radius:50%; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 4px rgba(0,0,0,.25); }

  /* Modal */
  .modal-bg { position:fixed; inset:0; z-index:50; background:rgba(15,8,12,.75); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:18px; animation: fadeIn .25s ease; }
  .modal-bg.show { display:flex; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal { background:linear-gradient(180deg, var(--paper) 0%, #ffe9b8 100%); border-radius:22px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto;
    padding:22px 22px 18px; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.5);
    border:3px solid var(--gold); animation: popIn .35s cubic-bezier(.34,1.56,.64,1);

  @keyframes popIn { from { transform: scale(.85); opacity:0; } to { transform: scale(1); opacity:1; } }
  .modal .close { position:absolute; top:10px; right:12px; width:32px; height:32px; border-radius:50%; border:none; background:var(--red-1); color:#fff; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .modal .close:hover { background:var(--red-2); }
  .modal-head { display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:2px dashed rgba(200,16,46,.3); margin-bottom:14px; }
  .modal-head .em { font-size:42px; }
  .modal-head h3 { margin:0; font-size:22px; color:var(--red-2); font-weight:900; }
  .modal-head .reg { font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:2px; }
  .info-row { display:grid; grid-template-columns: auto 1fr; gap:6px 12px; font-size:13.5px; line-height:1.5; margin-bottom:12px; }
  .info-row .k { color:var(--red-1); font-weight:700; }
  .info-row .v { color:var(--ink); }
  .highlight-box { background:rgba(200,16,46,.08); border-left:3px solid var(--red-1); padding:9px 12px; border-radius:8px; font-size:13px; color:var(--ink); margin-bottom:16px; line-height:1.5; }

  .quiz-block { background:rgba(255,255,255,.7); border-radius:14px; padding:14px; margin-bottom:12px; }
  .quiz-block .qtitle { font-size:12px; font-weight:800; color:var(--red-2); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  .quiz-block .qq { font-size:14px; font-weight:700; color:var(--ink); margin-bottom:10px; line-height:1.4; }
  .choices { display:flex; flex-direction:column; gap:7px; }
  .choice { background:#fff; border:2px solid #e5e7eb; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink); text-align:left; font-family:inherit; transition: all .15s; }
  .choice:hover { border-color:var(--gold); background:var(--gold-soft); }
  .choice.correct { background:#dcfce7; border-color:var(--ok); color:#065f46; animation: bounce .4s; }
  .choice.wrong { background:#fee2e2; border-color:var(--bad); color:#991b1b; animation: shake .4s; }
  .choice:disabled { cursor:default; opacity:.7; }
  .choice.correct:disabled { opacity:1; }
  @keyframes bounce { 0%,100%{transform:scale(1);} 40%{transform:scale(1.05);} 70%{transform:scale(.98);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .progress-bar { display:flex; gap:4px; margin-top:6px; }
  .progress-bar .seg { flex:1; height:4px; background:rgba(0,0,0,.1); border-radius:2px; }
  .progress-bar .seg.ok { background:var(--ok); }

  /* Toast */
  #toast { position:fixed; left:50%; top:20px; transform:translateX(-50%) translateY(-30px); z-index:60;
    background:var(--ok); color:#fff; padding:12px 22px; border-radius:14px; font-weight:800; font-size:14px;
    opacity:0; transition: opacity .25s, transform .25s; box-shadow:0 8px 24px rgba(22,163,74,.5);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Footer */
  footer { position:fixed; bottom:0; left:0; right:0; z-index:15;
    background:linear-gradient(0deg, rgba(90,6,20,.96) 0%, rgba(90,6,20,.85) 70%, rgba(90,6,20,0) 100%);

  }
  .progress-pill { display:inline-flex; align-items:center; gap:12px; background:rgba(255,255,255,.95);
    padding:10px 22px; border-radius:24px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .progress-pill .pcount { font-size:18px; font-weight:900; color:var(--red-1); }
  .progress-pill .ptrack { width:140px; height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; }
  .progress-pill .pfill { height:100%; background:linear-gradient(90deg, var(--ok), #22c55e); transition: width .4s; }
  .progress-pill .plabel { font-size:13px; font-weight:700; color:var(--ink-soft); }

  @media (max-width:600px) {
    .hero h1 { font-size:24px; }
    .title { font-size:15px; }
    .pill { font-size:12px; padding:6px 11px; }
    .modal { padding:18px 16px 14px; max-height:94vh; }
    .modal-head h3 { font-size:18px; }
  }
</style>

// ── Grouping ─────────────────────────────────────────────────
const REGIONS = [
  { key:'Bắc Bộ',         icon:'🏯', desc:'Vùng đồng bằng sông Hồng & miền núi phía Bắc' },
  { key:'Bắc Trung Bộ',   icon:'🌾', desc:'Dải đất miền Trung từ Thanh Hóa đến Huế' },
  { key:'Nam Trung Bộ',   icon:'🌊', desc:'Duyên hải miền Trung & biển đảo' },
  { key:'Tây Nguyên',     icon:'☕', desc:'Cao nguyên đất đỏ, cà phê và voi' },
  { key:'Đông Nam Bộ',    icon:'🌆', desc:'Trung tâm kinh tế năng động phía Nam' },
  { key:'ĐBSCL',          icon:'🛥️', desc:'Đồng bằng sông Cửu Long — vựa lúa, miệt vườn' },
];

// ── State ────────────────────────────────────────────────────
const SOLVED_KEY = (id) => 'bandovn.solved.' + id;
const XP_KEY     = 'bandovn.xp';

function isSolved(id) {
  try { return localStorage.getItem(SOLVED_KEY(id)) === '1'; } catch { return false; }
}
function markSolved(id) {
  try { localStorage.setItem(SOLVED_KEY(id), '1'); } catch {}
}
function getXP() {
  try { return parseInt(localStorage.getItem(XP_KEY) || '0', 10) || 0; } catch { return 0; }
}
function addXP(n) {
  try { localStorage.setItem(XP_KEY, String(getXP() + n)); } catch {}
}

// ── Render map ───────────────────────────────────────────────
function renderMap() {
  const map = document.getElementById('map');
  let html = '';
  for (const reg of REGIONS) {
    const list = PROVINCES.filter(p => p.region === reg.key);
    html += `<section class="region">
      <div class="region-head">
        <h2>${reg.icon} ${reg.key}</h2>
        <span class="count">${list.length} tỉnh</span>
        <div class="line"></div>
      </div>
      <div class="grid">`;
    for (const p of list) {
      const solved = isSolved(p.id) ? ' solved' : '';
      html += `<button class="card${solved}" data-id="${p.id}" title="${p.name}">
        <div class="emo">${p.emoji}</div>
        <div class="pname">${p.name}</div>
      </button>`;
    }
    html += `</div></section>`;
  }
  map.innerHTML = html;
  for (const btn of map.querySelectorAll('.card')) {
    btn.addEventListener('click', () => openModal(btn.dataset.id));
  }
  updateStats();
}

// ── Modal ────────────────────────────────────────────────────
const modalBg = document.getElementById('modal-bg');
const modal = document.getElementById('modal');
let activeProvince = null;
let quizState = [false, false];

function openModal(id) {
  const p = PROVINCES.find(x => x.id === id);
  if (!p) return;
  activeProvince = p;
  quizState = [false, false];
  const alreadySolved = isSolved(id);

  modal.innerHTML = `
    <button class="close" aria-label="Đóng">✕</button>
    <div class="modal-head">
      <div class="em">${p.emoji}</div>
      <div>
        <h3>${p.name}</h3>
        <div class="reg">${p.region}${alreadySolved ? ' · ✓ Đã chinh phục' : ''}</div>
      </div>
    </div>
    <div class="info-row">
      <span class="k">🏛️ Tỉnh lỵ:</span><span class="v">${p.capital}</span>
      <span class="k">📏 Diện tích:</span><span class="v">≈ ${p.area_km2.toLocaleString('vi-VN')} km²</span>
    </div>
    <div class="highlight-box">✨ ${p.highlight}</div>

    ${p.quiz.map((q, qi) => `
      <div class="quiz-block" data-qi="${qi}">
        <div class="qtitle">Câu ${qi+1}/2</div>
        <div class="qq">${q.q}</div>
        <div class="choices">
          ${q.choices.map((c, ci) => `<button class="choice" data-qi="${qi}" data-ci="${ci}">${c}</button>`).join('')}
        </div>
      </div>
    `).join('')}

    <div class="progress-bar" id="qprogress">
      <div class="seg"></div><div class="seg"></div>
    </div>
  `;

  modal.querySelector('.close').addEventListener('click', closeModal);
  modal.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => onAnswer(btn));
  });
  modalBg.classList.add('show');
}

function closeModal() {
  modalBg.classList.remove('show');
  activeProvince = null;
}

modalBg.addEventListener('click', (e) => {
  if (e.target === modalBg) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalBg.classList.contains('show')) closeModal();
});

function onAnswer(btn) {
  if (!activeProvince) return;
  const qi = +btn.dataset.qi;
  const ci = +btn.dataset.ci;
  const q = activeProvince.quiz[qi];
  // disable all choices in this block
  const block = modal.querySelector(`.quiz-block[data-qi="${qi}"]`);
  if (!block) return;
  if (block.dataset.done === '1') return;
  block.querySelectorAll('.choice').forEach(b => b.disabled = true);

  if (ci === q.answer) {
    btn.classList.add('correct');
    quizState[qi] = true;
  } else {
    btn.classList.add('wrong');
    // also reveal correct
    const correctBtn = block.querySelector(`.choice[data-ci="${q.answer}"]`);
    if (correctBtn) correctBtn.classList.add('correct');
  }
  block.dataset.done = '1';

  // progress
  const segs = modal.querySelectorAll('#qprogress .seg');
  quizState.forEach((ok, i) => { if (ok) segs[i].classList.add('ok'); });

  // both done?
  const allDone = modal.querySelectorAll('.quiz-block[data-done="1"]').length === activeProvince.quiz.length;
  if (allDone) {
    const allCorrect = quizState.every(Boolean);
    if (allCorrect) {
      const wasSolved = isSolved(activeProvince.id);
      markSolved(activeProvince.id);
      if (!wasSolved) {
        addXP(10);
        toast(`🎉 +10 XP! Chinh phục ${activeProvince.name}!`);
      } else {
        toast(`✓ Trả lời đúng cả 2 câu — ${activeProvince.name}!`);
      }
      // mark card
      const card = document.querySelector(`.card[data-id="${activeProvince.id}"]`);
      if (card) card.classList.add('solved');
      updateStats();
    } else {
      toast(`💪 Chưa đúng hết — thử lại nhé!`);
    }
  }
}

// ── Toast ────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Stats ────────────────────────────────────────────────────
function updateStats() {
  const solved = PROVINCES.filter(p => isSolved(p.id)).length;
  document.getElementById('st-solved').textContent = solved;
  document.getElementById('st-xp').textContent = getXP().toLocaleString('vi-VN');
  document.getElementById('f-count').textContent = solved;
  document.getElementById('f-fill').style.width = (solved / PROVINCES.length * 100) + '%';
}

// ── Boot ─────────────────────────────────────────────────────
renderMap();
// Sanity check log: ensure 63 provinces
console.log(`[ban-do-vn] Loaded ${PROVINCES.length} provinces`);
</script>
