<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>💻 Code Lab · Trường CNTT · Tizia</title>
<meta name="description" content="Luyện lập trình Python/C++/Java trên NEU Codelab — chạy code thật trong sandbox, chấm tự động bằng test case." />
<style>
  :root { --bg-1:#0b1220; --bg-2:#0f1830; --accent:#38bdf8; --accent-2:#22c55e;
    --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12); --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; color:#e5edf7;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(56,189,248,.16), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); }
  .top { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.2); position:sticky; top:0; z-index:5; }
  .back { color:#fff; text-decoration:none; opacity:.85; font-size:13.5px; background:rgba(255,255,255,.08); padding:7px 12px; border-radius:9px; }
  .back:hover { opacity:1; background:rgba(255,255,255,.16); }
  .top h1 { margin:0; font-size:17px; font-weight:800; }
  .top .sub { font-size:12.5px; opacity:.6; }
  .top .prog { margin-left:auto; font-size:13px; font-weight:700; background:rgba(34,197,94,.15); border:1px solid rgba(34,197,94,.4); color:#86efac; padding:6px 12px; border-radius:20px; }
  .layout { display:grid; grid-template-columns:260px 1fr; gap:0; height:calc(100vh - 58px); }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; height:auto; } .list{ max-height:none !important; } }
  /* challenge list */
  .list { border-right:1px solid var(--border); overflow:auto; padding:10px; }
  .list h2 { font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:.5; margin:12px 8px 6px; }
  .ch { display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:10px; cursor:pointer; font-size:13.5px; border:1px solid transparent; }
  .ch:hover { background:rgba(255,255,255,.06); }
  .ch.active { background:rgba(56,189,248,.14); border-color:rgba(56,189,248,.45); }
  .ch .st { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.25); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .ch.solved .st { background:var(--ok); border-color:var(--ok); color:#04210f; }
  .ch .nm { flex:1; } .ch .lv { font-size:10px; opacity:.5; }
  /* workspace */
  .work { display:flex; flex-direction:column; overflow:auto; padding:16px 18px 28px; gap:12px; }
  .prob { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:14px 16px; }
  .prob h3 { margin:0 0 6px; font-size:17px; }
  .prob .tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 8px; border-radius:7px; background:rgba(56,189,248,.2); color:#bae6fd; margin-left:8px; }
  .prob p { margin:6px 0; font-size:13.5px; opacity:.9; line-height:1.55; }
  .prob code { background:rgba(0,0,0,.35); padding:1px 6px; border-radius:5px; font-size:12.5px; color:#7dd3fc; }
  .prob .ex { font-size:12.5px; opacity:.75; margin-top:4px; }
  .ed-wrap { position:relative; }
  .ed-lbl { font-size:11px; opacity:.5; text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px; }
  textarea#code { width:100%; min-height:240px; resize:vertical; background:#0a0f1d; color:#e7f0ff; border:1px solid var(--border);
    border-radius:11px; padding:13px 15px; font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; line-height:1.6; tab-size:2; }
  textarea#code:focus { outline:2px solid var(--accent); border-color:transparent; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn { border:none; border-radius:10px; font-weight:800; font-size:13.5px; padding:10px 18px; cursor:pointer; font-family:inherit; }
  .btn.run { background:var(--accent); color:#04222e; } .btn.run:hover{ filter:brightness(1.1); }
  .btn.ghost { background:rgba(255,255,255,.08); color:#fff; } .btn.ghost:hover{ background:rgba(255,255,255,.16); }
  .btn.sol { background:rgba(255,255,255,.06); color:#cbd5e1; font-weight:600; }
  .hint { font-size:12px; opacity:.5; }
  /* results */
  .results { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:6px 6px; display:none; }
  .results.show { display:block; }
  .res-head { font-weight:800; font-size:14px; padding:10px 12px; }
  .res-head.pass { color:#86efac; } .res-head.fail { color:#fca5a5; }
  .case { display:grid; grid-template-columns:22px 1fr; gap:8px; padding:8px 12px; border-top:1px solid var(--border); font-size:12.5px; font-family:ui-monospace,monospace; }
  .case .mark { font-weight:800; } .case.pass .mark{ color:var(--ok);} .case.fail .mark{ color:var(--bad);}
  .case .det { overflow-x:auto; } .case .det div{ white-space:nowrap; }
  .case .k { opacity:.55; }
  .console { background:#06080f; border:1px solid var(--border); border-radius:10px; margin:8px 12px 12px; padding:9px 12px; font-family:ui-monospace,monospace; font-size:12.5px; color:#9fb3c8; max-height:140px; overflow:auto; white-space:pre-wrap; display:none; }
  .console.show { display:block; }
  .console .ttl{ opacity:.5; font-size:10px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#22c55e; color:#04210f; font-weight:800;
    padding:12px 22px; border-radius:13px; box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; transition:.3s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .done-banner { background:linear-gradient(120deg, rgba(34,197,94,.2), rgba(56,189,248,.12)); border:1px solid rgba(34,197,94,.4);
    border-radius:13px; padding:14px 16px; font-size:14px; display:none; }
  .done-banner.show { display:block; }
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="/school.html?domain=it#campus-hero">← Khuôn viên trường</a>
  <div>
    <h1>💻 Code Lab <span class="sub">— Python · C++ · Java · NEU Online Judge</span></h1>
  </div>
  <select id="langSel" style="margin-left:auto;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;"></select>
  <div class="prog" id="prog">0/0 bài</div>
</div>
<div class="layout">
  <div class="list" id="list"></div>
  <div class="work">
    <div class="done-banner" id="doneBanner">🎉 <b>Xuất sắc!</b> Bạn đã vượt qua mọi thử thách. Đây là cách một trường CNTT thật vận hành: viết code → chạy → vượt test.</div>
    <div class="prob" id="prob"></div>
    <div class="ed-wrap">
      <div class="ed-lbl">Trình soạn code · Tab = 2 dấu cách · chạy thật trên NEU Codelab (sandbox Judge0)</div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="controls">
      <button class="btn run" id="runBtn">▶ Chạy thử</button>
      <button class="btn run" id="submitBtn" style="background:var(--accent-2); color:#04210f;">✓ Nộp bài</button>
      <button class="btn ghost" id="resetBtn">↺ Đặt lại</button>
      <button class="btn sol" id="solBtn">Xem gợi ý</button>
      <span class="hint" id="hint"></span>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== Code Lab — UI gọi Codelab API thật ======
// Mọi bài + chạy code + chấm điểm đều đi qua /api/codelab/* (server proxy
// giấu X-API-Key + gắn externalUserRef = "tizia:user:<id>" từ session).
// Spec: https://fit.neu.edu.vn/codelab/api-backend/docs

// Contest dành riêng cho module Tizia-CNTT — Codelab tạo contest này với
// các bài Python cơ bản (I1.1) + giải thuật (I2.1). Đổi ?contest=<slug> qua
// query string nếu muốn xem contest khác (vd code-race).
const PARAMS = new URLSearchParams(location.search);
const CONTEST_SLUG = PARAMS.get('contest') || 'tizia-it-i11'; // convention
const PREFERRED_LANGS = ['python', 'cpp', 'c++', 'java', 'javascript']; // ưu tiên hiển thị

// Fallback bộ thử thách OFFLINE — chỉ hiển thị khi server Codelab chưa cấu
// hình (CODELAB_API_KEY rỗng → /api/codelab/problems trả 503). Bộ này
// chạy local trong Web Worker để demo UI vẫn dùng được khi dev offline.
const FALLBACK_CHALLENGES = [
  { id:'sumTwo', cat:'Cơ bản', title:'Tổng hai số', fnName:'sumTwo',
    desc:'Viết hàm <code>sumTwo(a, b)</code> trả về tổng của hai số.',
    starter:'function sumTwo(a, b) {\n  // viết code ở đây\n  \n}',
    tests:[{args:[2,3],expected:5},{args:[-4,10],expected:6},{args:[0,0],expected:0},{args:[100,250],expected:350}],
    sol:'function sumTwo(a, b) {\n  return a + b;\n}' },

  { id:'reverseString', cat:'Cơ bản', title:'Đảo ngược chuỗi', fnName:'reverseString',
    desc:'Viết hàm <code>reverseString(s)</code> trả về chuỗi đảo ngược.',
    starter:'function reverseString(s) {\n  \n}',
    tests:[{args:['abc'],expected:'cba'},{args:['Tizia'],expected:'esreVudE'},{args:[''],expected:''},{args:['a'],expected:'a'}],
    sol:'function reverseString(s) {\n  return s.split("").reverse().join("");\n}' },

  { id:'isEven', cat:'Cơ bản', title:'Kiểm tra số chẵn', fnName:'isEven',
    desc:'Viết hàm <code>isEven(n)</code> trả về <code>true</code> nếu n chẵn, ngược lại <code>false</code>.',
    starter:'function isEven(n) {\n  \n}',
    tests:[{args:[4],expected:true},{args:[7],expected:false},{args:[0],expected:true},{args:[-2],expected:true},{args:[-3],expected:false}],
    sol:'function isEven(n) {\n  return n % 2 === 0;\n}' },

  { id:'countVowels', cat:'Cơ bản', title:'Đếm nguyên âm', fnName:'countVowels',
    desc:'Viết hàm <code>countVowels(s)</code> đếm số nguyên âm (a, e, i, o, u — không phân biệt hoa thường) trong chuỗi.',
    starter:'function countVowels(s) {\n  \n}',
    tests:[{args:['hello'],expected:2},{args:['Tizia'],expected:4},{args:['xyz'],expected:0},{args:['AEIOU'],expected:5}],
    sol:'function countVowels(s) {\n  return (s.match(/[aeiou]/gi) || []).length;\n}' },

  { id:'fizzbuzz', cat:'Giải thuật', title:'FizzBuzz', fnName:'fizzbuzz',
    desc:'Viết hàm <code>fizzbuzz(n)</code> trả về MẢNG từ 1..n: bội 3 → <code>"Fizz"</code>, bội 5 → <code>"Buzz"</code>, bội cả 3 và 5 → <code>"FizzBuzz"</code>, còn lại là chính số đó.',
    starter:'function fizzbuzz(n) {\n  // trả về một mảng\n  \n}',
    tests:[{args:[5],expected:[1,2,'Fizz',4,'Buzz']},{args:[3],expected:[1,2,'Fizz']},{args:[15],expected:[1,2,'Fizz',4,'Buzz','Fizz',7,8,'Fizz','Buzz',11,'Fizz',13,14,'FizzBuzz']}],
    sol:'function fizzbuzz(n) {\n  const out = [];\n  for (let i = 1; i <= n; i++) {\n    if (i % 15 === 0) out.push("FizzBuzz");\n    else if (i % 3 === 0) out.push("Fizz");\n    else if (i % 5 === 0) out.push("Buzz");\n    else out.push(i);\n  }\n  return out;\n}' },

  { id:'findMax', cat:'Giải thuật', title:'Tìm phần tử lớn nhất', fnName:'findMax',
    desc:'Viết hàm <code>findMax(arr)</code> trả về phần tử lớn nhất trong mảng số (không dùng <code>Math.max</code> cũng được).',
    starter:'function findMax(arr) {\n  \n}',
    tests:[{args:[[3,7,2,9,4]],expected:9},{args:[[-5,-1,-9]],expected:-1},{args:[[42]],expected:42}],
    sol:'function findMax(arr) {\n  let m = arr[0];\n  for (const x of arr) if (x > m) m = x;\n  return m;\n}' },

  { id:'isPrime', cat:'Giải thuật', title:'Số nguyên tố', fnName:'isPrime',
    desc:'Viết hàm <code>isPrime(n)</code> trả về <code>true</code> nếu n là số nguyên tố. Lưu ý: số &lt; 2 không phải nguyên tố.',
    starter:'function isPrime(n) {\n  \n}',
    tests:[{args:[2],expected:true},{args:[7],expected:true},{args:[1],expected:false},{args:[9],expected:false},{args:[97],expected:true},{args:[100],expected:false}],
    sol:'function isPrime(n) {\n  if (n < 2) return false;\n  for (let i = 2; i * i <= n; i++)\n    if (n % i === 0) return false;\n  return true;\n}' },

  { id:'fibonacci', cat:'Giải thuật', title:'Fibonacci thứ n', fnName:'fibonacci',
    desc:'Viết hàm <code>fibonacci(n)</code> trả về số Fibonacci thứ n (bắt đầu <code>fibonacci(0)=0</code>, <code>fibonacci(1)=1</code>).',
    starter:'function fibonacci(n) {\n  \n}',
    tests:[{args:[0],expected:0},{args:[1],expected:1},{args:[7],expected:13},{args:[10],expected:55}],
    sol:'function fibonacci(n) {\n  let a = 0, b = 1;\n  for (let i = 0; i < n; i++) { [a, b] = [b, a + b]; }\n  return a;\n}' },

  { id:'bubbleSort', cat:'Giải thuật', title:'Sắp xếp mảng tăng dần', fnName:'sortAsc',
    desc:'Viết hàm <code>sortAsc(arr)</code> trả về MẢNG MỚI đã sắp xếp tăng dần.',
    starter:'function sortAsc(arr) {\n  \n}',
    tests:[{args:[[3,1,2]],expected:[1,2,3]},{args:[[9,9,1,0]],expected:[0,1,9,9]},{args:[[]],expected:[]},{args:[[5]],expected:[5]}],
    sol:'function sortAsc(arr) {\n  return [...arr].sort((a, b) => a - b);\n}' },
];

// ====== State runtime ======
let MODE = 'codelab';                   // 'codelab' | 'offline'
let PROBLEMS = [];                      // [{ slug, name, difficulty, tag, ... }] từ API
let LANGUAGES = [];                     // [{ id, name, label }] từ /api/codelab/languages
let CURRENT_LANG = null;                // language object đang chọn
let CURRENT = null;                     // problem hoặc challenge đang mở
let SOLVED = new Set();                 // slug đã accepted (lấy từ /me/stats + cache local)
let CHALLENGES = [];                    // list được render — bind theo MODE

// ====== Helpers ======
const $   = id => document.getElementById(id);
const esc = s  => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = v  => { try { return JSON.stringify(v); } catch(e){ return String(v); } };
const codeKey = id => `tizia:it:codelab:code:${MODE}:${(CURRENT_LANG && CURRENT_LANG.id) || 'def'}:${id}`;
const LOCAL_SOLVED_KEY = 'tizia:it:codelab:solved';

function loadLocalSolved(){
  try { return new Set(JSON.parse(localStorage.getItem(LOCAL_SOLVED_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveLocalSolved(set){
  try { localStorage.setItem(LOCAL_SOLVED_KEY, JSON.stringify([...set])); } catch {}
}

let toastT;
function showToast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

async function fetchJson(url, opts){
  const res = await fetch(url, { credentials:'same-origin', ...opts });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) throw Object.assign(new Error(body?.message || body?.error || res.statusText), { status: res.status, body });
  return body;
}

// ====== BOOT ======
async function boot(){
  // Probe ngôn ngữ trước — nếu 503 codelab_not_configured → fallback offline.
  try {
    const langs = await fetchJson('/api/codelab/languages');
    LANGUAGES = (langs?.items || langs || []).map(l => ({
      id:    Number(l.id),
      name:  String(l.name || '').toLowerCase(),
      label: l.name || `Lang ${l.id}`,
    }));
    if (!LANGUAGES.length) throw new Error('no_languages');
  } catch (e) {
    console.warn('[codelab] languages fetch failed, fallback offline:', e.message);
    return bootOfflineMode();
  }

  // Sắp ngôn ngữ ưa thích lên đầu.
  LANGUAGES.sort((a,b) => {
    const ai = PREFERRED_LANGS.findIndex(p => a.name.includes(p));
    const bi = PREFERRED_LANGS.findIndex(p => b.name.includes(p));
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  CURRENT_LANG = LANGUAGES[0];
  renderLangSelect();

  // Load problems từ contest Tizia.
  try {
    const data = await fetchJson(`/api/codelab/problems?contest=${encodeURIComponent(CONTEST_SLUG)}&limit=50`);
    PROBLEMS = (data?.items || data?.data || data || []).filter(p => p && p.slug);
    if (!PROBLEMS.length) {
      // Contest rỗng → load tất cả problems (mode catalog).
      const all = await fetchJson('/api/codelab/problems?limit=50');
      PROBLEMS = (all?.items || all?.data || []).filter(p => p && p.slug);
    }
  } catch (e) {
    console.warn('[codelab] problems fetch failed:', e.message);
  }

  if (!PROBLEMS.length) return bootOfflineMode();

  CHALLENGES = PROBLEMS.map(p => ({
    id: p.slug,
    slug: p.slug,
    cat: (p.tags && p.tags[0]?.name) || p.difficulty || 'Codelab',
    title: p.name || p.slug,
    desc: p.description || p.statement || 'Mở bài để xem đề chi tiết.',
    difficulty: p.difficulty,
    starter: '',
  }));

  // Load đã giải từ server (Codelab là nguồn chân lý).
  try {
    const stats = await fetchJson('/api/codelab/me/stats');
    // me/stats chỉ trả count — chi tiết slug em lấy qua submissions latest.
    // Đơn giản hoá: cộng dồn từ localStorage + cập nhật khi submit.
    SOLVED = loadLocalSolved();
    if (stats?.acceptedProblems != null) {
      $('prog').title = `Đã pass: ${stats.acceptedProblems} bài Codelab (toàn thời gian)`;
    }
  } catch { SOLVED = loadLocalSolved(); }

  renderList();
  if (CHALLENGES.length) selectChallenge(CHALLENGES[0].id);
}

function bootOfflineMode(){
  MODE = 'offline';
  CHALLENGES = FALLBACK_CHALLENGES;
  SOLVED = loadLocalSolved();
  $('langSel').style.display = 'none';
  document.querySelector('.top h1 .sub').textContent = '— chế độ offline (Codelab chưa cấu hình)';
  $('submitBtn').style.display = 'none'; // offline không nộp được
  renderList();
  if (CHALLENGES.length) selectChallenge(CHALLENGES[0].id);
}

// ====== Render ======
function renderLangSelect(){
  $('langSel').innerHTML = LANGUAGES.map(l =>
    `<option value="${l.id}">${esc(l.label)}</option>`).join('');
  $('langSel').value = String(CURRENT_LANG.id);
  $('langSel').addEventListener('change', e => {
    CURRENT_LANG = LANGUAGES.find(l => l.id === Number(e.target.value)) || LANGUAGES[0];
    if (CURRENT) loadCodeForCurrent();
  });
}

function renderList(){
  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  $('list').innerHTML = cats.map(cat =>
    `<h2>${esc(cat)}</h2>` + CHALLENGES.filter(c => c.cat === cat).map(c =>
      `<div class="ch ${SOLVED.has(c.id)?'solved':''} ${CURRENT && c.id===CURRENT.id?'active':''}" data-id="${esc(c.id)}">
        <span class="st">${SOLVED.has(c.id)?'✓':''}</span>
        <span class="nm">${esc(c.title)}</span>
        ${c.difficulty ? `<span class="lv">${esc(c.difficulty)}</span>` : ''}
      </div>`).join('')).join('');
  $('list').querySelectorAll('.ch').forEach(el =>
    el.addEventListener('click', () => selectChallenge(el.dataset.id)));
  $('prog').textContent = `${SOLVED.size}/${CHALLENGES.length} bài`;
  $('doneBanner').classList.toggle('show', SOLVED.size > 0 && SOLVED.size === CHALLENGES.length);
}

async function selectChallenge(id){
  const ch = CHALLENGES.find(c => c.id === id); if(!ch) return;
  CURRENT = ch;
  renderList();

  // Codelab: lazy-load description khi click (tránh tải dư cả 50 bài).
  if (MODE === 'codelab' && !ch._loaded) {
    try {
      const detail = await fetchJson(`/api/codelab/problems/${encodeURIComponent(ch.slug)}`);
      const p = detail?.data || detail;
      ch.desc = p?.statement || p?.description || ch.desc;
      ch.starter = pickStarter(p, CURRENT_LANG);
      ch.samples = p?.sampleTests || p?.samples || [];
      ch._loaded = true;
    } catch (e) {
      $('prob').innerHTML = `<h3>${esc(ch.title)}</h3><p>⚠️ Không tải được đề: ${esc(e.message)}</p>`;
      return;
    }
  }

  const sampleHtml = (ch.samples && ch.samples[0])
    ? `<p class="ex"><b>Ví dụ:</b><br><span class="k">vào:</span> <code>${esc(ch.samples[0].input || '')}</code><br><span class="k">ra:</span> <code>${esc(ch.samples[0].output || '')}</code></p>`
    : (ch.tests && ch.tests[0])
      ? `<p class="ex">Ví dụ: <code>${esc(ch.fnName)}(${esc(fmt(ch.tests[0].args).slice(1,-1))})</code> → <code>${esc(fmt(ch.tests[0].expected))}</code></p>`
      : '';
  $('prob').innerHTML = `<h3>${esc(ch.title)}${ch.cat ? `<span class="tag">${esc(ch.cat)}</span>` : ''}</h3>
    <div>${escDesc(ch.desc)}</div>${sampleHtml}`;

  loadCodeForCurrent();
  $('results').classList.remove('show'); $('results').innerHTML = '';
  $('hint').textContent = '';
}

function loadCodeForCurrent(){
  let saved = '';
  try { saved = localStorage.getItem(codeKey(CURRENT.id)) || ''; } catch {}
  $('code').value = saved || CURRENT.starter || '';
}

// Lời giải khởi tạo (skeleton) tuỳ ngôn ngữ. Codelab có thể trả starterCode
// theo `languages[].starterCode`. Nếu không có thì để trống.
function pickStarter(problem, lang){
  if (!problem || !lang) return '';
  const langs = problem.languages || problem.starterByLang || [];
  const hit = langs.find?.(l => Number(l.id) === lang.id || (l.name||'').toLowerCase().includes(lang.name));
  return hit?.starterCode || hit?.starter || '';
}

// Cho phép desc có HTML từ Codelab (đã sanitize phía Codelab — tin tưởng).
// Nếu là plain text → bọc <p>.
function escDesc(s){
  if (!s) return '';
  if (/<\w+/.test(s)) return s; // có tag → giữ nguyên
  return `<p>${esc(s).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</p>`;
}

// ====== Run / Submit ======
async function runOnce(){
  if (MODE === 'offline') return runOffline();

  const code = $('code').value;
  if (!code.trim()) { showToast('Hãy viết code trước nhé'); return; }

  $('runBtn').disabled = true; $('runBtn').textContent = '⏳ Đang chạy…';
  try {
    // Codelab: dùng /run-code với expected_output = sample đầu (nếu có) để FE
    // tự render pass/fail; còn /submit mới chấm toàn bộ testcase ẩn.
    const sample = CURRENT.samples?.[0];
    const data = await fetchJson('/api/codelab/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        source_code: code,
        language_id: CURRENT_LANG.id,
        stdin: sample?.input || '',
        expected_output: sample?.output || undefined,
        wait: true,
      }),
    });
    renderRunResult(data, sample);
  } catch (e) {
    $('results').classList.add('show');
    $('results').innerHTML = `<div class="res-head fail">⛔ Lỗi: ${esc(e.message)}</div>`;
  } finally {
    $('runBtn').disabled = false; $('runBtn').textContent = '▶ Chạy thử';
  }
}

async function submitOnce(){
  if (MODE === 'offline') { showToast('Chế độ offline không nộp bài'); return; }
  const code = $('code').value;
  if (!code.trim()) { showToast('Hãy viết code trước nhé'); return; }
  $('submitBtn').disabled = true; $('submitBtn').textContent = '⏳ Đang chấm…';
  try {
    const data = await fetchJson('/api/codelab/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        problemSlug: CURRENT.slug,
        contestSlug: CONTEST_SLUG,
        language_id: CURRENT_LANG.id,
        source_code: code,
      }),
    });
    // Submission tạo xong nhưng có thể chưa chấm xong (Judge0 async). Poll
    // 5 lần × 1.5s cho đến khi status cuối.
    const subId = data?.id || data?.submissionId;
    if (!subId) throw new Error('Codelab không trả submission ID');
    showToast('Đã nộp — đang chấm…');
    let final = null;
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const cur = await fetchJson(`/api/codelab/submissions/${encodeURIComponent(subId)}`);
        const s = (cur?.status || '').toLowerCase();
        if (s && s !== 'queued' && s !== 'running' && s !== 'pending') { final = cur; break; }
      } catch {}
    }
    if (!final) {
      $('results').classList.add('show');
      $('results').innerHTML = `<div class="res-head">⏳ Đang chấm, chưa có kết quả. Mở lại tab sau ít phút nhé (webhook sẽ tự cộng XP khi xong).</div>`;
      return;
    }
    renderSubmitResult(final);
  } catch (e) {
    $('results').classList.add('show');
    $('results').innerHTML = `<div class="res-head fail">⛔ Nộp bài lỗi: ${esc(e.message)}</div>`;
  } finally {
    $('submitBtn').disabled = false; $('submitBtn').textContent = '✓ Nộp bài';
  }
}

function renderRunResult(data, sample){
  const box = $('results'); box.classList.add('show');
  // Judge0 status: id 3=Accepted. Có thể nằm trong data.status hoặc data.result.
  const r = data?.result || data;
  const stdout = r?.stdout || r?.output || '';
  const stderr = r?.stderr || r?.compile_output || '';
  const statusName = r?.status?.description || r?.statusName || (r?.status?.id === 3 ? 'Accepted' : 'Run done');
  const passed = sample && sample.output && stdout.trim() === String(sample.output).trim();
  const head = passed
    ? `<div class="res-head pass">✅ Khớp ví dụ mẫu (${esc(statusName)})</div>`
    : sample
      ? `<div class="res-head fail">⚠️ ${esc(statusName)} — chưa khớp ví dụ mẫu</div>`
      : `<div class="res-head">▶ ${esc(statusName)}</div>`;
  box.innerHTML = head +
    (sample ? `<div class="case ${passed?'pass':'fail'}"><div class="mark">${passed?'✓':'✗'}</div>
      <div class="det">
        <div><span class="k">stdin:</span> ${esc(sample.input || '')}</div>
        <div><span class="k">mong đợi:</span> <code>${esc(sample.output || '')}</code></div>
        <div><span class="k">nhận:</span> <code>${esc(stdout)}</code></div>
      </div></div>` : '') +
    (stdout ? `<div class="console show"><div class="ttl">stdout</div>${esc(stdout)}</div>` : '') +
    (stderr ? `<div class="console show"><div class="ttl">stderr</div>${esc(stderr)}</div>` : '');
}

function renderSubmitResult(sub){
  const box = $('results'); box.classList.add('show');
  const status = (sub.status || '').toLowerCase();
  const passed = sub.passedCases ?? sub.passed_test_cases ?? 0;
  const total  = sub.totalCases  ?? sub.total_test_cases  ?? 0;
  const accepted = status === 'accepted';
  const head = accepted
    ? `<div class="res-head pass">✅ Vượt tất cả ${passed}/${total} test! (Codelab Accepted)</div>`
    : `<div class="res-head fail">⚠️ ${esc(sub.status || 'Failed')} — ${passed}/${total} test</div>`;
  box.innerHTML = head + (sub.message ? `<div class="console show"><div class="ttl">message</div>${esc(sub.message)}</div>` : '');

  if (accepted && !SOLVED.has(CURRENT.id)) {
    SOLVED.add(CURRENT.id); saveLocalSolved(SOLVED); renderList();
    showToast(SOLVED.size === CHALLENGES.length ? '🏆 Hoàn thành toàn bộ Code Lab!' : '✓ Đã giải: ' + CURRENT.title);
    // Cập nhật badge sảnh trường — webhook cộng XP riêng phía server.
    try {
      const k='tizia:space:done'; const d=JSON.parse(localStorage.getItem(k)||'{}');
      d.codelab = Math.max(d.codelab || 0, SOLVED.size);
      d.algolab = Math.max(d.algolab || 0, SOLVED.size);
      localStorage.setItem(k, JSON.stringify(d));
    } catch {}
  }
}

// ====== Offline mode (fallback engine cũ) ======
const WORKER_SRC = `self.onmessage = function(e){
  var d = e.data, logs = [];
  var cap = function(){ logs.push([].slice.call(arguments).map(function(x){ try { return typeof x==='object'? JSON.stringify(x): String(x); } catch(_){ return String(x);} }).join(' ')); };
  try {
    var factory = new Function('console', d.code + '\\n; return typeof ' + d.fnName + ' === "function" ? ' + d.fnName + ' : undefined;');
    var fn = factory({ log:cap, info:cap, warn:cap, error:cap });
    if (typeof fn !== 'function'){ self.postMessage({ ok:false, error:'Chưa định nghĩa hàm ' + d.fnName + '(...)', logs:logs }); return; }
    var results = d.tests.map(function(t){
      try {
        var args = JSON.parse(JSON.stringify(t.args));
        var got = fn.apply(null, args);
        return { args:t.args, expected:t.expected, got:got, pass: JSON.stringify(got) === JSON.stringify(t.expected) };
      } catch(err){ return { args:t.args, expected:t.expected, got:String(err), pass:false, err:true }; }
    });
    self.postMessage({ ok:true, results:results, logs:logs });
  } catch(err){ self.postMessage({ ok:false, error:String(err), logs:logs }); }
};`;

function runOffline(){
  const code = $('code').value;
  return new Promise(resolve => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type:'application/javascript'}))); }
    catch(e){ resolve({ ok:false, error:'Không tạo được Worker: ' + e, logs:[] }); return; }
    const timer = setTimeout(() => { w.terminate(); resolve({ ok:false, error:'Hết thời gian (3s)', logs:[] }); }, 3000);
    w.onmessage = ev => { clearTimeout(timer); w.terminate(); resolve(ev.data); };
    w.onerror = ev => { clearTimeout(timer); w.terminate(); resolve({ ok:false, error: ev.message || 'Lỗi khi chạy code', logs:[] }); };
    w.postMessage({ code, fnName: CURRENT.fnName, tests: CURRENT.tests });
  }).then(data => {
    const box = $('results'); box.classList.add('show');
    if (!data.ok) { box.innerHTML = `<div class="res-head fail">⛔ Lỗi: ${esc(data.error)}</div>`; return; }
    const passed = data.results.filter(r => r.pass).length;
    const allPass = passed === data.results.length;
    const rows = data.results.map(r => `<div class="case ${r.pass?'pass':'fail'}"><div class="mark">${r.pass?'✓':'✗'}</div>
      <div class="det">
        <div><span class="k">vào:</span> ${esc(CURRENT.fnName)}(${esc(fmt(r.args).slice(1,-1))})</div>
        <div><span class="k">mong đợi:</span> ${esc(fmt(r.expected))} <span class="k">nhận:</span> ${esc(fmt(r.got))}</div>
      </div></div>`).join('');
    box.innerHTML = `<div class="res-head ${allPass?'pass':'fail'}">${allPass?'✅ Vượt '+passed+'/'+data.results.length+' test!':'⚠️ Đúng '+passed+'/'+data.results.length+' test'}</div>${rows}`;
    if (allPass && !SOLVED.has(CURRENT.id)) {
      SOLVED.add(CURRENT.id); saveLocalSolved(SOLVED); renderList();
      showToast('✓ Đã giải: ' + CURRENT.title);
    }
  });
}

// ====== Wiring ======
$('code').addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); const t = e.target, s = t.selectionStart, en = t.selectionEnd;
    t.value = t.value.slice(0,s) + '  ' + t.value.slice(en); t.selectionStart = t.selectionEnd = s + 2; }
});
$('code').addEventListener('input', () => {
  if (CURRENT) try { localStorage.setItem(codeKey(CURRENT.id), $('code').value); } catch {}
});

$('runBtn').addEventListener('click', runOnce);
$('submitBtn').addEventListener('click', submitOnce);
$('resetBtn').addEventListener('click', () => {
  if (!CURRENT) return;
  $('code').value = CURRENT.starter || '';
  try { localStorage.removeItem(codeKey(CURRENT.id)); } catch {}
  $('code').focus();
});
$('solBtn').addEventListener('click', async () => {
  if (!CURRENT) return;
  if (MODE === 'offline') {
    if ($('hint').dataset.shown === CURRENT.id) { $('code').value = CURRENT.sol; $('hint').textContent='Đã chèn lời giải mẫu — đọc hiểu rồi tự viết lại.'; }
    else { $('hint').dataset.shown = CURRENT.id; $('hint').textContent='Bấm lần nữa để chèn lời giải mẫu.'; }
    return;
  }
  // Codelab: hỏi /answer — server tự enforce "phải pass mới được xem".
  try {
    const data = await fetchJson(`/api/codelab/problems/${encodeURIComponent(CURRENT.slug)}/answer`);
    const ans = data?.answers?.find(a => Number(a.languageId) === CURRENT_LANG.id) || data?.answers?.[0];
    const code = ans?.files?.[0]?.content || ans?.code || '';
    if (code) { $('code').value = code; $('hint').textContent = 'Đã chèn lời giải mẫu Codelab.'; }
    else { $('hint').textContent = 'Bài này chưa có đáp án mẫu.'; }
  } catch (e) {
    if (e.body?.code === 'USER_HAS_NOT_SOLVED' || e.status === 403) {
      $('hint').textContent = 'Phải pass bài này trước thì Codelab mới cho xem lời giải.';
    } else $('hint').textContent = '⚠️ Lấy lời giải lỗi: ' + e.message;
  }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') runOnce(); });

// giữ tham số domain cho nút back
(function(){ const d=PARAMS.get('domain'); if(d) $('back').href='/school.html?domain='+encodeURIComponent(d)+'#campus-hero'; })();

boot();
</script>
