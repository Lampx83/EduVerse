<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản trị hệ thống · EduVerse</title>
<style>
  :root { --bg:#0f172a; --bg2:#1e293b; --accent:#fbbf24; --border:rgba(255,255,255,0.12); --txt:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 24px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .badge { background:var(--accent); color:#0f172a; font-weight:700; font-size:11px; padding:2px 8px; border-radius:999px; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .card .n { font-size:26px; font-weight:800; color:var(--accent); }
  .card .l { font-size:12px; opacity:0.7; margin-top:2px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--txt); cursor:pointer; font-size:13px; }
  .tab.active { background:var(--accent); color:#0f172a; font-weight:700; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { opacity:0.6; font-weight:600; font-size:11px; text-transform:uppercase; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.08); }
  .err { padding:40px; text-align:center; opacity:0.8; }
  button.act { font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--txt); cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>🛠️ Quản trị hệ thống</h1><span class="badge">ADMIN</span>
  <span style="margin-left:auto;opacity:0.6;font-size:13px" id="who"></span>
</header>
<main id="app"><div class="err">Đang tải…</div></main>

<script type="module">
const $ = (s) => document.querySelector(s);
async function api(path, opts) {
  const r = await fetch(path, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { location.href = '/login.html?return=' + encodeURIComponent('/admin.html'); throw new Error('login'); }
  return { status: r.status, data: await r.json().catch(()=>({})) };
}
const fmt = (t) => t ? new Date(t).toLocaleString('vi-VN') : '—';

const TABS = {
  schools:  { label:'🏫 Trường',   load: () => api('/api/admin/schools').then(r=>r.data.schools),
    cols:['id','code','name','users','attempts','requests'] },
  users:    { label:'👥 Người dùng', load: () => api('/api/admin/users?limit=200').then(r=>r.data.users),
    cols:['id','username','display_name','role','school_id','last_login'], fmtCol:{last_login:fmt} },
  requests: { label:'💡 Góp ý',     load: () => api('/api/admin/requests?limit=200').then(r=>r.data.requests),
    cols:['id','school_id','domain','type','title','status','votes'] },
  decisions:{ label:'🤖 Quyết định AI', load: () => api('/api/admin/ai-decisions?limit=200').then(r=>r.data.decisions),
    cols:['id','school_id','action','status_applied','decided_by','confidence','created_at'], fmtCol:{created_at:fmt} },
  content:  { label:'📚 Học liệu AI', load: () => api('/api/admin/content?limit=200').then(r=>r.data.content),
    cols:['id','school_id','subject','kind','flagged','created_at'], fmtCol:{created_at:fmt} },
  billing:  { label:'💳 Gói cước',  load: () => api('/api/admin/billing').then(r=>r.data.subscriptions),
    cols:['school_id','school','plan','status','current_period_end'], fmtCol:{current_period_end:fmt} },
};

function renderTable(rows, def) {
  if (!rows || !rows.length) return '<div class="err">Chưa có dữ liệu.</div>';
  const head = def.cols.map(c=>`<th>${c}</th>`).join('');
  const body = rows.map(row => '<tr>' + def.cols.map(c => {
    let v = row[c]; if (def.fmtCol && def.fmtCol[c]) v = def.fmtCol[c](v);
    if (c==='status'||c==='plan'||c==='role'||c==='action') v = `<span class="pill">${v??''}</span>`;
    return `<td>${v??'—'}</td>`;
  }).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function showTab(key) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.k===key));
  const host = $('#tabbody'); host.innerHTML = '<div class="err">Đang tải…</div>';
  try { host.innerHTML = renderTable(await TABS[key].load(), TABS[key]); }
  catch(e){ host.innerHTML = `<div class="err">Lỗi: ${e.message}</div>`; }
}

(async function init() {
  // overview vừa xác thực admin (403 nếu không phải)
  const ov = await api('/api/admin/overview');
  if (ov.status === 403) {
    $('#app').innerHTML = '<div class="err">⛔ Cần quyền <b>admin</b>. Tài khoản hiện tại không đủ quyền.<br>Liên hệ quản trị để được cấp quyền (ADMIN_PROMOTE_USERNAME).</div>';
    return;
  }
  const d = ov.data;
  const cards = [
    ['schools','Trường'],['users','Người dùng'],['attempts','Lượt học'],
    ['requests','Góp ý'],['requests_pending','Chờ xử lý'],['ai_decisions','Quyết định AI'],
    ['events','Sự kiện'],['paid_schools','Trường trả phí'],['ai_content','Học liệu AI'],
  ].filter(([k])=>d[k]!=null).map(([k,l])=>`<div class="card"><div class="n">${d[k]}</div><div class="l">${l}</div></div>`).join('');
  $('#app').innerHTML = `<div class="cards">${cards}</div>
    <div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button class="tab" data-k="${k}">${v.label}</button>`).join('')}</div>
    <div id="tabbody"></div>`;
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.k)));
  const meR = await api('/api/auth/me'); $('#who').textContent = meR.data?.user ? '@'+meR.data.user.username : '';
  showTab('schools');
})();
</script>
</body>
</html>
