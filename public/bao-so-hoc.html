<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>⛈️ Bão Số Học · Tizia</title>
<meta name="description" content="Phép tính rơi xuống như mưa — chọn đáp án nhanh trước khi chạm đất. Trò chơi luyện tính nhẩm vui nhộn." />
<style>
  :root {
    --bg-1:#0c1a3a; --bg-2:#142554; --bg-3:#1a3375;
    --neon:#fbbf24; --good:#10b981; --bad:#ef4444; --cool:#38bdf8;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif;
    color:#fff; background: linear-gradient(180deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3));
    overflow:hidden;
  }
  #game { position:relative; width:100%; height:100vh; min-height:600px; overflow:hidden; }

  /* Cloud BG */
  .cloud-bg { position:absolute; top:0; left:0; right:0; height:160px; opacity:.35;
    background: radial-gradient(ellipse 90% 80% at 20% 30%, #fff4 0%, transparent 60%),
                radial-gradient(ellipse 80% 70% at 70% 40%, #fff3 0%, transparent 60%);
    animation: drift-cloud 30s linear infinite;
  }
  @keyframes drift-cloud { from { background-position: 0 0, 0 0; } to { background-position: 200px 0, -150px 0; } }

  /* Lightning flashes on combo */
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition: opacity .08s; }
  .flash.on { opacity:.35; }

  /* HUD */
  .hud { position:absolute; top:14px; left:14px; right:14px; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .back { background:rgba(255,255,255,.08); color:#fff; padding:7px 14px; border-radius:18px; text-decoration:none; font-size:13px; font-weight:600; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.12); }
  .back:hover { background:rgba(255,255,255,.18); }
  .stats { display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; }
  .pill { background:rgba(15,23,42,.7); padding:6px 13px; border-radius:18px; font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,.12); }
  .pill b { color:var(--neon); }
  .pill.life b { color:var(--bad); }
  .pill.combo b { color:var(--cool); }

  /* Falling problem */
  .drop { position:absolute; top:-80px; padding:10px 18px; background: linear-gradient(180deg,#fff,#dde7f5); color:#0c1a3a; border-radius:14px; font-weight:900; font-size:24px; box-shadow:0 10px 26px rgba(0,0,0,.4); animation: fall var(--dur,7s) linear forwards; user-select:none; cursor:default; will-change:top, transform; }
  .drop::before { content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:10px solid #38bdf8; }
  .drop.zap { animation: fall var(--dur,7s) linear forwards, zap .3s ease-out forwards; }
  @keyframes fall {
    0%   { top:-80px; }
    100% { top: calc(100vh - 220px); }
  }
  @keyframes zap {
    0%   { transform: scale(1); background: linear-gradient(180deg,#fff,#10b981); }
    50%  { transform: scale(1.3) rotate(8deg); }
    100% { transform: scale(0); opacity:0; }
  }
  .drop.miss { animation: fall var(--dur,7s) linear forwards, shake .3s ease-out; background: linear-gradient(180deg,#fee2e2,#ef4444); color:#fff; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-12px); } 75% { transform:translateX(12px); } }

  /* Answer buttons (bottom row) */
  #answers { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:6; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:96%; max-width:560px; }
  .ans { flex:1 1 80px; min-width:80px; padding:18px 14px; font-size:26px; font-weight:900; background:rgba(255,255,255,.12); color:#fff; border:2px solid rgba(255,255,255,.2); border-radius:16px; cursor:pointer; font-family:inherit; transition: transform .12s, background .15s; backdrop-filter:blur(8px); }
  .ans:hover { background:rgba(251,191,36,.25); border-color:var(--neon); transform: translateY(-3px); }
  .ans:active { transform: translateY(-1px) scale(.95); }
  .ans.good { background: rgba(16,185,129,.6); border-color: var(--good); animation: bump .25s; }
  .ans.bad { background: rgba(239,68,68,.6); border-color: var(--bad); animation: bump .25s; }
  @keyframes bump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  /* Start / GameOver overlay */
  .modal { position:absolute; inset:0; z-index:20; background: rgba(8,15,34,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal.hide { display:none; }
  .card { background: linear-gradient(180deg,#1c2c5c,#102046); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:32px 36px; max-width:440px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .card .ic { font-size:64px; }
  .card h1 { font-size:28px; margin:8px 0 6px; }
  .card p { margin:0 0 18px; opacity:.85; font-size:14.5px; line-height:1.6; }
  .card .levels { display:flex; gap:10px; justify-content:center; margin:14px 0 18px; flex-wrap:wrap; }
  .card .lv { padding:10px 16px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.15); border-radius:12px; cursor:pointer; font-weight:800; transition: all .15s; font-size:14px; min-width:90px; }
  .card .lv:hover, .card .lv.on { background:var(--neon); color:#1c1502; border-color:transparent; }
  .card button.start { padding:13px 32px; background:var(--neon); color:#1c1502; font-weight:900; border:none; border-radius:18px; font-size:16px; cursor:pointer; box-shadow:0 8px 20px rgba(251,191,36,.4); }
  .card button.start:hover { filter:brightness(1.08); }
  .scoreboard { background:rgba(15,23,42,.5); padding:14px 18px; border-radius:12px; margin:8px 0 16px; }
  .scoreboard b { color:var(--neon); font-size:36px; display:block; }

  /* Floating particles for combo */
  .pop { position:absolute; pointer-events:none; font-size:24px; font-weight:900; color:var(--neon); animation: pop-up 1.1s ease-out forwards; z-index:7; }
  @keyframes pop-up {
    from { transform: translateY(0); opacity:1; }
    to { transform: translateY(-90px); opacity:0; }
  }

  /* Lightning bolt for combo ≥ 3 */
  .bolt { position:absolute; pointer-events:none; font-size:60px; z-index:7; animation: bolt-flash .6s ease-out forwards; }
  @keyframes bolt-flash {
    0% { transform: scale(0) rotate(-20deg); opacity:1; }
    40% { transform: scale(1.4) rotate(0); opacity:1; }
    100% { transform: scale(2) rotate(20deg); opacity:0; }
  }
</style>
</head>
<body>

<div id="game">
  <div class="cloud-bg"></div>
  <div class="flash" id="flash"></div>

  <div class="hud">
    <a class="back" href="/">← Tizia</a>
    <div class="stats">
      <span class="pill">⭐ Điểm: <b id="st-score">0</b></span>
      <span class="pill combo">⚡ Combo: <b id="st-combo">0</b></span>
      <span class="pill life">❤️ Tim: <b id="st-life">5</b></span>
      <span class="pill">🎯 Đúng: <b id="st-right">0</b></span>
    </div>
  </div>

  <div id="answers"></div>

  <!-- Start modal -->
  <div class="modal" id="modal-start">
    <div class="card">
      <div class="ic">⛈️</div>
      <h1>Bão Số Học</h1>
      <p>Phép tính rơi như mưa. Bấm đáp án đúng trước khi chúng chạm đất nhé! Combo cao = sét đánh, điểm gấp đôi.</p>
      <div class="levels">
        <button class="lv on" data-lvl="easy">🐣 Lớp 1-2</button>
        <button class="lv" data-lvl="medium">🦊 Lớp 3-4</button>
        <button class="lv" data-lvl="hard">🦅 Lớp 5+</button>
      </div>
      <button class="start" id="btn-start">▶ Bắt đầu</button>
    </div>
  </div>

  <!-- Game over modal -->
  <div class="modal hide" id="modal-over">
    <div class="card">
      <div class="ic" id="over-ic">😅</div>
      <h1 id="over-title">Hết tim rồi!</h1>
      <div class="scoreboard">
        <b id="over-score">0</b>
        điểm · combo cao nhất <span id="over-combo">0</span> · trả lời đúng <span id="over-right">0</span>
      </div>
      <p id="over-msg">Cứ luyện tập thêm em nhé — bão sẽ dịu xuống thôi.</p>
      <button class="start" id="btn-restart">🔁 Chơi lại</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Bão Số Học — falling-math arcade.
// 3 levels: easy (+,− trong 20), medium (+,−,× trong 100), hard (+,−,×,÷ trong 1000).
// Mỗi câu rớt trong 6-9s, có 4 đáp án ở dưới. Combo +1 mỗi đúng liên tiếp.
// ============================================================
const $ = (s) => document.querySelector(s);
const game = $('#game');

let level = 'easy';
let running = false;
let score = 0, combo = 0, maxCombo = 0, life = 5, right = 0;
let currentDrop = null;
let spawnTimer = null;

const LEVELS = {
  easy:   { max: 20,   ops: ['+','-'],         spawnMs: 2200, dur: 8.5 },
  medium: { max: 100,  ops: ['+','-','×'],     spawnMs: 1900, dur: 7.5 },
  hard:   { max: 1000, ops: ['+','-','×','÷'], spawnMs: 1600, dur: 6.5 },
};

function rand(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[rand(arr.length)]; }

function genProblem() {
  const cfg = LEVELS[level];
  const op = pick(cfg.ops);
  let a, b, ans, expr;
  switch (op) {
    case '+':
      a = rand(cfg.max); b = rand(cfg.max); ans = a + b;
      expr = `${a} + ${b}`;
      break;
    case '-':
      a = rand(cfg.max); b = rand(a + 1); ans = a - b;
      expr = `${a} − ${b}`;
      break;
    case '×': {
      const m = level === 'medium' ? 12 : 25;
      a = rand(m) + 2; b = rand(m) + 2; ans = a * b;
      expr = `${a} × ${b}`;
      break;
    }
    case '÷': {
      const m = level === 'hard' ? 20 : 12;
      b = rand(m) + 2; ans = rand(m) + 1; a = b * ans;
      expr = `${a} ÷ ${b}`;
      break;
    }
  }
  return { expr, ans };
}

function genChoices(correct) {
  const set = new Set([correct]);
  while (set.size < 4) {
    let n = correct + (rand(2) ? 1 : -1) * (rand(8) + 1);
    if (n < 0 || rand(8) === 0) n = correct + (rand(2) ? 1 : -1) * (rand(20) + 1);
    if (n >= 0 && n !== correct) set.add(n);
  }
  return [...set].sort(() => Math.random() - .5);
}

function spawn() {
  if (!running || currentDrop) return;
  const p = genProblem();
  const cfg = LEVELS[level];
  const x = 60 + rand(window.innerWidth - 240);
  const div = document.createElement('div');
  div.className = 'drop';
  div.style.left = x + 'px';
  div.style.setProperty('--dur', cfg.dur + 's');
  div.textContent = p.expr + ' = ?';
  div.dataset.ans = p.ans;
  game.appendChild(div);
  currentDrop = div;

  // Render answer buttons
  const answers = genChoices(p.ans);
  const wrap = $('#answers');
  wrap.innerHTML = '';
  for (const a of answers) {
    const btn = document.createElement('button');
    btn.className = 'ans';
    btn.textContent = a;
    btn.dataset.val = a;
    btn.addEventListener('click', () => onAnswer(a, btn));
    wrap.appendChild(btn);
  }

  // Watch fall — when animationend (reached bottom) without answer → miss
  div.addEventListener('animationend', () => {
    if (currentDrop === div) onMiss();
  });
}

function onAnswer(val, btn) {
  if (!currentDrop) return;
  const correct = Number(currentDrop.dataset.ans);
  if (Number(val) === correct) {
    score += 10 + combo * 5;
    combo++; maxCombo = Math.max(maxCombo, combo);
    right++;
    btn.classList.add('good');
    currentDrop.classList.add('zap');
    spawnPop(currentDrop, '+' + (10 + (combo - 1) * 5));
    if (combo >= 3) {
      spawnBolt(currentDrop);
      flash();
    }
  } else {
    combo = 0;
    life--;
    btn.classList.add('bad');
    currentDrop.classList.add('miss');
    spawnPop(currentDrop, '✗', '#ef4444');
  }
  updateHud();
  const oldDrop = currentDrop;
  currentDrop = null;
  setTimeout(() => oldDrop?.remove(), 350);
  if (life <= 0) return gameOver();
  // immediate next spawn for momentum
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawn, 350);
}

function onMiss() {
  if (!currentDrop) return;
  combo = 0; life--;
  currentDrop.remove(); currentDrop = null;
  updateHud();
  if (life <= 0) return gameOver();
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawn, 600);
}

function spawnPop(near, text, color) {
  const r = near.getBoundingClientRect();
  const p = document.createElement('div');
  p.className = 'pop';
  p.textContent = text;
  if (color) p.style.color = color;
  p.style.left = (r.left + r.width / 2) + 'px';
  p.style.top  = r.top + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1100);
}
function spawnBolt(near) {
  const r = near.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'bolt';
  b.textContent = '⚡';
  b.style.left = (r.left + r.width / 2 - 30) + 'px';
  b.style.top  = (r.top - 20) + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 600);
}
function flash() {
  const f = $('#flash');
  f.classList.add('on');
  setTimeout(() => f.classList.remove('on'), 90);
}

function updateHud() {
  $('#st-score').textContent = score;
  $('#st-combo').textContent = combo;
  $('#st-life').textContent = life;
  $('#st-right').textContent = right;
}

function start(lvl) {
  level = lvl;
  score = 0; combo = 0; maxCombo = 0; life = 5; right = 0;
  running = true;
  currentDrop = null;
  $('#modal-start').classList.add('hide');
  $('#modal-over').classList.add('hide');
  updateHud();
  spawn();
  // Steady spawn loop (in case onAnswer didn't trigger one)
  clearInterval(spawnTimer);
  spawnTimer = setInterval(() => { if (!currentDrop) spawn(); }, LEVELS[level].spawnMs);
}

function gameOver() {
  running = false;
  clearInterval(spawnTimer);
  if (currentDrop) { currentDrop.remove(); currentDrop = null; }
  $('#answers').innerHTML = '';
  $('#over-score').textContent = score;
  $('#over-combo').textContent = maxCombo;
  $('#over-right').textContent = right;
  let title, ic, msg;
  if (score >= 300) { ic = '🏆'; title = 'Tuyệt vời!'; msg = 'Em là cao thủ Bão Số Học — sét đánh đầu các con tính!'; }
  else if (score >= 150) { ic = '🌟'; title = 'Giỏi quá!'; msg = 'Em đã tính rất tốt. Cố thêm chút nữa là phá kỉ lục!'; }
  else if (score >= 60) { ic = '👍'; title = 'Khá đó!'; msg = 'Em đang tiến bộ. Luyện thêm để giữ combo lâu hơn nhé.'; }
  else { ic = '🌱'; title = 'Cố lên!'; msg = 'Đừng nản — mỗi lần chơi là một lần em giỏi hơn.'; }
  $('#over-ic').textContent = ic;
  $('#over-title').textContent = title;
  $('#over-msg').textContent = msg;
  $('#modal-over').classList.remove('hide');

  // Lưu điểm cao
  const key = 'bao-so-hoc.best.' + level;
  const prev = Number(localStorage.getItem(key) || 0);
  if (score > prev) localStorage.setItem(key, score);

  // Sync wallet XP nếu có
  try {
    const xpGain = Math.floor(score / 10);
    if (xpGain > 0 && window.fetch) {
      fetch('/api/wallet', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(w => {
          if (!w) return;
          fetch('/api/wallet', {
            method: 'PUT',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...w, xp: (w.xp || 0) + xpGain }),
          });
        });
    }
  } catch {}
}

// Level pickers
for (const btn of document.querySelectorAll('.lv')) {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lv').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    level = btn.dataset.lvl;
  });
}
$('#btn-start').addEventListener('click', () => start(level));
$('#btn-restart').addEventListener('click', () => start(level));
</script>
</body>
</html>
