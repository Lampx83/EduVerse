<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🧪 Lab Hoá Học Ảo · Tizia</title>
<meta name="description" content="Lab hoá học ảo — kéo thả hai hoá chất vào ống nghiệm để khám phá phản ứng, hiện tượng và phương trình." />
<style>
  :root {
    --bg-1:#dbeafe; --bg-2:#ede9fe; --bg-3:#ffffff;
    --ink:#0f172a; --muted:#475569;
    --accent:#7c3aed; --accent-2:#2563eb;
    --good:#10b981; --bad:#ef4444; --warn:#f59e0b;
    --line:rgba(15,23,42,.1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Inter','Be Vietnam Pro',system-ui,sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  /* Banner */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .back {
    background: rgba(124,58,237,.1); color: var(--accent);
    padding: 7px 14px; border-radius: 18px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    border: 1px solid rgba(124,58,237,.25);
    transition: background .15s, transform .12s;
  }
  .back:hover { background: rgba(124,58,237,.2); transform: translateX(-2px); }
  .title { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
  .title .em { font-size: 22px; margin-right: 6px; }
  .stat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: #fff; border: 1px solid var(--line);
    padding: 6px 13px; border-radius: 14px;
    font-size: 13px; font-weight: 700; color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .pill b { color: var(--accent); }

  /* Layout 3 cột */
  .lab {
    display: grid; grid-template-columns: 280px 1fr 320px;
    gap: 18px; padding: 18px 22px 30px;
    max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 980px) {
    .lab { grid-template-columns: 1fr; }
  }

  /* Cột trái — kệ hoá chất */
  .shelf {
    background: rgba(255,255,255,.7);
    border-radius: 18px; padding: 16px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 18px rgba(15,23,42,.05);
  }
  .shelf h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .bottles {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .bottle {
    position: relative;
    padding: 10px 8px 10px; border-radius: 12px;
    background: linear-gradient(180deg, #fff, #f8fafc);
    border: 1.5px solid var(--line);
    cursor: grab; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .12s, border-color .15s, box-shadow .15s;
  }
  .bottle:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 16px rgba(124,58,237,.18); }
  .bottle:active { cursor: grabbing; transform: scale(.97); }
  .bottle.dragging { opacity: .4; }
  .bottle svg { width: 38px; height: 50px; }
  .bottle .nm { font-size: 12.5px; font-weight: 800; }
  .bottle .lbl { font-size: 10.5px; opacity: .65; }

  /* Trung tâm — ống nghiệm */
  .work {
    background: rgba(255,255,255,.6);
    border-radius: 18px; padding: 24px;
    border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    box-shadow: 0 4px 18px rgba(15,23,42,.05);
  }
  .work h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .tube-area {
    position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    width: 220px; height: 320px;
  }
  .tube {
    position: relative;
    width: 110px; height: 280px;
    border: 4px solid rgba(15,23,42,.3);
    border-top: none;
    border-radius: 0 0 55px 55px;
    background: linear-gradient(180deg, rgba(255,255,255,.4) 0%, rgba(220,230,250,.25) 100%);
    overflow: hidden;
    transition: border-color .25s;
  }
  .tube::before {
    content: ''; position: absolute; top: -8px; left: -4px; right: -4px; height: 14px;
    border: 4px solid rgba(15,23,42,.3); border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: rgba(255,255,255,.5);
  }
  .tube.drop-target { border-color: var(--accent); box-shadow: 0 0 0 6px rgba(124,58,237,.15); }
  .liquid {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3), currentColor);
    color: transparent;
    transition: height .5s ease-out, background-color .5s;
  }
  .liquid.fill { height: 60%; }
  .liquid.fill-full { height: 78%; }
  .bubble {
    position: absolute;
    bottom: 0;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    animation: rise 1.6s linear forwards;
    pointer-events: none;
  }
  @keyframes rise {
    0%   { bottom: 5%; opacity: .9; transform: translateX(0) scale(.6); }
    100% { bottom: 90%; opacity: 0; transform: translateX(var(--dx, 0)) scale(1.2); }
  }
  .precip {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: fall 1.4s ease-in forwards;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { top: 10%; opacity: 1; }
    100% { top: 80%; opacity: .8; }
  }

  .mixers {
    display: flex; gap: 10px; min-height: 80px;
    align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .mixer-slot {
    width: 76px; height: 76px;
    border-radius: 14px;
    border: 2.5px dashed rgba(124,58,237,.35);
    background: rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2px;
    transition: background .15s, border-color .15s;
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .mixer-slot.over { background: rgba(124,58,237,.12); border-color: var(--accent); }
  .mixer-slot.filled { background: #fff; border-style: solid; border-color: var(--line); }
  .mixer-slot .nm { font-weight: 800; font-size: 12.5px; color: var(--ink); }
  .mixer-slot svg { width: 30px; height: 38px; }

  .actions { display: flex; gap: 10px; }
  .btn {
    padding: 10px 20px; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-weight: 800; font-size: 13.5px; font-family: inherit;
    border: none; cursor: pointer;
    box-shadow: 0 4px 12px rgba(124,58,237,.3);
    transition: transform .12s, filter .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.ghost {
    background: #fff; color: var(--ink);
    border: 1px solid var(--line); box-shadow: none;
  }
  .btn.ghost:hover:not(:disabled) { background: #f8fafc; }

  /* Cột phải — kết quả */
  .result {
    background: rgba(255,255,255,.85);
    border-radius: 18px; padding: 18px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 18px rgba(15,23,42,.05);
    display: flex; flex-direction: column; gap: 12px;
  }
  .result h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .result-empty { font-size: 13px; color: var(--muted); padding: 14px 4px; line-height: 1.55; }
  .eq {
    font-size: 17px; font-weight: 800; line-height: 1.4;
    background: linear-gradient(135deg, #f0f9ff, #faf5ff);
    border: 1px solid rgba(124,58,237,.2);
    border-radius: 12px; padding: 12px 14px;
  }
  .phen {
    font-size: 13.5px; line-height: 1.6;
    background: #fffbeb; border: 1px solid #fde68a;
    border-radius: 10px; padding: 10px 12px;
  }
  .phen b { color: var(--warn); }
  .expl { font-size: 13px; line-height: 1.6; color: var(--muted); }
  .tag {
    display: inline-block;
    padding: 3px 9px; border-radius: 8px;
    font-size: 11.5px; font-weight: 700;
    margin-right: 4px;
  }
  .tag.kt { background: #dbeafe; color: #1e40af; }      /* kết tủa */
  .tag.kh { background: #fef3c7; color: #92400e; }      /* khí */
  .tag.dm { background: #fce7f3; color: #9d174d; }      /* đổi màu */
  .tag.nh { background: #d1fae5; color: #065f46; }      /* nhiệt */

  .progress-bar {
    margin-top: auto;
    background: #f1f5f9; border-radius: 999px; height: 8px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .4s ease;
  }
  .progress-text { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(15,23,42,.92); color: #fff;
    padding: 11px 22px; border-radius: 14px;
    font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.good { background: rgba(16,185,129,.95); }
  .toast.bad { background: rgba(239,68,68,.95); }

  /* Sparkle */
  .sparkle {
    position: fixed; pointer-events: none;
    font-size: 20px;
    animation: spark .9s ease-out forwards;
    z-index: 90;
  }
  @keyframes spark {
    0%   { opacity: 0; transform: scale(.4); }
    30%  { opacity: 1; transform: scale(1.3) rotate(20deg); }
    100% { opacity: 0; transform: scale(.6) translateY(-50px) rotate(-30deg); }
  }

  .legend {
    margin-top: 10px;
    background: rgba(255,255,255,.7);
    border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
    font-size: 12px; color: var(--muted); line-height: 1.6;
  }
  .legend b { color: var(--ink); }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/">← Tizia</a>
  <div class="title"><span class="em">🧪</span>Lab Hoá Học Ảo</div>
  <div class="stat">
    <span class="pill">🧬 Khám phá: <b id="st-disc">0</b>/15</span>
    <span class="pill">⭐ XP: <b id="st-xp">0</b></span>
  </div>
</div>

<div class="lab">
  <!-- Cột trái -->
  <section class="shelf">
    <h3>🧪 Kệ hoá chất</h3>
    <div class="bottles" id="bottles"></div>
    <div class="legend">
      Kéo 2 lọ vào ống nghiệm để pha trộn.
      <b>↓</b> = kết tủa, <b>↑</b> = khí bay lên.
    </div>
  </section>

  <!-- Trung tâm -->
  <section class="work">
    <h3>⚗ Ống nghiệm</h3>
    <div class="mixers">
      <div class="mixer-slot" id="slot-1" data-slot="0">Lọ 1<br/><span style="font-size:18px">＋</span></div>
      <div class="mixer-slot" id="slot-2" data-slot="1">Lọ 2<br/><span style="font-size:18px">＋</span></div>
    </div>
    <div class="tube-area">
      <div class="tube" id="tube">
        <div class="liquid" id="liquid"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-react" disabled>▶ Pha trộn</button>
      <button class="btn ghost" id="btn-clear">🧹 Rửa ống</button>
    </div>
  </section>

  <!-- Cột phải -->
  <section class="result">
    <h3>📋 Kết quả</h3>
    <div id="result-body">
      <div class="result-empty">
        Chưa có phản ứng nào.<br/>Hãy chọn 2 hoá chất rồi bấm <b>Pha trộn</b> để xem điều gì xảy ra!
      </div>
    </div>
    <div>
      <div class="progress-bar"><div id="pg" style="width:0%"></div></div>
      <div class="progress-text" id="pg-text">0 / 15 phản ứng đã khám phá</div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// Lab Hoá Học Ảo — kéo thả 2 hoá chất, hiển thị phản ứng + hiện tượng.
// ============================================================

const $ = (s) => document.querySelector(s);

// Bộ 10 hoá chất — màu cho liquid + SVG đơn giản.
const CHEMS = {
  HCl:     { name: 'HCl',       label: 'Axit clohiđric',   color: '#fef3c7', edge: '#f59e0b' },
  NaOH:    { name: 'NaOH',      label: 'Bazơ NaOH',         color: '#dbeafe', edge: '#3b82f6' },
  H2SO4:   { name: 'H₂SO₄',     label: 'Axit sunfuric',     color: '#fde68a', edge: '#d97706' },
  NaCl:    { name: 'NaCl',      label: 'Muối ăn',           color: '#f1f5f9', edge: '#94a3b8' },
  AgNO3:   { name: 'AgNO₃',     label: 'Bạc nitrat',        color: '#e0e7ff', edge: '#6366f1' },
  CuSO4:   { name: 'CuSO₄',     label: 'Đồng sunfat',       color: '#bfdbfe', edge: '#2563eb' },
  BaCl2:   { name: 'BaCl₂',     label: 'Bari clorua',       color: '#f3e8ff', edge: '#9333ea' },
  Na2CO3:  { name: 'Na₂CO₃',    label: 'Natri cacbonat',    color: '#dcfce7', edge: '#16a34a' },
  Zn:      { name: 'Zn',        label: 'Kẽm (kim loại)',    color: '#e2e8f0', edge: '#475569' },
  Fe:      { name: 'Fe',        label: 'Sắt (kim loại)',    color: '#fee2e2', edge: '#b91c1c' },
};

// 15 cặp phản ứng. Key = "A+B" (sắp xếp theo bảng chữ cái để dedupe).
function pairKey(a, b) { return [a, b].sort().join('+'); }
const RXN = {};
function add(a, b, data) { RXN[pairKey(a, b)] = data; }

add('HCl', 'NaOH', {
  eq: 'HCl + NaOH → NaCl + H₂O',
  phen: 'Trung hoà, không màu, hơi ấm lên.',
  expl: 'Phản ứng giữa axit và bazơ tạo muối và nước. Đây là phản ứng trung hoà cơ bản.',
  tags: ['nh'],
  liquidColor: '#e0f2fe', emit: 'heat',
});
add('AgNO3', 'NaCl', {
  eq: 'AgNO₃ + NaCl → AgCl↓ + NaNO₃',
  phen: 'Xuất hiện kết tủa trắng đục.',
  expl: 'AgCl là kết tủa trắng không tan trong nước — dùng để nhận biết ion Cl⁻.',
  tags: ['kt'],
  liquidColor: '#f8fafc', emit: 'precip', precipColor: '#ffffff',
});
add('CuSO4', 'NaOH', {
  eq: 'CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄',
  phen: 'Kết tủa xanh lam Cu(OH)₂.',
  expl: 'Đồng hiđroxit là kết tủa màu xanh lam đặc trưng, không tan trong nước.',
  tags: ['kt', 'dm'],
  liquidColor: '#3b82f6', emit: 'precip', precipColor: '#1d4ed8',
});
add('BaCl2', 'H2SO4', {
  eq: 'BaCl₂ + H₂SO₄ → BaSO₄↓ + 2HCl',
  phen: 'Kết tủa trắng BaSO₄ rất bền.',
  expl: 'BaSO₄ là kết tủa trắng không tan trong cả axit mạnh — dùng nhận biết ion SO₄²⁻.',
  tags: ['kt'],
  liquidColor: '#f1f5f9', emit: 'precip', precipColor: '#ffffff',
});
add('Zn', 'HCl', {
  eq: 'Zn + 2HCl → ZnCl₂ + H₂↑',
  phen: 'Sủi bọt khí hiđro, kẽm tan dần.',
  expl: 'Kim loại Zn đứng trước H trong dãy hoạt động → đẩy được H ra khỏi axit.',
  tags: ['kh'],
  liquidColor: '#fef9c3', emit: 'gas',
});
add('Fe', 'CuSO4', {
  eq: 'Fe + CuSO₄ → FeSO₄ + Cu',
  phen: 'Đinh sắt phủ lớp đồng đỏ, dung dịch xanh nhạt dần.',
  expl: 'Phản ứng thế: Fe mạnh hơn Cu nên đẩy Cu ra khỏi muối.',
  tags: ['dm'],
  liquidColor: '#86efac', emit: 'precip', precipColor: '#b45309',
});
add('HCl', 'Na2CO3', {
  eq: 'Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑',
  phen: 'Sủi bọt mạnh khí CO₂.',
  expl: 'Axit tác dụng với muối cacbonat → giải phóng khí CO₂ không màu, không cháy.',
  tags: ['kh'],
  liquidColor: '#fef3c7', emit: 'gas',
});
add('CuSO4', 'Fe', {
  eq: 'Fe + CuSO₄ → FeSO₄ + Cu',
  phen: 'Sắt bị phủ một lớp đồng đỏ.',
  expl: 'Cùng phản ứng thế kim loại — đây là cặp đảo của Fe+CuSO₄.',
  tags: ['dm'],
  liquidColor: '#86efac', emit: 'precip', precipColor: '#b45309',
});
add('CuSO4', 'Zn', {
  eq: 'Zn + CuSO₄ → ZnSO₄ + Cu',
  phen: 'Lớp đồng đỏ bám trên kẽm, dung dịch xanh nhạt dần.',
  expl: 'Zn mạnh hơn Cu → đẩy Cu ra. Dung dịch ZnSO₄ không màu thay cho CuSO₄ xanh.',
  tags: ['dm'],
  liquidColor: '#bae6fd', emit: 'precip', precipColor: '#b45309',
});
add('NaOH', 'H2SO4', {
  eq: '2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O',
  phen: 'Trung hoà, dung dịch hơi ấm.',
  expl: 'Axit mạnh + bazơ mạnh → muối trung tính + nước. Toả nhiệt.',
  tags: ['nh'],
  liquidColor: '#e0f2fe', emit: 'heat',
});
add('NaCl', 'AgNO3', {
  eq: 'NaCl + AgNO₃ → AgCl↓ + NaNO₃',
  phen: 'Kết tủa trắng AgCl.',
  expl: 'Cặp ion bạc và clorua kết hợp tức thì thành chất rắn trắng.',
  tags: ['kt'],
  liquidColor: '#f8fafc', emit: 'precip', precipColor: '#ffffff',
});
add('BaCl2', 'Na2CO3', {
  eq: 'BaCl₂ + Na₂CO₃ → BaCO₃↓ + 2NaCl',
  phen: 'Kết tủa trắng BaCO₃.',
  expl: 'BaCO₃ không tan trong nước (tan trong axit mạnh).',
  tags: ['kt'],
  liquidColor: '#f1f5f9', emit: 'precip', precipColor: '#ffffff',
});
add('Fe', 'H2SO4', {
  eq: 'Fe + H₂SO₄ → FeSO₄ + H₂↑',
  phen: 'Sủi bọt khí hiđro, sắt tan dần, dung dịch xanh lục nhạt.',
  expl: 'Fe đứng trước H → tác dụng với axit loãng giải phóng H₂.',
  tags: ['kh', 'dm'],
  liquidColor: '#d1fae5', emit: 'gas',
});
add('H2SO4', 'Na2CO3', {
  eq: 'Na₂CO₃ + H₂SO₄ → Na₂SO₄ + H₂O + CO₂↑',
  phen: 'Sủi bọt khí CO₂ rất mạnh.',
  expl: 'Tương tự HCl, axit sunfuric phản ứng với muối cacbonat tạo khí CO₂.',
  tags: ['kh'],
  liquidColor: '#fef3c7', emit: 'gas',
});
add('CuSO4', 'HCl', {
  eq: 'CuSO₄ + HCl → (không phản ứng)',
  phen: 'Không có hiện tượng đáng kể, dung dịch vẫn xanh lam.',
  expl: 'HCl không đủ mạnh để đẩy H₂SO₄ ra khỏi muối CuSO₄ (đều là axit mạnh tan tốt).',
  tags: [],
  liquidColor: '#bfdbfe', emit: null,
  noReact: true,
});

// ----------- Render kệ ----------
const bottlesEl = $('#bottles');
function bottleSvg(edge, color) {
  return `<svg viewBox="0 0 40 50">
    <rect x="14" y="2" width="12" height="6" rx="1.5" fill="${edge}" />
    <path d="M10 12 L10 44 Q10 48 14 48 L26 48 Q30 48 30 44 L30 12 Z"
          fill="${color}" stroke="${edge}" stroke-width="1.6"/>
    <path d="M12 24 L28 24 L28 44 Q28 46 26 46 L14 46 Q12 46 12 44 Z"
          fill="${color}" opacity=".7"/>
  </svg>`;
}
for (const [id, c] of Object.entries(CHEMS)) {
  const div = document.createElement('div');
  div.className = 'bottle';
  div.draggable = true;
  div.dataset.chem = id;
  div.innerHTML = `${bottleSvg(c.edge, c.color)}<div class="nm">${c.name}</div><div class="lbl">${c.label}</div>`;
  div.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/chem', id);
    div.classList.add('dragging');
  });
  div.addEventListener('dragend', () => div.classList.remove('dragging'));
  // Click cũng được — chọn ô đầu tiên còn trống.
  div.addEventListener('click', () => placeChemFirstEmpty(id));
  bottlesEl.appendChild(div);
}

// ----------- Slot mixers ----------
const slots = [null, null];
const slotEls = [$('#slot-1'), $('#slot-2')];

slotEls.forEach((el, idx) => {
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('over');
    const id = e.dataTransfer.getData('text/chem');
    if (id) placeChem(idx, id);
  });
  el.addEventListener('click', () => {
    if (slots[idx]) { slots[idx] = null; renderSlot(idx); updateReactBtn(); }
  });
});

function placeChem(idx, id) {
  if (!CHEMS[id]) return;
  slots[idx] = id;
  renderSlot(idx);
  updateReactBtn();
}
function placeChemFirstEmpty(id) {
  const idx = slots[0] ? (slots[1] ? -1 : 1) : 0;
  if (idx < 0) { toast('Ống nghiệm đã đủ 2 lọ — bấm Pha trộn hoặc Rửa ống nhé.', 'bad'); return; }
  placeChem(idx, id);
}
function renderSlot(idx) {
  const el = slotEls[idx];
  const id = slots[idx];
  if (!id) {
    el.classList.remove('filled');
    el.innerHTML = `Lọ ${idx+1}<br/><span style="font-size:18px">＋</span>`;
    return;
  }
  const c = CHEMS[id];
  el.classList.add('filled');
  el.innerHTML = `${bottleSvg(c.edge, c.color)}<div class="nm">${c.name}</div>`;
}
function updateReactBtn() {
  $('#btn-react').disabled = !(slots[0] && slots[1]);
}

// Tube cũng nhận drop trực tiếp — UX dễ hơn.
const tubeEl = $('#tube');
['#tube', '.tube-area'].forEach(sel => {
  const el = document.querySelector(sel);
  el.addEventListener('dragover', (e) => { e.preventDefault(); tubeEl.classList.add('drop-target'); });
  el.addEventListener('dragleave', () => tubeEl.classList.remove('drop-target'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    tubeEl.classList.remove('drop-target');
    const id = e.dataTransfer.getData('text/chem');
    if (id) placeChemFirstEmpty(id);
  });
});

// ----------- Phản ứng ----------
$('#btn-react').addEventListener('click', react);
$('#btn-clear').addEventListener('click', clearTube);

const liquidEl = $('#liquid');
function clearTube() {
  slots[0] = null; slots[1] = null;
  renderSlot(0); renderSlot(1);
  updateReactBtn();
  liquidEl.style.color = 'transparent';
  liquidEl.classList.remove('fill', 'fill-full');
  // Xóa bubbles/precip còn sót
  tubeEl.querySelectorAll('.bubble, .precip').forEach(n => n.remove());
}

function react() {
  const [a, b] = slots;
  if (!a || !b) return;
  const key = pairKey(a, b);
  const rxn = RXN[key];

  if (!rxn) {
    // Không có phản ứng trong bộ
    toast('🤔 Không có phản ứng — thử cặp khác nhé!', 'bad');
    return;
  }

  // Render visual
  liquidEl.style.color = rxn.liquidColor;
  liquidEl.classList.add('fill-full');
  setTimeout(() => emitEffects(rxn), 350);

  // Render kết quả
  renderResult(a, b, rxn);

  // Discovery tracking
  if (!rxn.noReact) markDiscovered(key);
}

function emitEffects(rxn) {
  // Clear cũ
  tubeEl.querySelectorAll('.bubble, .precip').forEach(n => n.remove());
  if (rxn.emit === 'gas') {
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        const b = document.createElement('div');
        b.className = 'bubble';
        b.style.left = (20 + Math.random() * 70) + 'px';
        b.style.setProperty('--dx', (Math.random() * 12 - 6) + 'px');
        tubeEl.appendChild(b);
        setTimeout(() => b.remove(), 1700);
      }, i * 180);
    }
  } else if (rxn.emit === 'precip') {
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const p = document.createElement('div');
        p.className = 'precip';
        p.style.left = (15 + Math.random() * 75) + 'px';
        p.style.background = rxn.precipColor || '#ffffff';
        tubeEl.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }, i * 90);
    }
  } else if (rxn.emit === 'heat') {
    // Sparkle xung quanh
    const rect = tubeEl.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = '✨';
      s.style.left = (rect.left + rect.width / 2 + (Math.random() * 80 - 40)) + 'px';
      s.style.top  = (rect.top + Math.random() * rect.height) + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
}

function renderResult(a, b, rxn) {
  const tagMap = { kt: '↓ Kết tủa', kh: '↑ Khí', dm: '🎨 Đổi màu', nh: '🔥 Toả nhiệt' };
  const tagsHtml = rxn.tags.map(t => `<span class="tag ${t}">${tagMap[t] || t}</span>`).join('');
  $('#result-body').innerHTML = `
    <div class="eq">${rxn.eq}</div>
    <div class="phen">${tagsHtml}<br/><b>Hiện tượng:</b> ${rxn.phen}</div>
    <div class="expl"><b>Giải thích:</b> ${rxn.expl}</div>
  `;
}

// ----------- Discovery + XP ----------
const STORAGE_KEY = 'lab-hoa.discovered';
const XP_KEY = 'lab-hoa.xp';
let discovered = new Set();
let xp = 0;
try { discovered = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch {}
try { xp = Number(localStorage.getItem(XP_KEY) || 0); } catch {}

function refreshProgress() {
  // Tổng phản ứng có ý nghĩa (không phải noReact) = 14 + 1 noReact = 15 (tính cả "khám phá" cặp không phản ứng)
  const total = Object.keys(RXN).length; // 15
  const n = discovered.size;
  $('#st-disc').textContent = n;
  $('#st-xp').textContent = xp;
  const pct = Math.min(100, Math.round((n / total) * 100));
  $('#pg').style.width = pct + '%';
  $('#pg-text').textContent = `${n} / ${total} phản ứng đã khám phá`;
}

function markDiscovered(key) {
  if (discovered.has(key)) {
    toast('🔁 Phản ứng đã biết — vẫn tốt để ôn lại!', 'good');
    return;
  }
  discovered.add(key);
  xp += 10;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...discovered])); } catch {}
  try { localStorage.setItem(XP_KEY, String(xp)); } catch {}
  toast('🎉 Khám phá phản ứng mới! +10 XP', 'good');
  syncWalletXp(10);
  refreshProgress();
}

function syncWalletXp(gain) {
  if (!gain || !window.fetch) return;
  try {
    fetch('/api/wallet', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(w => {
        if (!w) return;
        fetch('/api/wallet', {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...w, xp: (w.xp || 0) + gain }),
        });
      })
      .catch(() => {});
  } catch {}
}

function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

refreshProgress();
</script>
</body>
</html>
