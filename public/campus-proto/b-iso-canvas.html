function prep(obj,scale){ obj.scale.setScalar(scale); const b=new THREE.Box3().setFromObject(obj); const c=b.getCenter(new THREE.Vector3());
  obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=b.min.y; return new THREE.Box3().setFromObject(obj); }
const footOf=o=>{ const b=new THREE.Box3().setFromObject(o); const v=b.getSize(new THREE.Vector3()); return Math.max(v.x,v.z); };

function recolor(obj,hex){ obj.traverse(o=>{ if(o.isMesh&&o.material){
  const tm=m=>{ const c=m.clone(); if(c.color) c.color.setHex(hex); c.needsUpdate=true; return c; };
  o.material = Array.isArray(o.material) ? o.material.map(tm) : tm(o.material); } }); }
function renderSprite(obj){ rscene.add(obj); rt.render(rscene,rcam); rscene.remove(obj);
  const cv=document.createElement('canvas'); cv.width=rt.domElement.width; cv.height=rt.domElement.height;
  cv.getContext('2d').drawImage(rt.domElement,0,0); return cv; }
function tint(spr,color){ const cv=document.createElement('canvas'); cv.width=spr.width; cv.height=spr.height; const x=cv.getContext('2d');
  x.drawImage(spr,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,cv.width,cv.height); return cv; }

(async function build(){

  let maxFoot=0; for(const it of items) maxFoot=Math.max(maxFoot, footOf(it.sc));
  const GS = maxFoot? 4/maxFoot : 1;
  let maxDim=0; for(const it of items){ const bb=prep(it.sc,GS); if(TINTS[it.b.id]!=null) recolor(it.sc, TINTS[it.b.id]); const v=bb.getSize(new THREE.Vector3()); maxDim=Math.max(maxDim,v.x,v.y,v.z); }
  const FH=maxDim*0.62;
  rcam.left=-FH; rcam.right=FH; rcam.top=FH; rcam.bottom=-FH; rcam.lookAt(0, maxDim*0.34, 0); rcam.updateProjectionMatrix(); rcam.updateMatrixWorld(true);
  const o=new THREE.Vector3(0,0,0).project(rcam); ANCHOR={x:(o.x*0.5+0.5)*rt.domElement.width, y:(-o.y*0.5+0.5)*rt.domElement.height};
  let i=0; for(const it of items){ it.sc.rotation.y=(it.b.rot||0)*Math.PI/180; const spr=renderSprite(it.sc); bsprite[it.b.id]={spr, tint:tint(spr,idCol(i)), idx:i}; i++; }
  for(const [k,url] of Object.entries(EXTRAS)){ try{ const m=await load(url); prep(m,(k==='tree')?GS*2.2:GS*1.0); esprite[k]=renderSprite(m); }catch(e){} }

})();

let hovered=-1;
function poly(pts,color,stroke,lw=1){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath();
  if(color){ctx.fillStyle=color;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();} }
const tileRect=(gx,gy,w,d)=>[P(gx,gy),P(gx+w,gy),P(gx+w,gy+d),P(gx,gy+d)];
function ellipsePts(cx,cy,rx,ry,seg=44){ const a=[]; for(let i=0;i<seg;i++){ const t=i/seg*Math.PI*2; a.push(P(cx+rx*Math.cos(t), cy+ry*Math.sin(t))); } return a; }
function isoSeg(ax,ay,bx,by,col,lw){ const a=P(ax,ay),b=P(bx,by); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function strip(s){ const pts=s.along==='y'?[P(s.a,s.lo),P(s.b,s.lo),P(s.b,s.hi),P(s.a,s.hi)]:[P(s.lo,s.a),P(s.hi,s.a),P(s.hi,s.b),P(s.lo,s.b)];
  poly(pts, '#8e98a3', 'rgba(0,0,0,.07)', 1.5);
  const c=(s.a+s.b)/2; ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.setLineDash([7,9]);
  const p0=s.along==='y'?P(c,s.lo):P(s.lo,c), p1=s.along==='y'?P(c,s.hi):P(s.hi,c); ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); ctx.setLineDash([]); }
function football(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#57bd4a','rgba(0,0,0,.06)',1);
  for(let i=0;i<w;i+=1.5) if(((i/1.5)|0)%2) poly(tileRect(gx+i,gy,1.5,d),'#61c654',null);
  poly(tileRect(gx,gy,w,d),null,'rgba(255,255,255,.92)',2); isoSeg(gx+w/2,gy,gx+w/2,gy+d,'rgba(255,255,255,.92)',2);
  poly(ellipsePts(gx+w/2,gy+d/2,0.9,0.9),null,'rgba(255,255,255,.92)',2); }
function baseball(gx,gy,sz){ poly(tileRect(gx,gy,sz,sz),'#57bd4a','rgba(0,0,0,.06)',1); const d=sz*0.6;
  poly(tileRect(gx,gy,d,d),'#cf8a44','rgba(0,0,0,.08)',1); poly(tileRect(gx,gy,d,d),null,'rgba(255,255,255,.85)',1.5); }
function track(cx,cy,rx,ry){ poly(ellipsePts(cx,cy,rx,ry),'#c2543b','rgba(0,0,0,.1)',1.5);
  poly(ellipsePts(cx,cy,rx-0.3,ry-0.2),null,'rgba(255,255,255,.6)',1); poly(ellipsePts(cx,cy,rx-0.8,ry-0.55),'#5ec152',null); }
function parking(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#969ea8','rgba(0,0,0,.1)',1.5);
  for(let i=0.6;i<w;i+=1){ isoSeg(gx+i,gy+0.3,gx+i,gy+1.5,'rgba(255,255,255,.7)',1.3); isoSeg(gx+i,gy+d-1.5,gx+i,gy+d-0.3,'rgba(255,255,255,.7)',1.3); } }
// sân bóng rổ / đa môn — mặt sân xanh dương, vạch trắng + vòng tròn giữa + 2 khu phạt
function court(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#3f7bb0','rgba(0,0,0,.1)',1.5);
  poly(tileRect(gx+0.25,gy+0.25,w-0.5,d-0.5),null,'rgba(255,255,255,.85)',2);
  isoSeg(gx+w/2,gy+0.25,gx+w/2,gy+d-0.25,'rgba(255,255,255,.85)',2);
  poly(ellipsePts(gx+w/2,gy+d/2,0.7,0.7),null,'rgba(255,255,255,.85)',1.6);
  poly(tileRect(gx+0.25,gy+d/2-0.7,1.1,1.4),null,'rgba(255,255,255,.8)',1.4);
  poly(tileRect(gx+w-1.35,gy+d/2-0.7,1.1,1.4),null,'rgba(255,255,255,.8)',1.4); }
// sân chào cờ — sân lát sáng + kẻ ô + bục lễ + cột cờ (vẽ trong draw)
function plaza(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#cfc7b4','rgba(0,0,0,.08)',1.5);
  for(let i=1;i<w;i++) isoSeg(gx+i,gy,gx+i,gy+d,'rgba(255,255,255,.35)',1);
  for(let j=1;j<d;j++) isoSeg(gx,gy+j,gx+w,gy+j,'rgba(255,255,255,.35)',1);
  poly(tileRect(gx+w/2-0.7,gy+0.35,1.4,0.8),'#b23b3b','rgba(0,0,0,.12)',1.2); }   // bục lễ đỏ
// vườn trường — luống đất + hàng cây xanh
function garden(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#8a6a44','rgba(0,0,0,.12)',1.4);
  for(let j=0.35;j<d-0.3;j+=0.75){ poly(tileRect(gx+0.25,gy+j,w-0.5,0.42),'#4f9e46',null);
    poly(tileRect(gx+0.25,gy+j,w-0.5,0.42),null,'rgba(255,255,255,.18)',1); } }
// hồ nước — mặt nước xanh dương, lõi sáng + đốm phản chiếu
function pond(cx,cy,rx,ry){ poly(ellipsePts(cx,cy,rx,ry),'#4aa6d8','rgba(0,0,0,.12)',1.5);
  poly(ellipsePts(cx,cy,rx*0.72,ry*0.72),'#6fc6ec',null);
  poly(ellipsePts(cx-rx*0.26,cy-ry*0.22,rx*0.3,ry*0.18),'rgba(255,255,255,.45)',null); }
function drawField(f){ switch(f.type){
  case 'football': return football(f.gx,f.gy,f.w,f.d);
  case 'baseball': return baseball(f.gx,f.gy,f.sz);
  case 'track': return track(f.cx,f.cy,f.rx,f.ry);
  case 'parking': return parking(f.gx,f.gy,f.w,f.d);
  case 'court': return court(f.gx,f.gy,f.w,f.d);
  case 'plaza': return plaza(f.gx,f.gy,f.w,f.d);
  case 'garden': return garden(f.gx,f.gy,f.w,f.d);
  case 'pond': return pond(f.cx,f.cy,f.rx,f.ry);
} }
function flagpole(cx,cy){ const p=P(cx,cy); ctx.strokeStyle='#8a8f96'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y-46); ctx.stroke();
  ctx.fillStyle='#da251d'; ctx.beginPath(); ctx.moveTo(p.x,p.y-46); ctx.lineTo(p.x+22,p.y-40); ctx.lineTo(p.x,p.y-32); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffe017'; ctx.font='10px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',p.x+8,p.y-39); }
function ground(){
  const w=innerWidth, h=innerHeight;
  const ivx=(x,y)=>((x-ox)/TW + (y-oy)/TH), ivy=(x,y)=>((y-oy)/TH - (x-ox)/TW);
  let g0x=1/0,g1x=-1/0,g0y=1/0,g1y=-1/0;
  for(const [x,y] of [[0,0],[w,0],[0,h],[w,h]]){ const a=ivx(x,y),b=ivy(x,y); g0x=Math.min(g0x,a);g1x=Math.max(g1x,a);g0y=Math.min(g0y,b);g1y=Math.max(g1y,b); }
  g0x=Math.floor(g0x)-1; g1x=Math.ceil(g1x)+1; g0y=Math.floor(g0y)-1; g1y=Math.ceil(g1y)+1;
  for(let gx=g0x; gx<g1x; gx++) for(let gy=g0y; gy<g1y; gy++){
    const a=P(gx,gy),b=P(gx+1,gy),c=P(gx+1,gy+1),d=P(gx,gy+1);
    poly([a,b,c,d], ((gx+gy)&1)?GRASS[0]:GRASS[1], 'rgba(0,0,0,.03)',1); }
  for(const r of ROADS) strip(r);
  for(const p of PATHS){ const pts=[P(p.lo,p.a),P(p.hi,p.a),P(p.hi,p.b),P(p.lo,p.b)]; poly(pts,'#d9c8a2','rgba(0,0,0,.05)',1); }
  for(const f of FIELDS) drawField(f);
  for(const f of FIELDS) if(f.type==='plaza') flagpole(f.gx+f.w/2, f.gy+f.d-0.4);
}

  ground();
  const items=[];
  BUILDINGS.forEach((b,i)=>items.push({d:b.gx+b.gy, b, i, p:P(b.gx,b.gy)}));
  DECOR.forEach(o=>{ if(esprite[o.k]) items.push({d:o.gx+o.gy-0.05, deco:o, p:P(o.gx,o.gy)}); });
  items.sort((a,b)=>a.d-b.d);
  const pins=[];
  for(const it of items){
    if(it.deco){ blit(ctx, esprite[it.deco.k], it.p, DS*(it.deco.k==='tree'?0.92:0.8)); continue; }
    const sp=bsprite[it.b.id]; if(!sp) continue; const sc=DS*it.b.s; const hl=it.i===hovered;
    shadowAt(it.p, it.b.s);
    if(hl){ ctx.fillStyle='rgba(255,206,84,.5)'; ctx.beginPath(); ctx.ellipse(it.p.x,it.p.y,TW*0.5*it.b.s,TH*0.5*it.b.s,0,0,7); ctx.fill(); ctx.filter='brightness(1.13)'; }
    blit(ctx, sp.spr, it.p, sc); ctx.filter='none'; blit(hctx, sp.tint, it.p, sc);
    if(it.b.flag) flag(it.p, sc);
    pins.push({x:it.p.x, y:it.p.y-ANCHOR.y*sc+4, e:it.b.emoji, c:it.b.pin||'#c0392b'}); }
  for(const f of FACILITIES){ const p=P(f.gx,f.gy); pins.push({x:p.x, y:p.y, e:f.emoji, c:f.pin||'#c0392b'}); }
  for(const pn of pins) pinMarker(pn.x, pn.y, pn.e, pn.c);
}

// ====== Legend (bấm được) ======
const EMBED = params.get('embed')==='1' || window.parent!==window;
const toast=document.getElementById('toast'); let toastT;
// Mỗi toà nhà → KHÔNG GIAN trải nghiệm bên trong (space.html?b=id). Sân → game.
const TARGETS={};
BUILDINGS.forEach(b=>TARGETS[b.id]='/space.html?b='+b.id+'&domain='+_dom);
Object.entries(SPORT_TARGETS).forEach(([id,url])=>{ TARGETS[id]=url; });
function enter(item, idx){
  const t=TARGETS[item.id];
  if(t){ (window.top||window).location.href=t; return; }   // có trải nghiệm → mở luôn
  if(idx!=null){ hovered=idx; draw(); }
  toast.textContent=`Vào: ${item.emoji} ${item.name}`; toast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('show'),1600);
  if(EMBED) parent.postMessage({type:'campus-enter', id:item.id, name:item.name, emoji:item.emoji}, '*'); }
function buildLegend(){ const host=document.getElementById('legend-rows');
  const all=[...BUILDINGS.map((b,i)=>({...b,bi:i})), ...FACILITIES.map(f=>({...f,bi:null}))];
  host.innerHTML=all.map(o=>`<div class="lr" data-id="${o.id}"><span class="e">${o.emoji}</span><span>${o.name}</span></div>`).join('');
  host.querySelectorAll('.lr').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.id; const bi=BUILDINGS.findIndex(b=>b.id===id);
    if(bi>=0) enter(BUILDINGS[bi], bi); else { const f=FACILITIES.find(x=>x.id===id); if(f) enter(f,null); } }));
}

function resize(){ const w=innerWidth,h=innerHeight;
  canvas.width=w*DPR; canvas.height=h*DPR; canvas.style.width=w+'px'; canvas.style.height=h+'px';
  hit.width=w*DPR; hit.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); hctx.setTransform(DPR,0,0,DPR,0,0);
  ox=w/2 - 3*TW/2; oy=h*0.46 - (N*0.92)*TH/2; draw(); }
addEventListener('resize', resize); resize();
if(EMBED){ const bk=document.querySelector('.back'); if(bk) bk.style.display='none'; }

const tip=document.getElementById('tip');
canvas.addEventListener('pointermove', e=>{
  const px=hctx.getImageData(e.clientX*DPR,e.clientY*DPR,1,1).data;
  const id=(px[3]>10)? colId(px[0],px[1],px[2]) : -1;
  if(id!==hovered){ hovered=id; draw(); }
  if(id>=0){ const b=BUILDINGS[id]; tip.textContent=`${b.emoji} ${b.name}`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1; canvas.style.cursor='pointer'; }
  else { tip.style.opacity=0; canvas.style.cursor='default'; } });
canvas.addEventListener('click', ()=>{ if(hovered<0) return; enter(BUILDINGS[hovered], hovered); });
</script>
