<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🚦 Lý thuyết Lái xe — 600 câu · Tizia</title>
<meta name="description" content="Bộ 600 câu hỏi lý thuyết B1/B2 theo Bộ GTVT — chế độ luyện + thi thử, có câu liệt (điểm liệt phải trả lời đúng để qua)." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<meta name="theme-color" content="#dc2626" />
<style>
  :root { --bg:#1a1a2e; --card:rgba(255,255,255,.06); --red:#dc2626; --green:#10b981;
    --yellow:#fbbf24; --text:#e5edf7; --muted:#94a3b8; --border:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Inter',system-ui,sans-serif;
    background: linear-gradient(180deg,var(--bg),#16213e); color:var(--text); padding:18px;
    display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1 { margin:0; font-size: 22px; text-align:center; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .toolbar button { font-family:inherit; background:var(--card); color:var(--text);
    border:1px solid var(--border); padding:8px 16px; border-radius:9px; font-size:13px; cursor:pointer; }
  .toolbar button.active { background: var(--red); border-color: var(--red); font-weight:700; }
  .toolbar select { font-family:inherit; background:var(--card); color:var(--text); border:1px solid var(--border);
    padding:8px 12px; border-radius:9px; font-size:13px; cursor:pointer; max-width:min(92vw,420px); }
  .toolbar select option { background:#1a1a2e; color:var(--text); }
  .toolbar label { align-self:center; color:var(--muted); font-size:13px; }
  .empty { width:100%; max-width:760px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:34px 22px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7; }

  .qcard { width:100%; max-width:760px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:22px; }
  .qhead { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:13px; color: var(--muted); }
  .qhead .badge { background: rgba(220,38,38,.18); border:1px solid var(--red); color:#fca5a5;
    padding:3px 9px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:.4px; }
  .qhead .badge.normal { background: rgba(255,255,255,.06); border-color: var(--border); color: var(--muted); }
  .qtext { font-size:17px; line-height:1.55; margin-bottom:18px; font-weight:600; }
  .opts { display:grid; gap:10px; }
  .opt { display:flex; gap:12px; padding:14px 16px; background:rgba(0,0,0,.2); border:1px solid var(--border);
    border-radius:10px; cursor:pointer; transition:background .15s, border-color .15s; }
  .opt:hover { background:rgba(255,255,255,.04); border-color: rgba(255,255,255,.2); }
  .opt input { margin-top:3px; }
  .opt.correct { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.5); }
  .opt.wrong { background: rgba(220,38,38,.12); border-color: rgba(220,38,38,.5); }
  .feedback { margin-top:14px; padding:12px 16px; border-radius:9px; font-size:14px; line-height:1.55; display:none; }
  .feedback.show { display:block; }
  .feedback.right { background: rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:#6ee7b7; }
  .feedback.wrong { background: rgba(220,38,38,.1); border:1px solid rgba(220,38,38,.3); color:#fca5a5; }

  .nav { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; max-width:760px; width:100%; }
  .nav button { font-family:inherit; padding:10px 22px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); cursor:pointer; font-size:13.5px; font-weight:600; }
  .nav button.primary { background: var(--red); border:0; color:white; }

  .stats { display:flex; gap:18px; font-size:13px; color: var(--muted); max-width:760px; width:100%; justify-content:center; }
  .stats b { color: var(--text); font-size:15px; }

  .summary { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px; max-width:760px; width:100%; text-align:center; display:none; }
  .summary.show { display:block; }
  .summary .big { font-size: 56px; font-weight: 800; margin: 8px 0; }
  .summary .pass { color: var(--green); }
  .summary .fail { color: var(--red); }
</style>
</head>
<body>
<h1>🚦 Lý thuyết Lái xe B1/B2 — Luật giao thông đường bộ</h1>

<div class="toolbar">
  <button data-mode="learn" class="active">📖 Luyện tập</button>
  <button data-mode="exam">📝 Thi thử (25 câu / 22 phút)</button>
  <button data-mode="critical">⚠️ Chỉ câu liệt</button>
</div>

<div class="toolbar" id="catBar">
  <label for="catSelect">📂 Chủ đề:</label>
  <select id="catSelect">
    <option value="all">📚 Tất cả các câu</option>
    <option value="kn">📖 1. Khái niệm &amp; quy tắc lý thuyết</option>
    <option value="vh">🤝 2. Văn hoá &amp; đạo đức</option>
    <option value="kt">🛠️ 3. Kỹ thuật lái xe</option>
    <option value="ct">⚙️ 4. Cấu tạo &amp; sửa chữa</option>
    <option value="th">⚠️ 5. Tình huống giao thông</option>
    <option value="nv">🚚 6. Nghiệp vụ vận tải</option>
    <option value="critical">🔥 Câu điểm liệt</option>
  </select>
</div>

<div class="stats" id="stats">
  <span>Câu <b id="curIdx">1</b>/<b id="totalQ">—</b></span>
  <span>Đúng: <b id="rightCount">0</b></span>
  <span>Sai: <b id="wrongCount">0</b></span>
  <span id="timerBox" style="display:none">⏱ <b id="timer">22:00</b></span>
</div>

<div class="qcard" id="qcard">
  <div class="qhead">
    <span class="badge normal" id="topicBadge">Khái niệm</span>
    <span id="critBadge"></span>
  </div>
  <div class="qtext" id="qtext">…</div>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="empty" id="emptyMsg" style="display:none"></div>

<div class="nav">
  <button id="prevBtn">← Câu trước</button>
  <button class="primary" id="nextBtn">Câu sau →</button>
  <button id="endBtn" style="display:none">🏁 Nộp bài</button>
</div>

<div class="summary" id="summary">
  <h2 style="margin:0 0 4px;" id="sumTitle">Kết quả</h2>
  <div class="big" id="sumScore">—</div>
  <div id="sumDetail" style="color:var(--muted); line-height:1.6;"></div>
  <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
    <button onclick="location.reload()" style="font-family:inherit; padding:10px 22px; border-radius:10px; border:0; background:var(--red); color:white; font-weight:700; cursor:pointer;">Làm lại</button>
  </div>
</div>

<script type="module">
  // Bộ câu hỏi RÚT GỌN từ 600 câu lý thuyết B1/B2 (Bộ GTVT). Đại diện 6 chương,
  // có câu LIỆT (must-correct) để đúng tinh thần đề thi: thi thử 25 câu, sai 1
  // câu liệt = trượt dù tổng điểm đủ.
  const Q = await fetch('/api/content/driving-600', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : { items: [] }).then(j => j.items || []).catch(() => []);

  const el = id => document.getElementById(id);
  const STATE_KEY = 'tizia:driving-600:state';
  // Gộp 17 sub-category của bộ 244 câu → 6 nhóm chủ đề cho dropdown (yêu cầu SV #16).
  const GROUP = {
    'Khái niệm':'kn', 'Quy tắc giao thông':'kn', 'Tốc độ - khoảng cách':'kn',
    'Nồng độ cồn - chất cấm':'vh', 'Trách nhiệm khi tai nạn':'vh', 'Đạo đức nghề nghiệp':'vh', 'Văn hoá giao thông':'vh',
    'Khởi hành - dừng xe':'kt', 'Số - côn - phanh':'kt', 'Lái xe đường đặc biệt':'kt',
    'Động cơ - hệ thống':'ct', 'Hệ thống an toàn':'ct', 'Bảo dưỡng - kiểm tra':'ct',
    'Xử lý tình huống':'th',
    'Kinh doanh vận tải':'nv', 'Hàng hoá - hành khách':'nv', 'Quyền - nghĩa vụ':'nv',
  };
  const groupOf = t => GROUP[t] || 'kn';
  let mode = 'learn', list = [...Q], idx = 0, category = 'all';
  let answered = {}, exam = null;

  function pickQuestions(m) {
    if (m === 'critical') return Q.filter(q => q.c);
    if (m === 'exam') {
      const crit = Q.filter(q => q.c);
      const norm = Q.filter(q => !q.c);
      const pickN = (arr, n) => arr.sort(() => Math.random() - .5).slice(0, n);
      const exam = [...pickN(crit, Math.min(3, crit.length)), ...pickN(norm, Math.max(0, 25 - Math.min(3, crit.length)))];
      return exam.sort(() => Math.random() - .5);
    }
    // learn: lọc theo nhóm chủ đề đang chọn ở dropdown
    if (category === 'all') return [...Q];
    if (category === 'critical') return Q.filter(q => q.c);
    return Q.filter(q => groupOf(q.t) === category);
  }

  function setMode(m) {
    mode = m;
    list = pickQuestions(m);
    idx = 0; answered = {};
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    el('catBar').style.display = m === 'exam' ? 'none' : '';
    el('summary').classList.remove('show');
    el('endBtn').style.display = m === 'exam' ? '' : 'none';
    if (!list.length) {
      el('emptyMsg').style.display = '';
      el('emptyMsg').innerHTML = '📭 Mục «' + (el('catSelect').selectedOptions[0]?.textContent.trim() || category) + '» hiện chưa có câu hỏi.';
      el('qcard').style.display = 'none';
      document.querySelector('.nav').style.display = 'none';
      el('stats').style.display = 'none';
      return;
    }
    el('emptyMsg').style.display = 'none';
    el('qcard').style.display = '';
    document.querySelector('.nav').style.display = '';
    el('stats').style.display = '';
    if (m === 'exam') {
      exam = { start: Date.now(), duration: 22 * 60 * 1000 };
      el('timerBox').style.display = '';
      tickTimer();
    } else {
      exam = null;
      el('timerBox').style.display = 'none';
    }
    render();
  }
  function tickTimer() {
    if (!exam) return;
    const remain = exam.duration - (Date.now() - exam.start);
    if (remain <= 0) { submitExam(); return; }
    const m = String(Math.floor(remain / 60000)).padStart(2, '0');
    const s = String(Math.floor((remain % 60000) / 1000)).padStart(2, '0');
    el('timer').textContent = `${m}:${s}`;
    setTimeout(tickTimer, 1000);
  }
  function submitExam() {
    let right = 0, critWrong = 0;
    for (const [i, ans] of Object.entries(answered)) {
      const q = list[i];
      if (ans === q.a) right++;
      else if (q.c) critWrong++;
    }
    const total = list.length;
    const pct = Math.round(right / total * 100);
    const passByScore = right >= 21;  // B1: 21/25
    const pass = passByScore && critWrong === 0;
    el('summary').classList.add('show');
    el('qcard').style.display = 'none';
    document.querySelector('.nav').style.display = 'none';
    el('stats').style.display = 'none';
    el('sumTitle').textContent = pass ? '🎉 ĐẠT' : '❌ TRƯỢT';
    el('sumScore').textContent = `${right}/${total}`;
    el('sumScore').className = 'big ' + (pass ? 'pass' : 'fail');
    el('sumDetail').innerHTML = `
      Đúng: <b>${right}</b> · Sai: <b>${total - right}</b><br>
      Câu liệt sai: <b style="color:${critWrong ? 'var(--red)' : 'var(--green)'}">${critWrong}</b><br>
      ${!passByScore ? '<span style="color:var(--red)">→ Chưa đủ 21/25 câu</span><br>' : ''}
      ${critWrong > 0 ? '<span style="color:var(--red)">→ Sai câu LIỆT — tự động trượt</span>' : ''}
    `;
    exam = null;
  }

  function render() {
    if (!list[idx]) return;
    const q = list[idx];
    el('curIdx').textContent = idx + 1;
    el('totalQ').textContent = list.length;
    el('topicBadge').textContent = q.t;
    el('topicBadge').className = 'badge normal';
    el('critBadge').innerHTML = q.c ? '<span class="badge">⚠️ CÂU LIỆT</span>' : '';
    el('qtext').textContent = q.q;
    el('opts').innerHTML = q.o.map((opt, i) => `
      <label class="opt" data-idx="${i}">
        <input type="radio" name="ans" value="${i}" ${answered[idx] === i ? 'checked' : ''} />
        <span>${opt}</span>
      </label>`).join('');
    if (answered[idx] !== undefined && mode !== 'exam') showFeedback();
    else el('feedback').classList.remove('show');
    updateStats();

    document.querySelectorAll('.opt input').forEach(inp => {
      inp.addEventListener('change', () => {
        answered[idx] = +inp.value;
        if (mode !== 'exam') showFeedback();
        updateStats();
      });
    });
  }
  function showFeedback() {
    const q = list[idx];
    const ans = answered[idx];
    const isRight = ans === q.a;
    document.querySelectorAll('.opt').forEach((opt, i) => {
      opt.classList.remove('correct', 'wrong');
      if (i === q.a) opt.classList.add('correct');
      else if (i === ans) opt.classList.add('wrong');
    });
    const fb = el('feedback');
    fb.classList.add('show');
    fb.className = 'feedback show ' + (isRight ? 'right' : 'wrong');
    fb.textContent = (isRight ? '✅ Đúng. ' : '❌ Sai. ') + q.ex;
  }
  function updateStats() {
    let r = 0, w = 0;
    for (const [i, ans] of Object.entries(answered)) {
      if (ans === list[i].a) r++; else w++;
    }
    el('rightCount').textContent = r;
    el('wrongCount').textContent = w;
  }

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { if (b.dataset.mode !== 'learn') { el('catSelect').value = 'all'; category = 'all'; } setMode(b.dataset.mode); });
  el('catSelect').onchange = () => {
    category = el('catSelect').value;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === 'learn'));
    setMode('learn');
  };
  el('nextBtn').onclick = () => { if (idx < list.length - 1) { idx++; render(); } };
  el('prevBtn').onclick = () => { if (idx > 0) { idx--; render(); } };
  el('endBtn').onclick = submitExam;

  // Mở thẳng chế độ qua URL: ?mode=exam | ?mode=critical
  const _m = new URLSearchParams(location.search).get('mode');
  setMode(['exam', 'critical'].includes(_m) ? _m : 'learn');
</script>
</body>
</html>
