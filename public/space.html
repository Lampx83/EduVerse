<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Không gian · Trường Dược · EduVerse</title>
<style>
  :root { --bg-1:#0f172a; --bg-2:#1e293b; --bg-3:#312e81; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter',system-ui,sans-serif; color:#fff;
    background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(139,92,246,.22), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2) 60%,var(--bg-3)); }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 20px 70px; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .back { color:#fff; text-decoration:none; opacity:.85; font-size:14px; background:rgba(255,255,255,.08); padding:8px 13px; border-radius:10px; }
  .back:hover { opacity:1; background:rgba(255,255,255,.15); }
  .banner { position:relative; overflow:hidden; border-radius:20px; padding:26px 28px; margin-bottom:22px;
    border:1px solid var(--border); }
  .banner .ic { font-size:64px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  .banner h1 { margin:6px 0 6px; font-size:30px; font-weight:800; }
  .banner p { margin:0; opacity:.9; max-width:760px; line-height:1.55; }
  .sec-title { font-size:13px; letter-spacing:1px; text-transform:uppercase; opacity:.65; font-weight:800; margin:24px 0 12px; }
  .rooms { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  .room { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 17px; cursor:pointer;
    transition:transform .15s,background .15s,border-color .15s; text-decoration:none; color:#fff; display:flex; flex-direction:column; gap:6px; }
  .room:hover { transform:translateY(-3px); background:rgba(255,255,255,.12); border-color:var(--accent); }
  .room .ri { font-size:30px; }
  .room h3 { margin:2px 0 0; font-size:16px; }
  .room .rd { font-size:12.5px; opacity:.8; line-height:1.5; }
  .room .tag { align-self:flex-start; margin-top:6px; font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:8px; background:var(--accent); color:#1f1147; }
  .room .tag.soon { background:#6b7280; color:#fff; }
  .skills { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:rgba(255,255,255,.1); border:1px solid var(--border); padding:6px 12px; border-radius:20px; font-size:12.5px; }
  .chip b { color:var(--accent); }
  /* quiz */
  .quiz { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-top:12px; }
  .q { margin:0 0 14px; }
  .q .qt { font-weight:700; margin-bottom:8px; font-size:14.5px; }
  .q .opt { display:block; width:100%; text-align:left; background:rgba(255,255,255,.05); border:1px solid var(--border); color:#fff;
    padding:9px 13px; border-radius:10px; margin:6px 0; cursor:pointer; font-family:inherit; font-size:13.5px; transition:background .12s; }
  .q .opt:hover { background:rgba(255,255,255,.12); }
  .q .opt.correct { background:rgba(16,185,129,.35); border-color:#10b981; }
  .q .opt.wrong { background:rgba(239,68,68,.3); border-color:#ef4444; }
  .quiz .submit { margin-top:6px; padding:11px 20px; border:none; border-radius:11px; background:var(--accent); color:#1f1147; font-weight:800; font-size:14px; cursor:pointer; }
  .quiz .submit:hover { filter:brightness(1.08); }
  .result { margin-top:14px; padding:14px 16px; border-radius:12px; background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.4); display:none; }
  .result.show { display:block; }
  .result b { color:#34d399; }
  #toast { position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px); background:#1e293b; border:1px solid var(--border); color:#fff; padding:12px 18px; border-radius:12px; max-width:520px; opacity:0; transition:opacity .2s,transform .2s; z-index:30; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  /* modal (room detail) */
  .modal { position:fixed; inset:0; background:rgba(8,11,22,.66); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal.show { display:flex; }
  .modal-card { background:linear-gradient(180deg,#1b2438,#141c2e); border:1px solid var(--border); border-radius:18px; width:100%; max-width:640px; max-height:86vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.5); animation:pop .18s ease; }
  @keyframes pop { from{transform:scale(.96);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-head { display:flex; align-items:center; gap:12px; padding:18px 20px 14px; border-bottom:1px solid var(--border); }
  .modal-head .mh-ic { font-size:30px; }
  .modal-head h3 { margin:0; font-size:19px; flex:1; }
  .modal-x { background:rgba(255,255,255,.08); border:none; color:#fff; width:34px; height:34px; border-radius:9px; font-size:16px; cursor:pointer; }
  .modal-x:hover { background:rgba(255,255,255,.18); }
  .modal-body { padding:18px 20px 22px; overflow:auto; line-height:1.6; }
  .modal-body h4 { margin:18px 0 8px; font-size:15px; color:var(--accent); }
  .modal-body h4:first-child { margin-top:0; }
  .modal-body p { margin:0 0 10px; opacity:.92; font-size:14px; }
  .modal-body ul, .modal-body ol { margin:0 0 12px; padding-left:20px; }
  .modal-body li { margin:5px 0; font-size:14px; opacity:.92; }
  .mb-note { background:rgba(251,191,36,.12); border-left:3px solid var(--accent); padding:10px 14px; border-radius:8px; margin:4px 0 14px; font-size:13.5px; }
  .mb-cards { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); margin:4px 0 14px; }
  .mb-card { background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .mb-card .ci { font-size:24px; } .mb-card .ct { font-weight:700; font-size:13.5px; margin:4px 0 2px; } .mb-card .cd { font-size:12.5px; opacity:.82; }
  .timeline { list-style:none; padding:0; margin:4px 0 8px; }
  .timeline li { position:relative; padding:0 0 16px 26px; border-left:2px solid rgba(255,255,255,.18); }
  .timeline li:last-child { border-left-color:transparent; padding-bottom:0; }
  .timeline li::before { content:''; position:absolute; left:-7px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .timeline .tl-t { font-weight:700; font-size:14px; } .timeline .tl-d { font-size:13px; opacity:.85; margin-top:2px; }
  /* flashcards */
  .flash-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); margin:4px 0 6px; }
  .flash { perspective:900px; height:128px; cursor:pointer; }
  .flash-inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flash.flipped .flash-inner { transform:rotateY(180deg); }
  .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px; }
  .flash-front { background:rgba(255,255,255,.06); }
  .flash-front .fe { font-size:34px; } .flash-front .fn { font-weight:700; margin-top:6px; }
  .flash-back { background:linear-gradient(160deg,var(--accent),rgba(255,255,255,.08)); color:#1f1147; transform:rotateY(180deg); font-size:13px; font-weight:600; }
  .flash-hint { font-size:12px; opacity:.6; text-align:center; margin-top:8px; }
  /* checklist */
  .checklist { list-style:none; padding:0; margin:4px 0 6px; }
  .checklist li { margin:0 0 8px; }
  .checklist label { display:flex; align-items:flex-start; gap:10px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:10px; padding:11px 13px; cursor:pointer; font-size:13.5px; }
  .checklist label:hover { background:rgba(255,255,255,.1); }
  .checklist input { margin-top:2px; width:17px; height:17px; accent-color:var(--accent); flex-shrink:0; }
  .checklist label.done { background:rgba(16,185,129,.15); border-color:rgba(16,185,129,.45); }
  .ck-prog { font-size:13px; font-weight:700; margin-top:6px; }
  .ck-prog.full { color:#34d399; }
  /* goal setter */
  .goal-in { display:flex; gap:8px; margin:6px 0 4px; }
  .goal-in input { flex:1; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:10px; color:#fff; padding:10px 13px; font-family:inherit; font-size:14px; }
  .goal-in button { background:var(--accent); border:none; color:#1f1147; font-weight:800; padding:0 16px; border-radius:10px; cursor:pointer; }
  .goal-saved { background:rgba(16,185,129,.14); border:1px solid rgba(16,185,129,.4); border-radius:10px; padding:11px 14px; margin-top:8px; font-size:13.5px; display:none; }
  .goal-saved.show { display:block; }
  /* inline decision MCQ (case "bạn sẽ làm gì?") */
  .mcq { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin:4px 0 12px; }
  .mcq .mcq-q { font-weight:700; font-size:14px; margin-bottom:9px; }
  .mcq .mcq-o { display:block; width:100%; text-align:left; background:rgba(255,255,255,.05); border:1px solid var(--border); color:#fff; padding:9px 13px; border-radius:9px; margin:6px 0; cursor:pointer; font-family:inherit; font-size:13.5px; transition:background .12s; }
  .mcq .mcq-o:hover { background:rgba(255,255,255,.12); }
  .mcq .mcq-o.correct { background:rgba(16,185,129,.32); border-color:#10b981; }
  .mcq .mcq-o.wrong { background:rgba(239,68,68,.28); border-color:#ef4444; }
  .mcq .mcq-fb { font-size:13px; margin-top:8px; padding:10px 13px; border-radius:9px; background:rgba(251,191,36,.12); border-left:3px solid var(--accent); display:none; }
  .mcq .mcq-fb.show { display:block; }
</style>
</head>

const SPACE_SETS = { pharmacy: SPACES_PHARMACY, secondary: SPACES_SECONDARY };
const DOMAIN_TITLES = { pharmacy: 'Trường Dược', secondary: 'Trường THCS' };

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),4200); }

const params=new URLSearchParams(location.search);
const id=params.get('b')||'admin';
const dom=params.get('domain')||'pharmacy';
const SPACES=SPACE_SETS[dom]||SPACES_PHARMACY;
const S=SPACES[id]||SPACES[Object.keys(SPACES)[0]];
document.title=`${S.emoji} ${S.name} · ${DOMAIN_TITLES[dom]||'EduVerse'}`;

const wrap=document.getElementById('wrap');
const roomCard=(r,idx)=> r.href
  ? `<a class="room" href="${r.href}"><div class="ri">${r.ic}</div><h3>${r.name}</h3><div class="rd">${r.rd}</div><span class="tag">Vào trải nghiệm →</span></a>`
  : `<div class="room" data-room="${idx}"><div class="ri">${r.ic}</div><h3>${r.name}</h3><div class="rd">${r.rd}</div><span class="tag soon">Khám phá →</span></div>`;

wrap.style.setProperty('--accent', S.accent);
wrap.innerHTML = `
  <div class="top"><a class="back" href="/school.html?domain=${dom}#campus-hero">← Khuôn viên trường</a></div>
  <div class="banner" style="background:linear-gradient(120deg, ${S.accent}33, rgba(255,255,255,.04));--accent:${S.accent}">
    <div class="ic">${S.emoji}</div><h1>${S.name}</h1><p>${S.intro}</p>
  </div>
  <div class="sec-title">🚪 Không gian & hoạt động</div>
  <div class="rooms">${S.rooms.map(roomCard).join('')}</div>
  <div class="sec-title">🎯 Kỹ năng đạt được tại đây</div>
  <div class="skills">${S.skills.map(s=>`<span class="chip">✔️ ${s}</span>`).join('')}</div>
  <div class="sec-title">🧠 Củng cố kiến thức</div>
  <div class="quiz" id="quiz"></div>
`;
document.documentElement.style.setProperty('--accent', S.accent);
[...document.querySelectorAll('.room[data-room]')].forEach(el=>el.addEventListener('click',()=>openRoom(S.rooms[+el.dataset.room])));

// ---- room detail modal ----
const modal=document.getElementById('modal');
const mClose=()=>modal.classList.remove('show');
document.getElementById('m-x').addEventListener('click',mClose);
modal.addEventListener('click',e=>{ if(e.target===modal) mClose(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') mClose(); });
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(typeof b==='string') return `<p>${esc(b)}</p>`;
    if(b.h) return `<h4>${esc(b.h)}</h4>`;
    if(b.p) return `<p>${esc(b.p)}</p>`;
    if(b.note) return `<div class="mb-note">${esc(b.note)}</div>`;
    if(b.ul) return `<ul>${b.ul.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(b.ol) return `<ol>${b.ol.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
    if(b.cards) return `<div class="mb-cards">${b.cards.map(c=>`<div class="mb-card"><div class="ci">${c.ic||''}</div><div class="ct">${esc(c.t)}</div><div class="cd">${esc(c.d)}</div></div>`).join('')}</div>`;
    if(b.timeline) return `<ul class="timeline">${b.timeline.map(t=>`<li><div class="tl-t">${esc(t.t)}</div><div class="tl-d">${esc(t.d)}</div></li>`).join('')}</ul>`;
    if(b.flash) return `<div class="flash-grid">${b.flash.map(f=>`<div class="flash"><div class="flash-inner"><div class="flash-face flash-front"><div class="fe">${f.e||''}</div><div class="fn">${esc(f.f)}</div></div><div class="flash-face flash-back">${esc(f.b)}</div></div></div>`).join('')}</div><div class="flash-hint">Bấm vào thẻ để lật xem đáp án</div>`;
    if(b.check) return `<ul class="checklist">${b.check.map((x,i)=>`<li><label><input type="checkbox" data-ck="${i}"> <span>${esc(x)}</span></label></li>`).join('')}</ul><div class="ck-prog">0/${b.check.length} hoàn thành</div>`;
    if(b.goal) return `<div class="goal-in"><input id="goal-input" placeholder="VD: Hoàn thành 3 module bào chế tuần này" /><button id="goal-save">Lưu</button></div><div class="goal-saved" id="goal-saved"></div>`;
    if(b.mcq) return b.mcq.map(m=>`<div class="mcq" data-a="${m.a}"><div class="mcq-q">${esc(m.q)}</div>${m.o.map((o,j)=>`<button class="mcq-o" data-i="${j}">${esc(o)}</button>`).join('')}<div class="mcq-fb">${esc(m.fb||'')}</div></div>`).join('');
    return '';
  }).join('');
}
function openRoom(r){
  if(!r) return;
  document.getElementById('m-ic').textContent=r.ic||'📌';
  document.getElementById('m-title').textContent=r.name||'';
  const body=document.getElementById('m-body');
  body.innerHTML = renderBlocks(r.panel || [r.content || 'Nội dung đang được biên soạn.']);
  body.querySelectorAll('.flash').forEach(f=>f.addEventListener('click',()=>f.classList.toggle('flipped')));
  body.querySelectorAll('.mcq').forEach(mc=>{ const a=+mc.dataset.a; mc.querySelectorAll('.mcq-o').forEach(o=>o.addEventListener('click',()=>{ if(mc.dataset.done) return; mc.dataset.done='1'; const pick=+o.dataset.i; mc.querySelectorAll('.mcq-o').forEach(x=>{ const xi=+x.dataset.i; if(xi===a) x.classList.add('correct'); else if(xi===pick) x.classList.add('wrong'); }); const fb=mc.querySelector('.mcq-fb'); if(fb&&fb.textContent.trim()) fb.classList.add('show'); })); });
  const prog=body.querySelector('.ck-prog');
  if(prog){ const boxes=[...body.querySelectorAll('input[data-ck]')];
    const upd=()=>{ const n=boxes.filter(b=>b.checked).length; prog.textContent=`${n}/${boxes.length} hoàn thành`;
      prog.classList.toggle('full',n===boxes.length); boxes.forEach(b=>b.closest('label').classList.toggle('done',b.checked)); };
    boxes.forEach(b=>b.addEventListener('change',upd)); }
  const gIn=body.querySelector('#goal-input');
  if(gIn){ const gKey='eduverse:goal:'+dom, saved=body.querySelector('#goal-saved');
    const show=v=>{ if(v){ saved.textContent='🎯 Mục tiêu hiện tại: '+v; saved.classList.add('show'); } };
    try{ show(localStorage.getItem(gKey)||''); }catch(e){}
    body.querySelector('#goal-save').addEventListener('click',()=>{ const v=gIn.value.trim(); if(!v) return;
      try{ localStorage.setItem(gKey,v); }catch(e){} show(v); gIn.value=''; toast('Đã lưu mục tiêu!'); }); }
  modal.classList.add('show'); body.scrollTop=0;
}

// quiz
const quizEl=document.getElementById('quiz');
quizEl.innerHTML = S.quiz.map((q,i)=>`<div class="q" data-i="${i}"><div class="qt">${i+1}. ${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${o}</button>`).join('')}</div>`).join('')
  + `<button class="submit" id="qs">Nộp & xem kết quả</button><div class="result" id="qr"></div>`;
const picked={};
quizEl.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
  const qi=+b.dataset.q; picked[qi]=+b.dataset.o;
  quizEl.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x=>x.style.outline='none');
  b.style.outline='2px solid '+S.accent; }));
document.getElementById('qs').addEventListener('click',()=>{
  let correct=0;
  S.quiz.forEach((q,i)=>{ quizEl.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{ const o=+b.dataset.o;
    b.classList.remove('correct','wrong'); if(o===q.a) b.classList.add('correct'); else if(picked[i]===o) b.classList.add('wrong'); });
    if(picked[i]===q.a) correct++; });
  const r=document.getElementById('qr'); r.classList.add('show');
  r.innerHTML = `Bạn đúng <b>${correct}/${S.quiz.length}</b> câu. ${correct===S.quiz.length?'Xuất sắc! ':''}Kỹ năng được củng cố: <b>${S.skills.join(' · ')}</b>.`;
  try{ const k='eduverse:space:done'; const d=JSON.parse(localStorage.getItem(k)||'{}'); d[id]=Math.max(d[id]||0, correct); localStorage.setItem(k, JSON.stringify(d)); }catch(e){}
});
</script>
</body>
</html>
