<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trường · EduVerse</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 28px 20px 60px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.22), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.16), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  .section { max-width: 1200px; margin: 0 auto 28px; }
  .section-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .section-title h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .section-title .hint { opacity: 0.6; font-size: 13px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; max-width: 1200px;
    margin: 0 auto 18px; opacity: 0.8; text-decoration: none; color: white; font-size: 14px;
    width: 100%;
  }
  .back:hover { opacity: 1; }
</style>
</head>
<body>

<script>
// Banner nếu không phải secure context (LAN HTTP) — webcam modes won't work
if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  document.write(`
    <div style="max-width:1100px;margin:0 auto 18px;background:rgba(251,191,36,0.15);border:1px solid #fbbf24;color:#fde68a;padding:10px 16px;border-radius:10px;font-size:13px;line-height:1.5">
      ⚠️ <b>Đang truy cập qua HTTP IP LAN</b> (${location.host}). Chrome chặn webcam ngoài HTTPS/localhost — các mode webcam tự chuyển sang chuột/touch.
    </div>
  `);
}
</script>

<script type="module">
  import { migrateAllKnown } from './js/engine/storage.js';
  migrateAllKnown();
</script>

<a class="back" href="index.html">← Trang chủ EduVerse · chọn trường khác</a>

<!-- ============ LỘ TRÌNH HỌC TẬP — SUBWAY MAP ============ -->
<div class="section" id="campus">
  <div class="section-title">
    <h2 id="path-title">🗺️ Lộ trình học tập</h2>
    <span class="hint">Click node để vào module · badge 📚🥽🕹️📱🌐 = phiên bản trải nghiệm · 🔒 = chưa có nội dung / chưa mở khoá</span>
  </div>
  <div id="wallet-host"></div>
  <div id="quests-host" style="margin:0 0 16px"></div>
  <div id="path-host">Đang dựng lộ trình…</div>
</div>

<!-- ============ BAN ĐIỀU HÀNH AI — nhận yêu cầu SV ============ -->
<div class="section" id="board">
  <div id="request-board-host"></div>
</div>

<footer style="max-width:1100px;margin:36px auto 0;opacity:0.6;font-size:12px;text-align:center;line-height:1.7">
  EduVerse · Vũ trụ giáo dục · backend Node.js + Express + SQLite + WebSocket ·
  <a href="index.html" style="color:var(--accent)">← Quay lại chọn trường</a>
</footer>

<!-- Load domain + render path (curriculum + các cụm thực hành/kỹ năng/…) -->
<script type="module">
  import { CATEGORIES } from './js/engine/learning-path.js';
  import { loadActiveDomain, getActiveDomainId, isDomainOpen } from './js/engine/domain.js';
  import { renderPath, renderWalletPills, renderDailyQuests, showAchievementToast } from './js/engine/path-renderer.js';
  import { onLogin, getProgress, checkAchievements, getDailyQuests, streakAtRisk } from './js/engine/wallet.js';
  import { primeModulesCache, ALL_SCENARIOS } from './js/scenarios/index.js';
  import { renderRequestBoard } from './js/request-board.js';

  // Trường đang khoá / không tồn tại → quay về trang chọn trường
  const requested = new URLSearchParams(location.search).get('domain');
  if (requested && !isDomainOpen(requested)) location.replace('index.html');

  const dom = await loadActiveDomain();
  const { MODULES, SUBJECTS, ACHIEVEMENTS, DOMAIN } = dom;

  document.title = `${DOMAIN.icon} ${DOMAIN.name} · EduVerse`;
  document.getElementById('path-title').innerHTML = `🗺️ Lộ trình · ${DOMAIN.icon} ${DOMAIN.name}`;

  primeModulesCache(MODULES);

  // "Có nội dung" = có experiences[] HOẶC có scenario thật (id khớp / prefix module-)
  const scenarioIds = new Set(Object.values(ALL_SCENARIOS).map(s => s?.id).filter(Boolean));
  const hasContent = (m) => {
    if ((m.experiences || []).length > 0) return true;
    for (const sid of (m.scenarioIds || [])) if (scenarioIds.has(sid)) return true;
    for (const sid of scenarioIds) if (sid.startsWith(m.id + '-')) return true;
    return false;
  };
  const contentSet = new Set(MODULES.filter(hasContent).map(m => m.id));

  const progress = getProgress();

  // Gate DUY NHẤT = có nội dung. Module nào có content → bấm được;
  // không có → khoá. Prereq chỉ còn là đường nối trực quan (không chặn).
  renderPath({
    host: document.getElementById('path-host'),
    modules: MODULES, subjects: SUBJECTS, domain: DOMAIN, categories: CATEGORIES,
    progress, locked: new Map(), contentSet,
  });

  const loginEvent = onLogin();
  renderWalletPills(document.getElementById('wallet-host'), {
    wallet: loginEvent.wallet, progress, modules: MODULES, atRisk: streakAtRisk(),
  });
  renderDailyQuests(document.getElementById('quests-host'), getDailyQuests());

  const newly = checkAchievements(progress, loginEvent.wallet, ACHIEVEMENTS);
  let delay = 600;
  for (const a of newly) { setTimeout(() => showAchievementToast(a), delay); delay += 1200; }
  if (loginEvent.milestone) {
    setTimeout(() => showAchievementToast({
      icon: '🔥', title: `Chuỗi ${loginEvent.milestone.streak} ngày!`,
      desc: `+${loginEvent.milestone.coin} coin · +${loginEvent.milestone.xp} XP${loginEvent.milestone.shield ? ' · 🛡️ +1 khiên streak' : ''}`,
    }), delay);
  }

  // Ban điều hành AI — nhận yêu cầu cải tiến trường từ SV
  renderRequestBoard({
    host: document.getElementById('request-board-host'),
    domain: getActiveDomainId(),
    domainName: DOMAIN.name,
  });
</script>

</body>
</html>
