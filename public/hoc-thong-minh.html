<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🧠 Học thông minh · Tizia</title>
<meta name="description" content="Học theo lộ trình AI — Tizia chọn câu hỏi phù hợp độ khó cho em (adaptive IRT) + đề xuất kỹ năng kế tiếp dựa trên knowledge graph." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 10% 0%, rgba(167,139,250,.12), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(96,165,250,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:920px; margin:0 auto; padding:24px 18px 80px; }

  .level-card { background:linear-gradient(135deg, rgba(167,139,250,.20), rgba(96,165,250,.10));
    border:1px solid rgba(167,139,250,.35); border-radius:18px;
    padding:22px 24px; margin-bottom:22px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .level-card .badge { width:84px; height:84px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #a78bfa, #6366f1);
    display:flex; align-items:center; justify-content:center;
    font-size:36px; box-shadow:0 8px 24px rgba(99,102,241,.4); flex-shrink:0; }
  .level-card .info { flex:1; min-width:200px; }
  .level-card .lbl { font-size:11px; letter-spacing:1.2px; color:var(--text-soft); font-weight:700; text-transform:uppercase; }
  .level-card .nm { font-size:24px; font-weight:800; margin:4px 0; color:var(--purple); }
  .level-card .meta { font-size:13px; color:var(--text-soft); }
  .level-card .meta b { color:var(--accent); }
  .theta-bar { margin-top:8px; height:8px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden; position:relative; }
  .theta-bar > i { display:block; height:100%; background:linear-gradient(90deg, var(--bad), var(--accent), var(--good)); transition:width .5s; }
  .theta-bar .marker { position:absolute; top:-4px; width:3px; height:16px; background:#fff; border-radius:2px; transform:translateX(-50%); transition:left .5s; }

  .section-title { font-size:16px; font-weight:800; margin:22px 0 12px;
    display:flex; align-items:center; gap:8px; }
  .section-title .ic { font-size:20px; }

  .recommend-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
  .skill-rec { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; transition:transform .15s, border-color .15s; }
  .skill-rec:hover { transform:translateY(-2px); border-color:var(--purple); }
  .skill-rec .name { font-weight:700; font-size:14px; line-height:1.4; margin-bottom:6px; }
  .skill-rec .comp { font-size:11.5px; color:var(--text-soft); }
  .skill-rec .grade { display:inline-block; padding:2px 8px; border-radius:999px;
    background:rgba(251,191,36,.12); color:var(--accent); font-size:11px; font-weight:700;
    margin-top:8px; }
  .skill-rec .prereq-mini { margin-top:8px; height:4px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; }
  .skill-rec .prereq-mini > i { display:block; height:100%; background:var(--purple); transition:width .4s; }
  .skill-rec .prereq-lbl { font-size:10.5px; color:var(--text-soft); margin-top:3px; }

  .quiz-card { background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:22px 24px; margin-bottom:18px; }
  .quiz-card .meta { display:flex; gap:14px; font-size:11.5px; color:var(--text-soft); margin-bottom:10px; }
  .quiz-card .meta b { color:var(--accent); }
  .quiz-card .q-text { font-size:16px; font-weight:600; line-height:1.55; margin:8px 0 18px; }
  .quiz-card .opt { display:block; padding:12px 16px; margin:6px 0;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10);
    border-radius:12px; cursor:pointer; font-size:14px;
    transition:background .12s, border-color .12s, transform .08s; }
  .quiz-card .opt:hover { background:rgba(167,139,250,.10); border-color:rgba(167,139,250,.4); }
  .quiz-card .opt.selected { background:rgba(167,139,250,.18); border-color:var(--purple); }
  .quiz-card .opt.correct { background:rgba(34,197,94,.18); border-color:var(--good); }
  .quiz-card .opt.wrong { background:rgba(239,68,68,.14); border-color:var(--bad); }
  .quiz-card .actions { display:flex; gap:10px; margin-top:14px; }
  .quiz-card button { padding:10px 22px; border-radius:12px; font:700 14px 'Inter', sans-serif;
    cursor:pointer; border:none; transition:transform .12s; }
  .quiz-card button.primary { background:linear-gradient(135deg, var(--purple), #6366f1); color:#fff; }
  .quiz-card button.primary:hover:not(:disabled) { transform:scale(1.04); }
  .quiz-card button.primary:disabled { opacity:.5; cursor:not-allowed; }
  .quiz-card button.skip { background:rgba(255,255,255,.08); color:var(--text); }
  .quiz-card .feedback { padding:10px 14px; border-radius:10px; margin-top:14px; font-size:13.5px; line-height:1.5; }
  .quiz-card .feedback.ok { background:rgba(34,197,94,.12); border-left:3px solid var(--good); color:#86efac; }
  .quiz-card .feedback.bad { background:rgba(239,68,68,.10); border-left:3px solid var(--bad); color:#fda4af; }

  .subject-picker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .subject-picker .s { padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    font-size:13px; cursor:pointer; transition:background .12s; }
  .subject-picker .s:hover { background:rgba(255,255,255,.10); }
  .subject-picker .s.cur { background:var(--purple); color:#fff; border-color:var(--purple); font-weight:700; }

  .empty { text-align:center; padding:30px; color:var(--text-soft); }
  .loading { text-align:center; padding:40px; color:var(--text-soft); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🧠 Học thông minh</h1>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Đang tải…</div>
</div>

<script type="module">
const state = {
  subjects: [],
  currentSubject: '',
  excludeIds: [],
  currentQuestion: null,
  selectedOption: null,
  answered: false,
};

async function loadAll() {
  const wrap = document.getElementById('wrap');
  try {
    const meRes = await fetch('/api/auth/me', { credentials: 'same-origin' });
    if (meRes.status === 401) {
      wrap.innerHTML = `<div class="empty"><p>Hãy đăng nhập để học thông minh.</p><a class="back" href="/login.html">Đăng nhập →</a></div>`;
      return;
    }
    const [subjRes] = await Promise.all([
      fetch('/api/quiz/subjects', { credentials: 'same-origin' }),
    ]);
    if (subjRes.ok) {
      const data = await subjRes.json();
      state.subjects = (data.data || data.items || data || []).slice(0, 12);
      if (state.subjects.length > 0) state.currentSubject = String(state.subjects[0].id);
    }
    await Promise.all([loadTheta(), loadRecommendations(), loadNextQuestion()]);
    renderShell();
  } catch (e) {
    wrap.innerHTML = `<p style="color:var(--bad)">Lỗi: ${e.message}</p>`;
  }
}

async function loadTheta() {
  const r = await fetch(`/api/learning/theta?subject_id=${encodeURIComponent(state.currentSubject)}`, { credentials: 'same-origin' });
  state.theta = r.ok ? await r.json() : { theta: 0, n_attempts: 0, level: 'Trung bình' };
}

async function loadRecommendations() {
  const r = await fetch('/api/skills/next-recommended?limit=6', { credentials: 'same-origin' });
  state.recs = r.ok ? (await r.json()).items : [];
}

async function loadNextQuestion() {
  if (!state.currentSubject) { state.currentQuestion = null; return; }
  const r = await fetch('/api/quiz/adaptive-next', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ subject_id: state.currentSubject, exclude_ids: state.excludeIds.slice(-20) }),
    credentials: 'same-origin',
  });
  if (!r.ok) { state.currentQuestion = null; state.qError = (await r.json()).error; return; }
  const data = await r.json();
  state.currentQuestion = data.question;
  state.expectedDifficulty = data.expected_difficulty;
  state.selectedOption = null;
  state.answered = false;
  state.feedback = null;
}

function renderShell() {
  const wrap = document.getElementById('wrap');
  const t = state.theta || {};
  // Map theta [-3,3] → 0-100% for bar
  const thetaPct = Math.round(((t.theta + 3) / 6) * 100);

  wrap.innerHTML = `
    <div class="level-card">
      <div class="badge">🧠</div>
      <div class="info">
        <div class="lbl">Trình độ AI đánh giá</div>
        <div class="nm">${esc(t.level || 'Trung bình')}</div>
        <div class="meta">θ = <b>${(t.theta || 0).toFixed(2)}</b> · ${t.n_attempts || 0} câu đã làm · ${state.currentSubject ? 'môn đang học' : 'tổng quát'}</div>
        <div class="theta-bar">
          <i style="width:${thetaPct}%"></i>
          <div class="marker" style="left:${thetaPct}%"></div>
        </div>
      </div>
    </div>

    <div class="section-title"><span class="ic">📚</span> Chọn môn:</div>
    <div class="subject-picker" id="subj-picker">
      ${state.subjects.map(s => `
        <div class="s ${String(s.id) === state.currentSubject ? 'cur' : ''}" data-sid="${s.id}">${esc(s.name || s.slug || s.id)}</div>
      `).join('') || '<span class="empty">Chưa có môn nào.</span>'}
    </div>

    <div class="section-title"><span class="ic">🎯</span> Câu hỏi tiếp theo (adaptive)</div>
    <div id="quiz-host">${renderQuestion()}</div>

    <div class="section-title"><span class="ic">🗺️</span> Kỹ năng nên học kế tiếp</div>
    <div class="recommend-grid">
      ${state.recs && state.recs.length > 0 ? state.recs.map(r => `
        <div class="skill-rec">
          <div class="name">${esc(r.name)}</div>
          <div class="comp">${esc(r.competency.name)}</div>
          ${r.grade_min ? `<div class="grade">Lớp ${r.grade_min}${r.grade_max && r.grade_max !== r.grade_min ? '–' + r.grade_max : ''}</div>` : ''}
          <div class="prereq-mini"><i style="width:${r.prereq_progress}%"></i></div>
          <div class="prereq-lbl">Sẵn sàng học: ${r.prereq_progress}%</div>
        </div>
      `).join('') : '<div class="empty">Em đã đạt tất cả kỹ năng đề xuất — quay lại sau khi mở khoá thêm nội dung.</div>'}
    </div>
  `;

  document.getElementById('subj-picker').addEventListener('click', async (e) => {
    const el = e.target.closest('.s');
    if (!el) return;
    state.currentSubject = String(el.dataset.sid);
    state.excludeIds = [];
    await Promise.all([loadTheta(), loadNextQuestion()]);
    renderShell();
  });

  bindQuestion();
}

function renderQuestion() {
  const q = state.currentQuestion;
  if (state.qError) return `<div class="empty">⚠ ${esc(state.qError)} — chọn môn khác hoặc thử lại sau.</div>`;
  if (!q) return '<div class="empty">Chưa có câu hỏi.</div>';
  const answers = q.answers || q.options || [];
  return `
    <div class="quiz-card">
      <div class="meta">
        <span>Độ khó: <b>${(state.expectedDifficulty ?? 0).toFixed(2)}</b></span>
        <span>θ của em: <b>${(state.theta?.theta ?? 0).toFixed(2)}</b></span>
        <span>Loại: ${esc(q.question_type || 'mcq_single')}</span>
      </div>
      <div class="q-text">${esc(q.question || q.body || '(không có nội dung)')}</div>
      <div data-opts>
        ${answers.map((a, i) => `
          <label class="opt" data-val="${esc(a.id || a.value || i)}">
            <input type="radio" name="ans" value="${esc(a.id || a.value || i)}" style="margin-right:8px">
            ${esc(a.text || a.label || a.content || String(a))}
          </label>
        `).join('')}
      </div>
      <div class="actions">
        <button class="primary" data-submit ${state.answered ? 'disabled' : ''}>${state.answered ? '✓ Đã chấm' : 'Nộp câu trả lời'}</button>
        <button class="skip" data-skip>${state.answered ? 'Câu kế tiếp →' : 'Bỏ qua'}</button>
      </div>
      ${state.feedback ? `<div class="feedback ${state.feedback.correct ? 'ok' : 'bad'}">${state.feedback.html}</div>` : ''}
    </div>
  `;
}

function bindQuestion() {
  document.querySelectorAll('.quiz-card [data-opts] .opt').forEach(opt => {
    opt.addEventListener('click', () => {
      if (state.answered) return;
      document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
      state.selectedOption = opt.dataset.val;
    });
  });
  document.querySelector('.quiz-card [data-submit]')?.addEventListener('click', submitAnswer);
  document.querySelector('.quiz-card [data-skip]')?.addEventListener('click', skipNext);
}

async function submitAnswer() {
  const q = state.currentQuestion;
  if (!q || state.selectedOption == null || state.answered) return;
  try {
    const r = await fetch('/api/quiz/attempt', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_id: q.id, answer: state.selectedOption }),
      credentials: 'same-origin',
    });
    const data = await r.json();
    state.answered = true;
    state.feedback = {
      correct: !!data.correct,
      html: data.correct
        ? `✓ Đúng rồi! ${data.explanation ? '<br><small>' + escHtml(data.explanation) + '</small>' : ''}`
        : `✗ Chưa đúng. Đáp án: <b>${escHtml(String((data.correct_answers || []).join(', ')))}</b>${data.explanation ? '<br><small>' + escHtml(data.explanation) + '</small>' : ''}`,
    };
    // Highlight đúng/sai trên option
    document.querySelectorAll('.opt').forEach(o => {
      const v = String(o.dataset.val);
      const isCorrect = (data.correct_answers || []).map(String).includes(v);
      if (isCorrect) o.classList.add('correct');
      else if (o.classList.contains('selected') && !isCorrect) o.classList.add('wrong');
    });
    state.excludeIds.push(q.id);
    // Re-fetch theta (đã update)
    await loadTheta();
    document.getElementById('quiz-host').innerHTML = renderQuestion();
    bindQuestion();
  } catch (e) {
    console.warn('[hoc-thong-minh] submit error', e);
  }
}

async function skipNext() {
  if (!state.answered && state.currentQuestion) {
    state.excludeIds.push(state.currentQuestion.id);
  }
  await loadNextQuestion();
  document.getElementById('quiz-host').innerHTML = renderQuestion();
  bindQuestion();
  // Also re-render shell to refresh recommendations after enough attempts
  if (state.theta?.n_attempts % 5 === 0) {
    await loadRecommendations();
    renderShell();
  }
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escHtml(s) { return esc(s); }

loadAll();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-05-r3"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-05-r3"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-05"></script>
</body>
</html>
