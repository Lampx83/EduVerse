<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Module · EduVerse</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --success: #10b981; --info: #0ea5e9;
    --danger: #ef4444; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 24px 16px; min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.25), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.18), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  .container { max-width: 920px; margin: 0 auto; }
  .top-nav { display: flex; gap: 12px; margin-bottom: 24px; opacity: 0.85; font-size: 14px; }
  .top-nav a { color: rgba(255,255,255,0.7); text-decoration: none; }
  .top-nav a:hover { color: white; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .subtitle { opacity: 0.75; margin-bottom: 24px; font-size: 14px; }
  .info-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 20px; margin-bottom: 20px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3);
    padding: 4px 10px; border-radius: 12px; font-size: 12px;
  }
  .scenarios { display: block; margin-bottom: 20px; }

  /* 3 track học tập */
  .track {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
  }
  .track-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .track-icon { font-size: 20px; }
  .track-label { font-size: 16px; font-weight: 800; }
  .track-hint { font-size: 12px; opacity: 0.6; }
  .track-count { margin-left: auto; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.1); padding: 2px 9px; border-radius: 10px; }
  /* Thực hành nổi bật hơn */
  .track-practice {
    background: linear-gradient(135deg, rgba(20,184,166,0.14), rgba(139,92,246,0.10));
    border-color: rgba(20,184,166,0.4);
  }
  .track-practice .track-count { background: #14b8a6; color: #07221f; }
  .track-cards { display: grid; gap: 12px; }
  @media (min-width: 720px) { .track-cards { grid-template-columns: 1fr 1fr; } }

  .scn-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.15s;
    text-decoration: none; color: white; display: block;
  }
  .scn-card:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); transform: translateY(-2px); }
  .scn-card h4 { margin: 0 0 6px; }
  .scn-card .meta { font-size: 12px; opacity: 0.7; display: flex; gap: 10px; flex-wrap: wrap; }
  .scn-card .exp-desc { font-size: 12px; opacity: 0.78; margin-top: 8px; line-height: 1.45; }
  .scn-card.exp-card { border-color: rgba(20,184,166,0.45); }
  .scn-card.soon { opacity: 0.5; pointer-events: none; }
  .stub-tag { background: rgba(251,191,36,0.25); padding: 1px 7px; border-radius: 6px; font-size: 10px; }
  #app { min-height: 200px; }
  .scenario-header { padding: 16px 20px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 16px; }
  .scenario-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .scenario-desc { opacity: 0.8; font-size: 14px; }
  .scenario-meta { display: flex; gap: 12px; font-size: 12px; opacity: 0.7; margin-top: 6px; }

  .quiz-wrap { display: flex; flex-direction: column; gap: 14px; }
  .quiz-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .quiz-stem { margin-bottom: 12px; line-height: 1.55; }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice { background: rgba(255,255,255,0.04); padding: 10px 14px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .quiz-choice:hover { background: rgba(255,255,255,0.1); }
  .quiz-choice input { accent-color: var(--accent); }
  .submit-btn {
    margin-top: 14px; padding: 12px 24px; border: none; border-radius: 10px;
    background: var(--success); color: white; font-weight: 700; cursor: pointer;
    align-self: flex-start; font-family: inherit; font-size: 15px;
  }
  .submit-btn:hover { background: #34d399; }

  .calc-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .calc-input { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 14px; }
  .calc-input input {
    padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px;
  }
  .calc-result { margin-top: 12px; padding: 10px 14px; background: rgba(0,0,0,0.2); border-radius: 8px; }

  .drag-match-placeholder, .roleplay-placeholder,
  .identification-placeholder, .compound-lab-bridge {
    background: var(--card); border: 1px dashed var(--border);
    padding: 32px; border-radius: 12px; text-align: center; opacity: 0.85;
  }

  .result-card {
    margin-top: 20px; padding: 20px; background: rgba(16,185,129,0.1);
    border: 1px solid var(--success); border-radius: 14px;
  }
  .result-card.poor { background: rgba(239,68,68,0.1); border-color: var(--danger); }
  .result-stars { font-size: 32px; margin-bottom: 8px; }
  .result-score { font-size: 24px; font-weight: 700; }
  .result-breakdown { margin-top: 12px; }
  .result-row {
    background: rgba(0,0,0,0.2); padding: 10px 14px;
    border-radius: 8px; margin-bottom: 6px; font-size: 13px;
  }
  .result-row.ok { border-left: 3px solid var(--success); }
  .result-row.bad { border-left: 3px solid var(--danger); }
  .back-btn {
    margin-top: 16px; background: rgba(255,255,255,0.1); border: 1px solid var(--border);
    color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 14px;
  }

  .not-found {
    background: rgba(239,68,68,0.1); border: 1px solid var(--danger);
    padding: 24px; border-radius: 12px; text-align: center;
  }

  /* ── Weekly lesson (Tiểu học) ── */
  .wl { display: flex; flex-direction: column; gap: 14px; }
  .wl-card { background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 20px; line-height: 1.6; }
  .wl-intro { background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(139,92,246,0.08));
    border-color: rgba(251,191,36,0.3); }
  .wl-lead { font-size: 16px; margin: 0 0 8px; }
  .wl-obj { font-size: 14px; }
  .wl-sec { font-size: 15px; font-weight: 800; margin-bottom: 10px; opacity: 0.95; }
  .wl-h { margin: 14px 0 6px; font-size: 15px; color: var(--accent); }
  .wl-p { margin: 6px 0; }
  .wl-ul { margin: 6px 0; padding-left: 22px; }
  .wl-ul li { margin: 4px 0; }
  .wl-note { background: rgba(14,165,233,0.12); border-left: 3px solid var(--info);
    padding: 8px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .wl-ex { background: rgba(255,255,255,0.04); border-radius: 10px;
    padding: 10px 14px; margin: 8px 0; }
  .wl-ex-q { margin-bottom: 4px; }
  .wl-ex-a { color: var(--success); font-size: 14px; }
  .wl-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .wl-btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 700; }
  .wl-btn:disabled { opacity: 0.6; cursor: progress; }
  .wl-btn-primary { background: var(--success); color: #06281f; }
  .wl-btn-primary:hover { background: #34d399; }
  .wl-btn-ai { background: rgba(139,92,246,0.22); color: #ddd6fe;
    border: 1px solid rgba(139,92,246,0.5); }
  .wl-btn-ai:hover { background: rgba(139,92,246,0.4); }
  .wl-btn-bank { background: rgba(14,165,233,0.18); color: #bae6fd;
    border: 1px solid rgba(14,165,233,0.5); }
  .wl-btn-bank:hover { background: rgba(14,165,233,0.36); }
  .wl-ai-msg { font-size: 14px; }
  .wl-chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 320px;
    overflow-y: auto; margin: 8px 0; padding: 4px; }
  .wl-msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; max-width: 85%; line-height: 1.5; }
  .wl-msg-ai { background: rgba(139,92,246,0.18); align-self: flex-start; border-bottom-left-radius: 4px; }
  .wl-msg-me { background: rgba(16,185,129,0.18); align-self: flex-end; border-bottom-right-radius: 4px; }
  .wl-typing { opacity: 0.6; font-style: italic; }
  .wl-chat-row { display: flex; gap: 8px; }
  .wl-chat-input { flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.95);
    color: #1f2937; font-size: 14px; font-family: inherit; }
</style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="index.html">← Trang chủ</a>
    <span style="opacity:0.4">·</span>
    <span id="breadcrumb">Module</span>
  </div>

  <h1 id="page-title">Module</h1>
  <div class="subtitle" id="page-subtitle">Đang tải nội dung…</div>

  <div class="info-card" id="info" style="display:none">
    <div id="info-text"></div>
    <div class="chips" id="info-chips"></div>
  </div>

  <div id="picker" class="scenarios"></div>
  <div id="app"></div>
</div>

<script type="module">
  import { ScenarioEngine } from './js/engine/index.js';
  import { getScenariosForModule } from './js/scenarios/index.js';
  import { renderWeeklyLesson } from './js/engine/weekly-lesson.js';
  import { MODULES as PHARMACY_MODULES } from './js/engine/learning-path.js';
  import { getPlayerName, getClassCode } from './js/api.js';
  import { loadActiveDomain, getActiveDomainId, isGamifiedDomain } from './js/engine/domain.js';
  import { awardForResult, recordModuleStars, getProgress } from './js/engine/wallet.js';
  import { showRewardOverlay } from './js/engine/reward-fx.js';

  const params = new URLSearchParams(location.search);
  const moduleId = params.get('module') || 'L1.1';

  // backParam = lộ trình môn (subject.html) nếu mở từ đó. Breadcrumb dựng sau khi
  // biết domain (xem buildBreadcrumb bên dưới) để luôn có link cấp cha "Trường".
  const backParam = params.get('back');

  // Load the ACTIVE domain so module metadata + achievement catalog match
  // the school the student came from (falls back to pharmacy modules).
  let DOMAIN_MODULES = PHARMACY_MODULES, ACHIEVEMENTS = [], GET_SUBJECT = null, SCHOOL_NAME = 'Trường';
  try {
    const dom = await loadActiveDomain();
    DOMAIN_MODULES = dom.MODULES || PHARMACY_MODULES;
    ACHIEVEMENTS = dom.ACHIEVEMENTS || [];
    GET_SUBJECT = dom.getSubject || null;
    SCHOOL_NAME = dom.DOMAIN?.shortName || dom.DOMAIN?.name || dom.name || 'Trường';
  } catch {}
  const MODULES = DOMAIN_MODULES;

  // Breadcrumb phân cấp: Trang chủ › Trường › [Lộ trình môn] › Module.
  // Trước đây chỉ có "Trang chủ" nên không quay lại được trang trường → bổ sung
  // link cấp cha "Trường" (school.html?domain=X) LUÔN hiển thị.
  (function buildBreadcrumb() {
    try {
      const nav = document.querySelector('.top-nav');
      const crumb = document.getElementById('breadcrumb');
      const domainId = params.get('domain') || getActiveDomainId();
      const mkLink = (href, text) => { const a = document.createElement('a'); a.href = href; a.textContent = text; return a; };
      const mkSep = () => { const s = document.createElement('span'); s.style.opacity = '0.4'; s.textContent = '·'; return s; };
      // Chèn TRƯỚC breadcrumb (sau "Trang chủ"): Trường, rồi Lộ trình môn (nếu có).
      if (domainId) {
        nav.insertBefore(mkLink(`school.html?domain=${encodeURIComponent(domainId)}`, `🏫 ${SCHOOL_NAME}`), crumb);
        nav.insertBefore(mkSep(), crumb);
      }
      if (backParam) {
        nav.insertBefore(mkLink(decodeURIComponent(backParam), '📚 Lộ trình môn'), crumb);
        nav.insertBefore(mkSep(), crumb);
      }
    } catch (e) { console.warn('[breadcrumb]', e); }
  })();
  const moduleMeta = MODULES.find(m => m.id === moduleId)
    || PHARMACY_MODULES.find(m => m.id === moduleId);
  // Nhãn môn (cho AI "Học thêm" / "Hỏi cô giáo") — fallback về key nếu thiếu.
  const SUBJECT_LABEL = (GET_SUBJECT && moduleMeta?.subject)
    ? (GET_SUBJECT(moduleMeta.subject)?.label || moduleMeta.subject)
    : (moduleMeta?.subject || '');

  // Game hoá (XP/reward/quiz phản hồi tức thì) CHỈ cho Tiểu học + THCS.
  const GAMIFIED = isGamifiedDomain(getActiveDomainId());

  const picker = document.getElementById('picker');
  const app = document.getElementById('app');
  const title = document.getElementById('page-title');
  const subtitle = document.getElementById('page-subtitle');
  const info = document.getElementById('info');
  const infoText = document.getElementById('info-text');
  const infoChips = document.getElementById('info-chips');
  const breadcrumb = document.getElementById('breadcrumb');

  if (moduleMeta) {
    title.textContent = `${moduleId} · ${moduleMeta.title}`;
    subtitle.textContent = `Năm ${moduleMeta.yearLevel} · Môn: ${moduleMeta.subject}`;
    breadcrumb.textContent = `Năm ${moduleMeta.yearLevel} · ${moduleMeta.title}`;
    document.title = `${moduleId} · ${moduleMeta.title} — EduVerse`;
    info.style.display = 'block';
    infoText.innerHTML = `<b>Yêu cầu mở khoá:</b> ${moduleMeta.minStarsToUnlock} sao tích luỹ${moduleMeta.prerequisites?.length ? ` · <b>Tiền đề:</b> ${moduleMeta.prerequisites.join(', ')}` : ''}`;
    infoChips.innerHTML = `
      <span class="chip">📚 Năm ${moduleMeta.yearLevel}</span>
      <span class="chip">🎓 ${moduleMeta.subject}</span>
      ${moduleMeta.hasCertificate ? '<span class="chip">🏆 Cấp chứng chỉ</span>' : ''}
    `;
  } else {
    // Không có metadata (vd bài học lẻ của lộ trình môn) → lấy tiêu đề từ scenario.
    const scns = getScenariosForModule(moduleId);
    const s0 = scns[0];
    if (s0) {
      title.textContent = s0.title;
      const bits = [s0.chapter && `📂 ${s0.chapter}`, s0.boss && '👑 Boss', s0.difficulty && `⭐ Độ khó ${s0.difficulty}/5`].filter(Boolean);
      subtitle.textContent = bits.join(' · ');
      breadcrumb.textContent = s0.chapter || s0.title;
      document.title = `${s0.title} — EduVerse`;
    } else {
      title.textContent = moduleId;
      subtitle.textContent = 'Bài học';
    }
  }

  // 3 track học tập. Thực hành đặt TRÊN CÙNG (ưu tiên trải nghiệm).
  const TRACKS = [
    { key: 'practice', icon: '🧪', label: 'Thực hành — làm & trải nghiệm',
      hint: 'Ưu tiên: học bằng làm', kinds: ['compound-lab', 'titration', 'arrange', 'identification', 'calculator', 'drag-match'] },
    { key: 'theory', icon: '📖', label: 'Lý thuyết',
      hint: 'Kiến thức nền tảng', kinds: ['quiz'] },
    { key: 'skill', icon: '🎯', label: 'Luyện kỹ năng',
      hint: 'Tư vấn · OSCE · viết SOAP · role-play', kinds: ['patient-roleplay', 'soap-write', 'osce-station', 'structure-draw'] },
  ];
  const kindToTrack = {};
  for (const t of TRACKS) for (const k of t.kinds) kindToTrack[k] = t.key;

  function renderPicker() {
    const scenarios = getScenariosForModule(moduleId);
    const experiences = moduleMeta?.experiences || [];

    if (!scenarios.length && !experiences.length) {
      app.innerHTML = `<div class="not-found">
        <h3>⏳ Module ${moduleId} chưa có nội dung</h3>
        <p>Ban điều hành AI đang phát triển. Bạn có thể gửi yêu cầu ở trang trường để được ưu tiên!</p>
        <button class="back-btn" onclick="history.back()">← Quay lại</button>
      </div>`;
      return;
    }

    // Gom item vào 3 track
    const buckets = { practice: [], theory: [], skill: [] };
    // Experiences (2D/3D/VR/Meta) → luôn là Thực hành
    for (const e of experiences) {
      buckets.practice.push({ kind: 'experience', exp: e });
    }
    // Scenarios → theo kind
    for (const s of scenarios) {
      const track = kindToTrack[s.kind] || 'theory';
      buckets[track].push({ kind: 'scenario', scenario: s });
    }

    picker.innerHTML = TRACKS.map(t => {
      const items = buckets[t.key];
      if (!items.length) return '';
      const cards = items.map(it => it.kind === 'experience'
        ? expCard(it.exp)
        : scnCard(it.scenario)).join('');
      return `
        <section class="track track-${t.key}">
          <div class="track-head">
            <span class="track-icon">${t.icon}</span>
            <span class="track-label">${t.label}</span>
            <span class="track-hint">${t.hint}</span>
            <span class="track-count">${items.length}</span>
          </div>
          <div class="track-cards">${cards}</div>
        </section>
      `;
    }).join('');

    // Wire scenario cards (chạy engine) + experience cards (mở trang)
    picker.querySelectorAll('.scn-card[data-id]').forEach(card => {
      card.addEventListener('click', () => startScenario(card.dataset.id));
    });
    app.innerHTML = '';
  }

  function scnCard(s) {
    return `
      <div class="scn-card" data-id="${s.id}">
        <h4>${s.title}</h4>
        <div class="meta">
          <span>🎯 ${s.kind}</span>
          <span>⭐ ${s.difficulty ?? '—'}/5</span>
          ${s.questions ? `<span>${s.questions.length} câu</span>` : ''}
          ${s.correctPairs ? `<span>${s.correctPairs.length} cặp</span>` : ''}
          ${s.targets ? `<span>${s.targets.length} ảnh</span>` : ''}
          ${s.isStub ? '<span class="stub-tag">nháp</span>' : ''}
        </div>
      </div>`;
  }

  function expCard(e) {
    const external = e.status === 'external' ? 'target="_blank" rel="noopener"' : '';
    const soon = e.status === 'soon';
    return `
      <a class="scn-card exp-card ${soon ? 'soon' : ''}" href="${soon ? '#' : e.url}" ${external}
         ${soon ? 'aria-disabled="true"' : ''}>
        <h4>${e.icon || '🧪'} ${e.label}</h4>
        <div class="meta"><span>${e.tech || ''}</span>${soon ? '<span class="stub-tag">sắp có</span>' : ''}</div>
        ${e.desc ? `<div class="exp-desc">${e.desc}</div>` : ''}
      </a>`;
  }

  function runEngine(scenario) {
    picker.innerHTML = '';
    app.innerHTML = '';
    _completed = false;
    const engine = new ScenarioEngine({
      host: app,
      scenario,
      playerName: getPlayerName() || 'Ẩn danh',
      classCode: getClassCode() || undefined,
      instantFeedback: GAMIFIED,            // quiz phản hồi tức thì chỉ ở Tiểu học/THCS
      onComplete: (result) => handleComplete(result, scenario),
    });
    engine.start();
  }

  function startScenario(id) {
    picker.innerHTML = '';
    app.innerHTML = '';
    const scenarios = getScenariosForModule(moduleId);
    const scenario = scenarios.find(s => s.id === id);
    if (!scenario) return renderPicker();

    // Tuần học có lý thuyết (Tiểu học) → hiện màn bài giảng + nút AI trước,
    // bấm "Làm bài kiểm tra" mới chạy quiz. Bài AI "Học thêm" chạy như quiz
    // bonus (không ghi điểm để tránh farm).
    if (scenario.lesson && GAMIFIED) {
      renderWeeklyLesson({
        host: app,
        scenario,
        grade: moduleMeta?.yearLevel || 2,
        subjectLabel: SUBJECT_LABEL,
        onStartQuiz: () => runEngine(scenario),
        onStartBonus: (bonus) => runEngine(bonus),
      });
      return;
    }
    runEngine(scenario);
  }

  // Chống nộp/“Hoàn thành” nhiều lần để farm điểm: chỉ xử lý 1 lần.
  let _completed = false;

  async function handleComplete(result, scenario) {
    if (_completed) return;
    _completed = true;

    // Trường KHÔNG game hoá (Dược, CNTT…): giữ hành vi cũ — chỉ hiện kết quả,
    // không thưởng XP/coin, không màn reward.
    if (!GAMIFIED) { showResult(result); return; }

    let award = null;
    try {
      const progress = getProgress();
      const mod = moduleMeta || { id: moduleId, subject: scenario?.subject };
      award = awardForResult(progress, mod, result, ACHIEVEMENTS);
      recordModuleStars(moduleId, result.stars);
    } catch (e) { console.warn('[reward] award failed', e); }

    try {
      if (award) await showRewardOverlay({ result, award, wallet: award.wallet });
    } catch (e) { console.warn('[reward] overlay failed', e); }

    // Làm xong là THOÁT ngay về lộ trình (chống bấm hoàn thành nhiều lần).
    const dest = backParam
      ? decodeURIComponent(backParam)
      : `school.html?domain=${encodeURIComponent(getActiveDomainId())}`;
    location.href = dest;
  }

  function showResult(result) {
    const stars = '⭐'.repeat(result.stars) + '☆'.repeat(3 - result.stars);
    const poor = result.score < 50;
    const card = document.createElement('div');
    card.className = 'result-card' + (poor ? ' poor' : '');
    card.innerHTML = `
      <div class="result-stars">${stars}</div>
      <div class="result-score">${result.score}/100</div>
      <div style="opacity:0.8;margin-top:6px">Thời gian: ${(result.durationMs / 1000).toFixed(1)}s</div>
      <div class="result-breakdown">
        ${result.rubricBreakdown.map(r => `
          <div class="result-row ${r.score >= 0.5 ? 'ok' : 'bad'}">
            <b>${r.criterion}</b> — ${r.feedback}
          </div>
        `).join('')}
      </div>
      <button class="back-btn">← Quay lại danh sách bài tập</button>
    `;
    app.appendChild(card);
    card.querySelector('.back-btn').addEventListener('click', renderPicker);
  }

  renderPicker();
</script>
</body>
</html>
