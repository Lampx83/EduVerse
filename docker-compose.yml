services:
  pharmacysim:
    build: .
    image: pharmacysim:latest
    container_name: pharmacysim
    restart: unless-stopped
    ports:
      - "8041:8041"
    environment:
      NODE_ENV: production
      PORT: 8041
      HOST: 0.0.0.0
      DATA_DIR: /data
      # Optional path prefix when deployed behind a reverse proxy at a sub-path.
      # Set to "/ps" for limio.vn/ps, leave empty for root or subdomain.
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - pharmacysim-data:/data

volumes:
  pharmacysim-data:
    driver: local
