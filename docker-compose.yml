services:
  tizia:
    build:
      context: .
    image: tizia:latest
    container_name: tizia
    restart: unless-stopped
    ports:
      - "8041:8041"
    environment:
      NODE_ENV: production
      PORT: 8041
      HOST: 0.0.0.0
      DATA_DIR: /data
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - pharmacysim-data:/data

volumes:
  pharmacysim-data:
    driver: local
